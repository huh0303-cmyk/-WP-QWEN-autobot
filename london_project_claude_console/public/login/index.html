<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>런던프로젝트클로드 로그인</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  form { background:#fff; padding:32px 28px; border-radius:12px; width:320px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  h1 { font-size:18px; margin:0 0 4px; color:#0f172a; }
  p.sub { font-size:13px; color:#64748b; margin:0 0 20px; }
  label { display:block; font-size:13px; color:#334155; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
  button { margin-top:20px; width:100%; padding:11px; border:none; border-radius:8px; background:#0f172a; color:#fff; font-size:14px; cursor:pointer; }
  button:hover { background:#1e293b; }
  .err { color:#dc2626; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>런던프로젝트클로드</h1>
  <p class="sub">네이버 · 티스토리 블로그 자동화 콘솔</p>
  <label>아이디</label>
  <input type="text" id="username" autocomplete="username" required />
  <label>비밀번호</label>
  <input type="password" id="password" autocomplete="current-password" required />
  <div class="err" id="err">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  <button type="submit">로그인</button>
</form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("err");
  errEl.style.display = "none";
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw new Error();
    location.href = "/";
  } catch {
    errEl.style.display = "block";
  }
});
</script>
</body>
</html>
