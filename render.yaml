services:
  - type: web
    name: korea365-ceo-control-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-control-center.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 control_center.app:app
    healthCheckPath: /healthz
    domains:
      - control.korea365.org
    autoDeployTrigger: commit
    # 2026-09-06: automated bots on this repo commit to main every 1-5
    # minutes (Tistory image hosting, budget guard state), and each commit
    # was redeploying this service and killing every in-flight background
    # publish thread mid-run - the CEO would click "WP 25개 발행" and the
    # status panel would go right back to "아직 실행한 적 없음" a few minutes
    # later because the whole instance (and its ephemeral state files) had
    # just been replaced. Only these two high-frequency, control-center-
    # irrelevant paths are excluded; everything else the dashboard actually
    # reads from disk still redeploys normally to stay fresh.
    buildFilter:
      ignoredPaths:
        - assets/tistory_images/**
        - budget_state.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONTROL_CENTER_USERNAME
        value: ceo
      - key: CONTROL_CENTER_PASSWORD
        generateValue: true
      - key: CONTROL_CENTER_SECRET_KEY
        generateValue: true
      - key: CONTROL_CENTER_CSRF
        generateValue: true
      - key: CONTROL_CENTER_GITHUB_REPO
        value: huh0303-cmyk/-WP-QWEN-autobot
