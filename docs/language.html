<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Center</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #1a1a1a; --sub: #666666;
    --accent: #d97706; --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1c1c1c; --text: #f2f2f2; --sub: #a0a0a0; --border: #2e2e2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; padding: 48px 20px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px;
    background: linear-gradient(135deg, #d97706, #db2777);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff; font-weight: 700;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.tagline { color: var(--sub); font-size: 14px; margin: 0 0 28px; }
  a.link-btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 20px; margin-bottom: 12px;
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
    transition: transform .15s;
  }
  a.link-btn:active { transform: scale(0.98); }
  .icon { font-size: 20px; width: 24px; text-align: center; }
  footer { margin-top: 32px; color: var(--sub); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar">L</div>
  <h1>Language Center</h1>
  <p class="tagline">10개국어 단어 퀴즈 콘텐츠</p>

  <a class="link-btn" href="https://www.youtube.com/channel/UCOWoNH_d6p45ywQ6W0Z1Jng">
    <span class="icon">▶</span> YouTube
  </a>
  <a class="link-btn" href="https://www.instagram.com/sis_language/">
    <span class="icon">◎</span> Instagram
  </a>
  <a class="link-btn" href="https://www.threads.net/@sis_language">
    <span class="icon">@</span> Threads
  </a>
  <a class="link-btn" href="https://www.facebook.com/61593057083167">
    <span class="icon">f</span> Facebook
  </a>

  <footer>Language Center</footer>
</div>
</body>
</html>
