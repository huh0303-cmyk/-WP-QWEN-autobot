<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korea365 · 노출·클릭 · GSC 검색 성과</title>
<style>
body{font-family:system-ui,"Malgun Gothic",sans-serif;margin:8px;background:#f6f7f9;color:#1c1c1e}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:#666;font-size:.85rem;margin-bottom:8px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:.85rem}
select{padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}
.table-wrap{width:100%;overflow:auto;background:#fff;border:1px solid #dbe2ea}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;background:#fff;font-size:.84rem;table-layout:auto}
th,td{padding:5px 7px;border-bottom:1px solid #e5e7eb;text-align:right;white-space:nowrap}
th{background:#1f2937;color:#fff;position:sticky;top:0;z-index:3}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;text-align:center;min-width:48px;width:48px;background:#eef2f7;font-weight:800;border-right:1px solid #cbd5e1}
th:first-child,td:first-child{left:0;z-index:6}
th:first-child{z-index:8;background:#1f2937}
th:nth-child(2),td:nth-child(2){text-align:left;min-width:68px;width:68px}
th:nth-child(3),td:nth-child(3){position:sticky;left:48px;z-index:4;text-align:left;padding-left:7px;padding-right:8px;min-width:150px;background:#fff;border-right:1px solid #cbd5e1;box-shadow:2px 0 3px rgba(15,23,42,.08)}
th:nth-child(3){left:48px;z-index:7;background:#1f2937;color:#fff}
td:nth-child(3) a{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
th:nth-child(n+4),td:nth-child(n+4){padding-left:6px;padding-right:6px}

.up{color:#1d4ed8;font-weight:700}.down{color:#dc2626;font-weight:700}.na{color:#999}.tag{font-size:.72rem;padding:1px 6px;border-radius:8px;background:#e5e7eb}
.WP{background:#dbeafe}.BS{background:#fde68a}.TS{background:#fce7f3}.NV{background:#dcfce7}.NR{background:#e9d5ff}
.d{font-size:.78rem;margin-left:5px}
</style></head><body>
<h1>Korea365 노출·클릭 · GSC 검색 성과 현황</h1>
<div class="sub" id="meta">Google Search Console 데이터를 불러오는 중...</div>
<div class="bar"><label for="sortKey">정렬 기준</label>
<select id="sortKey"><option value="clicks">GSC 클릭수</option><option value="impressions">GSC 노출수</option><option value="visitors">일일방문자</option></select>
<span class="na">기준 값이 같으면 다음 지표로 순서를 정합니다</span></div>
<div class="table-wrap"><table><thead><tr><th>순위</th><th>구분</th><th>사이트</th><th>일일방문자 (증감)</th><th>GSC 노출 (증감)</th><th>GSC 클릭 (증감)</th><th>최근 16개월 클릭</th><th>GSC 사이트맵 색인 수</th><th>색인 상태</th></tr></thead>
<tbody id="b"></tbody></table></div>
<script>
var J=null;
function f(v){return Number(v).toLocaleString()}
function d(v){if(v===null||v===undefined)return '';return v>0?'<span class="d up">▲ +'+f(v)+'</span>':v<0?'<span class="d down">▼ -'+f(Math.abs(v))+'</span>':'<span class="d na">– 0</span>'}
function cell(val,delta,naText){return val===null||val===undefined||!Number.isFinite(val)?'<span class="na">'+(naText||'GSC에서 확인 불가')+'</span>':'<b>'+f(val)+'</b>'+d(delta)}
function n(v){return v===null||v===undefined?'<span class="na">GSC에서 확인 불가</span>':f(v)}
function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u,site){return /^https:\/\//.test(u||'')?u:'https://'+String(site||'').replace(/[^a-z0-9.\-\/]/gi,'')}
function platformCell(p){var m={wordpress:['WP','WP'],blogspot:['Blogspot','BS'],tistory:['Tistory','TS'],naver:['Naver','NV'],newsroom:['신문','NR']};var v=m[p]||[p,''];return '<span class="tag '+v[1]+'">'+v[0]+'</span>'}
function val(r,k){return Number.isFinite(r[k])?r[k]:null}
function draw(){
  if(!J)return;
  var key=document.getElementById('sortKey').value;
  var order=[key].concat(['visitors','impressions','clicks'].filter(function(x){return x!==key}));
  var rows=(J.rows||[]).slice().sort(function(a,b){
    for(var i=0;i<order.length;i++){
      var av=val(a,order[i]),bv=val(b,order[i]);
      if(av===null&&bv!==null)return 1; if(av!==null&&bv===null)return -1;
      if(av!==null&&bv!==null&&av!==bv)return bv-av;
    }
    return String(a.site||'').localeCompare(String(b.site||''),'ko');
  });
  var names={impressions:'GSC 노출수',clicks:'GSC 클릭수',visitors:'일일방문자'};
  var hasImp=rows.some(function(r){return Number.isFinite(r.impressions)});
  var g=new Date(J.generated_at),age=(Date.now()-g.getTime())/3600000,stale=!Number.isFinite(age)||age>30;
  var m=document.getElementById('meta');
  m.textContent='GSC 기준일 '+J.reference_date+' · 데이터 생성 '+String(J.generated_at||'').slice(0,16).replace('T',' ')+' · 정렬: '+names[key]+' 내림차순'+(key==='visitors'&&!rows.some(function(r){return Number.isFinite(r.visitors)})?' (일일방문자 데이터 수집 전이라 노출수·클릭수 순)':'')+(hasImp?'':' · 노출수는 다음 자동 갱신(매일 07:00 KST)부터 표시')+' · 클릭·노출은 실제 방문자 수가 아님'+(stale?' · ⚠ 데이터 갱신 지연':'');
  m.style.color=stale?'#b45309':'';
  document.getElementById('b').innerHTML=rows.map(function(r,i){
    var ranked=order.some(function(k){return val(r,k)!==null});
    var vis=Number.isFinite(r.visitors)?'<b>'+f(r.visitors)+'</b>'+d(r.visitors_delta):'<span class="na">수집 전</span>';
    var st=r.google_indexed_status==='OK'?'확인됨':r.status==='NO_GSC_ACCESS'?'GSC 접근 불가':r.status==='QUERY_ERROR'?'조회 오류':'GSC에서 확인 불가';
    return '<tr><td>'+(ranked?(i+1)+'위':'—')+'</td><td>'+platformCell(r.platform)+'</td><td><a href="'+esc(safeUrl(r.url,r.site))+'" target="_blank" rel="noopener">'+esc(r.display_name||r.site)+'</a></td><td>'+vis+'</td><td>'+cell(val(r,'impressions'),r.impressions_delta,hasImp?'':'수집 전')+'</td><td>'+cell(val(r,'clicks'),r.clicks_delta)+'</td><td>'+n(r.cumulative)+'</td><td>'+n(r.google_indexed)+'</td><td>'+esc(st)+'</td></tr>';
  }).join('');
}
document.getElementById('sortKey').addEventListener('change',draw);
fetch('dashboard.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  J=j;
  var hasV=(j.rows||[]).some(function(r){return Number.isFinite(r.visitors)});
  document.getElementById('sortKey').value=hasV?'visitors':'clicks';
  draw();
}).catch(function(e){var m=document.getElementById('meta');m.textContent='GSC 데이터를 불러오지 못했습니다: '+e.message;m.style.color='#b91c1c'});
</script></body></html>
