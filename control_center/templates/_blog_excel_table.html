<section id="daily-core-metrics" class="rounded-2xl border border-slate-300 bg-white shadow-sm" style="min-width:0;overflow:hidden">
  <div style="display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #cbd5e1;background:#f8fafc">
    <div>
      <h2 style="margin:0;font-size:20px;font-weight:900;color:#0f172a">오늘 글쓰기 기본 순위 · 블로그 68개 통합</h2>
      <p style="margin:4px 0 0;font-size:12px;color:#475569">전 플랫폼 완전 혼합 · 어제 방문자수 기준 매일 재산정 · WP25 + 뉴스2 + Blogspot33 + Naver3 + Tistory5</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="control-blog-sheet-updated" style="font-size:11px;color:#64748b">갱신 중…</span>
      <a href="/api/blog-korea365/ranking.csv" style="display:inline-block;padding:8px 11px;border:1px solid #94a3b8;border-radius:7px;background:white;font-size:11px;font-weight:800;color:#0f172a">CSV 다운로드</a>
      <a href="https://blog.korea365.org" style="display:inline-block;padding:8px 11px;border-radius:7px;background:#1d4ed8;font-size:11px;font-weight:800;color:white">BLOG 앱 열기</a>
    </div>
  </div>
  <div style="overflow:auto;max-height:72vh">
    <table id="control-blog-sheet" style="width:100%;border-collapse:separate;border-spacing:0;min-width:1180px;font-size:12px">
      <thead style="position:sticky;top:0;z-index:3;background:#e2e8f0">
        <tr>
          <th style="width:56px">순위</th><th style="width:90px">플랫폼</th><th style="min-width:220px;text-align:left">사이트</th>
          <th>어제 방문자(증감)</th><th>총 방문자(증감)</th><th>총 콘텐츠(증감)</th><th>Google 색인(증감)</th>
          <th style="min-width:160px">데이터 상태</th><th style="min-width:110px">사이트 생성일</th><th style="min-width:140px">확인시각</th>
        </tr>
      </thead>
      <tbody id="control-blog-sheet-body"><tr><td colspan="10" style="padding:26px;text-align:center;color:#64748b">68개 데이터를 불러오는 중…</td></tr></tbody>
    </table>
  </div>
</section>
<style>
#control-blog-sheet th,#control-blog-sheet td{padding:8px 10px;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;white-space:nowrap;text-align:right}
#control-blog-sheet th{font-weight:900;color:#0f172a;text-align:center}
#control-blog-sheet td:first-child,#control-blog-sheet td:nth-child(2){text-align:center;font-weight:900}
#control-blog-sheet td:nth-child(3){text-align:left}
#control-blog-sheet tbody tr:nth-child(even){background:#f8fafc}
#control-blog-sheet tbody tr:hover{background:#eff6ff}
#control-blog-sheet a{color:#1d4ed8;text-decoration:underline;font-weight:800}
.sheet-up{color:#059669;font-weight:800}.sheet-down{color:#dc2626;font-weight:800}.sheet-flat{color:#64748b}.sheet-warn{color:#b45309;font-weight:800}.sheet-good{color:#047857;font-weight:800}
</style>
<script>
(function(){
  const body=document.getElementById('control-blog-sheet-body');
  const updated=document.getElementById('control-blog-sheet-updated');
  const nf=new Intl.NumberFormat('ko-KR');
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const d=(value)=>{
    if(!Number.isFinite(value)) return '<span class="sheet-warn">(연결 필요)</span>';
    const cls=value>0?'sheet-up':value<0?'sheet-down':'sheet-flat';
    return '<span class="'+cls+'">('+(value>0?'+':'')+nf.format(value)+')</span>';
  };
  const metric=(value,delta)=>Number.isFinite(value)?nf.format(value)+' '+d(delta):'<span class="sheet-warn">연결 필요</span>';
  const platform=c=>c.kind==='news'?'NEWS':({wordpress:'WP',blogspot:'BLOGSPOT',naver:'NAVER',tistory:'TISTORY'}[c.platform]||String(c.platform||'').toUpperCase());
  const state=c=>{
    const s=c.connector_status||{};
    const bad=Object.entries(s).filter(([,v])=>!v?.connected).map(([k])=>k);
    const labels={visitors:'방문자',visitor_delta:'증감',content:'콘텐츠',index:'색인'};
    return bad.length?'<span class="sheet-warn">연결 필요: '+esc(bad.map(k=>labels[k]||k).join(', '))+'</span>':'<span class="sheet-good">4지표 정상</span>';
  };
  async function loadSheet(){
    try{
      const r=await fetch('/api/blog-korea365/ranking',{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data=await r.json();
      body.innerHTML=(data.cards||[]).map(c=>'<tr>'+
        '<td>'+(Number.isFinite(c.row_number)?c.row_number+'위':'—')+'</td>'+
        '<td>'+platform(c)+'</td>'+
        '<td><a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.name||c.url)+'</a></td>'+
        '<td>'+metric(c.yesterday_visitors,c.yesterday_visitors_delta)+'</td>'+
        '<td>'+metric(c.total_visitors,c.total_visitors_delta)+'</td>'+
        '<td>'+metric(c.total_content,c.total_content_delta)+'</td>'+
        '<td>'+metric(c.google_indexed,c.google_indexed_delta)+(c.google_indexed_verified_via==='gsc'?' <span class="sheet-good">GSC</span>':'')+'</td>'+
        '<td>'+state(c)+'</td>'+
        '<td style="text-align:center">'+esc(c.opening_date||'미확인')+'</td>'+
        '<td style="text-align:center;color:#64748b">'+esc((c.checked_at||'').replace('T',' ').slice(0,16)||'연결 필요')+'</td>'+
      '</tr>').join('');
      updated.textContent='순위 기준 '+(data.ranking_date||'')+' · 갱신 '+String(data.generated_at||'').replace('T',' ').slice(0,16)+' KST';
    }catch(e){
      body.innerHTML='<tr><td colspan="10" style="padding:26px;text-align:center;color:#b91c1c">데이터 연결 오류: '+esc(e.message)+'</td></tr>';
      updated.textContent='갱신 실패';
    }
  }
  loadSheet();
  setInterval(loadSheet,300000);
})();
</script>
