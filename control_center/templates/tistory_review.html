<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.75;color:#172033;background:#f8fafc}main{background:#fff;padding:28px;border-radius:22px;box-shadow:0 10px 35px #0f172a12}img{display:block;width:100%;max-height:520px;object-fit:cover;height:auto;border-radius:16px;background:#e2e8f0}.meta{background:#ecfeff;padding:16px;border-radius:14px;margin:18px 0}.lock{color:#b45309;font-weight:800}.actions{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;background:#fff;padding:14px 0;border-bottom:1px solid #e2e8f0}.approve{border:0;border-radius:12px;background:#0f766e;color:#fff;padding:14px 20px;font-weight:900;font-size:15px;cursor:pointer}.back{color:#475569;font-weight:700;text-decoration:none}@media(max-width:640px){body{padding:10px}main{padding:18px}.actions{align-items:stretch;flex-direction:column}.approve{width:100%}}</style></head>
<body><main><div class="actions"><form method="post" action="{{ url_for('approve_tistory_draft', job_id=job_id) }}"><input type="hidden" name="site_id" value="{{ site_id }}"><input type="hidden" name="manager_url" value="{{ manager_url }}"><button class="approve" type="submit">승인 완료 처리 → 티스토리 편집기 열기</button></form><a class="back" href="/#tistory">티스토리 통제실로 돌아가기</a></div><p class="lock">비공개 검토 대기 · 검토 후 위 승인 버튼을 누르세요</p><h1>{{ title }}</h1>
<div class="meta"><b>채널</b> {{ site_id }} · <b>카테고리</b> {{ category }} · <b>상태</b> {{ visibility }}<br><b>검색 설명</b> {{ description }}</div>
<article>{{ body_html|safe }}</article></main></body></html>
