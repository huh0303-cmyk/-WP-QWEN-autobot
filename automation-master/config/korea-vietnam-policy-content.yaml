content_factory:
  blog:
    initial_queue: 20
    default_language: English
    localization: [Korean, Vietnamese]
    seo: [search_intent, FAQ, schema, internal_links, primary_source_citation]
    publish_state: draft
    duplicate_guard: true
  youtube:
    formats:
      - {type: short, duration_seconds: '45-60', quantity_per_pillar: 5}
      - {type: explainer, duration_minutes: '5-8', quantity_per_pillar: 2}
    publish_state: private
    narration_fact_check: true
  social:
    targets: [TikTok, Facebook, Instagram, Threads]
    formats: [short_video, carousel, infographic, text_summary]
    platform_specific_caption: true
    publish_state: draft_private

conversion:
  primary_cta: free Korea study eligibility and policy update guide
  funnels:
    - blog_to_study_application
    - short_video_to_blog
    - social_to_policy_guide
    - university_B2B_to_partnership_inquiry

safety:
  never_guarantee_visa: true
  never_guarantee_degree_recognition: true
