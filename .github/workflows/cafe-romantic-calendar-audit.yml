name: CAFE_ROMANTIC - Calendar audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cafe-romantic-calendar-audit.yml"
      - "scripts/cafe_romantic_calendar_audit.py"

permissions:
  contents: read

jobs:
  inspect-globalmusic-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: youtube-channels
    env:
      PYTHONUTF8: "1"
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google Sheets read-only runtime
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Read CAFE_ROMANTIC control and calendar rows without modifying the sheet
        run: |
          python -m py_compile scripts/cafe_romantic_calendar_audit.py
          python scripts/cafe_romantic_calendar_audit.py
