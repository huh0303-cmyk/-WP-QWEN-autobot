name: Daily dashboard (WP + Blogspot)

on:
  push:
    branches: [main]
    paths:
      - "scripts/daily_dashboard.py"
      - "docs/index.html"
      - ".github/workflows/daily-dashboard.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "0 22 * * *" # 07:00 KST

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyjwt cryptography -q
      - name: Collect dashboard metrics
        env:
          GOOGLE_METRICS_CLIENT_ID: ${{ secrets.GOOGLE_METRICS_CLIENT_ID }}
          GOOGLE_METRICS_CLIENT_SECRET: ${{ secrets.GOOGLE_METRICS_CLIENT_SECRET }}
          GOOGLE_METRICS_REFRESH_TOKEN: ${{ secrets.GOOGLE_METRICS_REFRESH_TOKEN }}
        run: python scripts/daily_dashboard.py
      - name: Commit
        run: |
          git config user.name "korea365-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard.json docs/index.html data/dashboard_history.json
          git diff --cached --quiet || git commit -m "data: daily dashboard [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
