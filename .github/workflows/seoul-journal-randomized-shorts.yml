name: Seoul Journal public daily three Shorts
on:
  schedule:
    # KST 08-10, 13-15, 19-22; exact date-specific slot picked by gate.
    - cron: "*/10 23,0,4,5,10,11,12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: [morning, midday, evening]
        default: morning
      reuse_run:
        description: "Reuse rendered artifacts from an authorized earlier run"
        type: string
        default: ""
      revise_video:
        description: "Legacy approved revision target"
        type: string
        default: ""
      article_url:
        description: "Use this exact eligible Naver article URL"
        type: string
        default: ""
      rebuild_of:
        description: "Existing video ID this new private review package replaces"
        type: string
        default: ""
      publish_at:
        description: "Optional ISO8601 scheduled publish time with timezone"
        type: string
        default: ""
      verify_only:
        description: "Run full production without another public upload"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: seoul-journal-public-upload
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.gate.outputs.slot }}
      category: ${{ steps.gate.outputs.category }}
      publish_at: ${{ steps.gate.outputs.publish_at }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/seoul_journal_slot_gate.py
          else
            echo "slot=$SELECTED_SLOT" >> "$GITHUB_OUTPUT"
            case "$SELECTED_SLOT" in
              morning) echo "category=politics" >> "$GITHUB_OUTPUT" ;;
              midday) echo "category=social" >> "$GITHUB_OUTPUT" ;;
              evening) echo "category=hot_issue" >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          fi
  publish:
    needs: pick
    if: ${{ needs.pick.outputs.slot != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: FISH_AUDIO_API_KEY
    env:
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
      SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
      SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      REVISE_VIDEO: ${{ inputs.revise_video }}
      INPUT_ARTICLE_URL: ${{ inputs.article_url }}
      REBUILD_OF: ${{ inputs.rebuild_of }}
      PUBLISH_AT: ${{ inputs.publish_at || needs.pick.outputs.publish_at }}
      SJ_FISH_MALE_ANCHOR: ${{ secrets.SJ_FISH_MALE_ANCHOR }}
      SJ_FISH_FEMALE_ANCHOR: ${{ secrets.SJ_FISH_FEMALE_ANCHOR }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      SLOT: ${{ needs.pick.outputs.slot }}
      CATEGORY: ${{ needs.pick.outputs.category }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install requests beautifulsoup4 Pillow edge-tts google-api-python-client google-auth google-auth-httplib2
      - name: Generate original story and publish once per KST slot
        if: ${{ inputs.reuse_run == '' }}
        run: python scripts/seoul_journal_public_daily.py
      - name: Restore rendered authorized revision
        if: ${{ inputs.reuse_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: seoul-journal-public-${{ inputs.reuse_run }}
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: artifacts/seoul-journal-reuse/
      - name: Refresh restored review package
        if: ${{ inputs.reuse_run != '' && inputs.verify_only == true }}
        run: python scripts/seoul_journal_refresh_package.py artifacts/seoul-journal-reuse/
      - name: Publish restored revision
        if: ${{ inputs.reuse_run != '' && inputs.verify_only != true }}
        env:
          SEOUL_JOURNAL_SLOT_MARKER: SJ_REVISION:oEZaFVnqKR0:motion-v2
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from seoul_journal_publish_package import main
          folders=list(Path("artifacts/seoul-journal-reuse").rglob("package.json"))
          if len(folders)!=1: raise RuntimeError("Expected exactly one rendered package")
          sys.argv=["publish","--package",str(folders[0].parent),"--publish"]
          main()
          PY
      - name: Preserve source, rights, presentation and public receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-journal-public-${{ github.run_id }}
          path: |
            artifacts/seoul-journal-public/
            artifacts/seoul-journal-reuse/
          if-no-files-found: warn
          retention-days: 14
