name: Seoul Journal public daily three Shorts
on:
  schedule:
    # KST 08-10, 13-15, 19-22; exact date-specific slot picked by gate.
    - cron: "*/10 23,0,4,5,10,11,12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: [morning, midday, evening]
        default: morning
permissions:
  contents: read
concurrency:
  group: seoul-journal-public-upload
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.gate.outputs.slot }}
      category: ${{ steps.gate.outputs.category }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/seoul_journal_slot_gate.py
          else
            echo "slot=$SELECTED_SLOT" >> "$GITHUB_OUTPUT"
            case "$SELECTED_SLOT" in
              morning) echo "category=politics" >> "$GITHUB_OUTPUT" ;;
              midday) echo "category=social" >> "$GITHUB_OUTPUT" ;;
              evening) echo "category=hot_issue" >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          fi
  publish:
    needs: pick
    if: ${{ needs.pick.outputs.slot != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: FISH_AUDIO_API_KEY
    env:
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
      SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
      SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      SLOT: ${{ needs.pick.outputs.slot }}
      CATEGORY: ${{ needs.pick.outputs.category }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install requests beautifulsoup4 Pillow edge-tts google-api-python-client google-auth google-auth-httplib2
      - name: Generate original story and publish once per KST slot
        run: python scripts/seoul_journal_public_daily.py
      - name: Preserve source, rights, presentation and public receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-journal-public-${{ github.run_id }}
          path: artifacts/seoul-journal-public/
          if-no-files-found: warn
          retention-days: 14
