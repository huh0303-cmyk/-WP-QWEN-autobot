name: "Koreanews — inventory all reusable posts"

on: {workflow_dispatch: {}}

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/inventory_koreanews_posts.py
      - uses: actions/upload-artifact@v4
        with:
          name: koreanews-all-posts-${{ github.run_id }}
          path: koreanews_all_posts_inventory.json
          retention-days: 30
