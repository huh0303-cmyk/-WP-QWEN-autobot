name: "TEST notify"
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: fabricate result + run notify
        env:
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: "huh0303@gmail.com"
          REPORT_EMAIL_FROM: "huh0303@gmail.com"
          REPORT_TITLE: "[TEST] mobile review link"
          REPORT_BODY: "Test run of the fixed review-link email."
          REPORT_URL: "https://example.com/fallback"
        run: |
          python scripts/zz_fabricate_test_result.py
          cat newsroom_publish_result.json
          python scripts/publishing_completion_notify.py
