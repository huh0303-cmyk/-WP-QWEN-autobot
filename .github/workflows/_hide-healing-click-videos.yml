name: (임시) healing 클릭음 영상 비공개 전환

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "true면 실제 비공개 전환, 비우면 리포트만(DRY RUN)"
        required: false
        default: "false"
      sample_seconds:
        description: "영상당 검사할 앞부분 길이(초)"
        required: false
        default: "1080"

jobs:
  hide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
      - run: pip install google-api-python-client google-auth google-auth-httplib2 requests yt-dlp -q
      - name: "healing 클릭음 영상 오디오 검사 후 비공개 전환"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING }}
        run: |
          ARGS="--sample-seconds ${{ github.event.inputs.sample_seconds }}"
          if [ "${{ github.event.inputs.execute }}" == "true" ]; then
            ARGS="$ARGS --execute"
          fi
          python scripts/hide_healing_click_videos.py $ARGS
