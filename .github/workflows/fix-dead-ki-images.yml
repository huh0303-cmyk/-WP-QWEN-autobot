name: "One-off: replace dead inline images on koreainvest365 posts 3241/3245"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fix_dead_ki_images.py
