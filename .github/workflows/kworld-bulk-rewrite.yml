name: Kworld365 - rewrite existing articles in safe batches
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start offset among existing published posts excluding ID 1017'
        required: true
        default: '0'
      limit:
        description: 'Number of posts in this batch (1-10)'
        required: true
        default: '3'
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Rewrite exact existing post IDs with Gemini and retain affiliate footer
        env:
          PYTHONPATH: scripts:.
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python -m scripts.kworld_bulk_rewrite --start ${{ inputs.start }} --limit ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kworld-rewrite-backups-${{ github.run_id }}
          path: artifacts/kworld-rewrites/
          retention-days: 30
