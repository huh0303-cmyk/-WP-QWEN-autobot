name: 'WP 02 korea365.org isolated publish'
run-name: 'WP 02 korea365.org manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://korea365.org'
      publication_approved: true
      room_id: 'manual-korea365-org'
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
