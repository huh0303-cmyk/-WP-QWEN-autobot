name: "One-off: diagnose korea365-deploy.service failure"
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/korea365
            echo "=== git diff --stat HEAD (uncommitted) ==="
            git diff --stat HEAD
            echo "=== git diff for scripts/autopost_mega.py (first 200 lines) ==="
            git diff HEAD -- scripts/autopost_mega.py | head -200
            echo "=== file mtime ==="
            stat scripts/autopost_mega.py
