name: "One-off: diagnose korea365-deploy.service failure"
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            echo "=== control service current status ==="
            systemctl status korea365-control.service --no-pager -l | head -10
            echo "=== drop-in content ==="
            cat /etc/systemd/system/korea365-control.service.d/*.conf 2>&1
            echo "=== main unit EnvironmentFile line ==="
            grep -i EnvironmentFile /etc/systemd/system/korea365-control.service
            echo "=== does the env file exist now ==="
            grep -i EnvironmentFile /etc/systemd/system/korea365-control.service | sed -E 's/EnvironmentFile=-?//' | xargs -I{} sh -c 'ls -la "{}" 2>&1'
            echo "=== deploy-status.json now ==="
            cat /opt/korea365/data/deploy-status.json
