name: "One-off: diagnose korea365-deploy.service failure"
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            echo "=== korea365-control.service status ==="
            systemctl status korea365-control.service --no-pager -l || true
            echo "=== korea365-operations.service status ==="
            systemctl status korea365-operations.service --no-pager -l || true
            echo "=== recent control service journal ==="
            journalctl -xeu korea365-control.service --no-pager -n 60
            echo "=== nginx status ==="
            systemctl status nginx --no-pager -l | head -20 || true
