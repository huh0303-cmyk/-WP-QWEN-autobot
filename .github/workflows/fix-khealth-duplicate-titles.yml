name: "k-health365.com — Fix duplicate-title pair (one-off)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: "중복 제목 2건 수정"
        env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/fix_khealth_duplicate_titles.py
