name: Publish Scheduler (A/B 랜덤 발행 트리거)

# 실제 주간 대상/순서는 scripts/publish_scheduler.py가 결정한다.
# 15분 폴링은 하루 96회 실행되어 Actions 소모와 로그 혼잡이 커서,
# 2026-08-26부터 매시 37분 한 번만 확인한다. 한 번에 최대 1개 사이트만 디스패치한다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/publish_scheduler.py"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-scheduler
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Check & dispatch due site
        env:
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_scheduler.py
      - name: Commit scheduler state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add scheduler_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 스케줄러 상태 갱신 [skip ci]"
          git push
