name: "Audit Blogger draft search descriptions"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests google-auth -q
      - name: Inventory all Blogger drafts requiring UI verification
        env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/audit_blogger_draft_search_descriptions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blogger-draft-search-description-audit
          path: blogger_draft_search_description_audit.json
          if-no-files-found: error

