name: "Tistory — Daily 5-Site Plan"

on:
  workflow_dispatch:
    inputs:
      enable_claude_audit:
        description: "Have Claude audit the 5 drafts for fabricated dates/amounts (false = Gemini/GPT draft only, no Claude spend)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "11 21 * * *"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests -q
      - name: Build one-post-per-site safe plan
        run: python scripts/tistory_daily_planner.py --output artifacts/tistory-daily-plan.json
      - name: Validate public publishing is disabled
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/tistory-daily-plan.json', encoding='utf-8'))
          assert p['public_allowed'] is False
          assert len(p['jobs']) == 5
          assert all(j['publish_policy']=='awaiting_approval' for j in p['jobs'])
          assert all(j['duplicate_guard'] is True for j in p['jobs'])
          print('TISTORY PLAN SAFETY PASS')
          PY
      - name: Draft articles — Gemini primary, GPT escalation, Claude audit-only
        env:
          # Gemini(무료)가 주력 작가라 게이트 없이 항상 시도한다. GPT는 Gemini가
          # 실패했을 때만 쓰는 유료 escalation. Claude는 절대 글을 쓰지 않고
          # 완성된 초안만 감사한다 — 그래서 Claude만 명시적 opt-in 뒤에 둔다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENABLED: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ENABLED: ${{ github.event.inputs.enable_claude_audit || 'false' }}
        run: python scripts/tistory_writer.py --plan artifacts/tistory-daily-plan.json --output artifacts/tistory-daily-drafts.json
      - name: Validate drafts never authorize public publication
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/tistory-daily-drafts.json', encoding='utf-8'))
          assert d['public_allowed'] is False
          for draft in d['drafts']:
              assert draft['public_allowed'] is False
              assert draft.get('publish_policy') in (None, 'awaiting_approval')
          print('TISTORY DRAFT SAFETY PASS')
          PY
      - name: Upload plan + draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tistory-daily-plan-${{ github.run_id }}
          path: |
            artifacts/tistory-daily-plan.json
            artifacts/tistory-daily-drafts.json
          retention-days: 7
