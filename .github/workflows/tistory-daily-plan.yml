name: Tistory Daily Plan (PAUSED — quality incident)

# Emergency stop: overnight duplicate/low-quality content reported.
# Original workflow is preserved in Git history. Re-enable only after
# duplicate guard, Gemini model/quota behavior, image selection, and
# approval gate are verified across all five Tistory accounts.

on:
  workflow_dispatch:
    inputs:
      site_ids:
        description: Comma-separated Tistory site IDs
        required: true
        type: string
      run_key:
        description: Unique per-site/day run key
        required: true
        type: string
      slot:
        description: Compatibility slot
        required: false
        default: daily
        type: string
      scheduled_local_time:
        description: Persisted random KST slot
        required: false
        type: string

permissions:
  contents: read

jobs:
  emergency-pause:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Publishing paused pending audit
        run: echo 'Tistory publishing is paused pending duplicate-content audit.'
