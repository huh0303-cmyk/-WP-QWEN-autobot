name: Tistory Daily Plan

on:
  workflow_dispatch:
    inputs:
      site_ids:
        description: Comma-separated Tistory site IDs
        required: true
        type: string
      run_key:
        description: Unique per-site/day run key
        required: true
        type: string
      slot:
        description: Compatibility slot; all values normalize to one daily slot
        required: false
        default: daily
        type: string
      scheduled_local_time:
        description: Persisted random KST slot from the daily three-site selection
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_IDS: ${{ inputs.site_ids }}
      TISTORY_RUN_KEY: ${{ inputs.run_key }}
      TISTORY_SLOT: ${{ inputs.slot }}
      TISTORY_SCHEDULED_LOCAL_TIME: ${{ inputs.scheduled_local_time }}
      # 2026-11-23: every image path (Pexels, Pixabay, and any Replicate
      # result, since is_temporary() routes those through the same call)
      # ends in stable_image_hosting.host_permanently(), which commits the
      # downloaded photo to this repo via the GitHub Contents API and
      # requires GH_ASSET_TOKEN/GITHUB_TOKEN/GH_TOKEN plus contents:write.
      # Neither was set, so every single image attempt -- regardless of
      # provider or credentials -- failed with IMAGE_HOST_CONFIG_MISSING,
      # which is the actual reason no Tistory draft has ever carried a
      # representative image.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      AI_TEXT_PROVIDER: gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install -r requirements-control-center.txt google-api-python-client google-auth requests pillow beautifulsoup4
      - name: Build selected-site daily plan
        run: python scripts/tistory_daily_planner.py --output artifacts/tistory-daily-plan.json
      - name: Generate and quality-check article
        run: python scripts/tistory_writer.py --plan artifacts/tistory-daily-plan.json --output artifacts/tistory-daily-drafts.json
      - name: Queue for logged-in local registrar
        run: python scripts/enqueue_tistory_drafts.py --drafts artifacts/tistory-daily-drafts.json
      - name: Save Tistory plan and drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tistory-daily-${{ github.run_id }}
          path: |
            artifacts/tistory-daily-plan.json
            artifacts/tistory-daily-drafts.json
          if-no-files-found: warn
          retention-days: 7
