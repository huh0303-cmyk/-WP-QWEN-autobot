name: WP VPS daily floor status
# verify after worker import repair 2026-09-25

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wp-vps-floor-status.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sanitized WP daily-floor state from VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import json
            from pathlib import Path
            state_path = Path('/opt/korea365/data/vps-wp-daily-floor.json')
            queue = Path('/opt/korea365/data/vps-wp-queue')
            if not state_path.exists():
                print('WP_FLOOR_STATE_MISSING')
                state = {}
            else:
                state = json.loads(state_path.read_text())
            safe = {
              'hour_key': state.get('hour_key'),
              'checked_at': state.get('checked_at'),
              'status': state.get('status'),
              'target': state.get('target'),
              'queued': state.get('queued'),
              'counts': {},
            }
            for row in state.get('sites', []):
                key = row.get('status','unknown')
                safe['counts'][key] = safe['counts'].get(key,0)+1
            qcounts={}
            for suffix in ('queued','processing','published','failed','credential_required'):
                qcounts[suffix]=len(list(queue.glob(f'daily-*.{suffix}.json'))) if queue.exists() else 0
            safe['queue_counts']=qcounts
            print('WP_DAILY_FLOOR_SAFE', json.dumps(safe, ensure_ascii=False, sort_keys=True))
            PY
            systemctl is-active korea365-wp-publisher.service || true
            systemctl status korea365-wp-publisher.service --no-pager -l | tail -n 25 || true
            journalctl -u korea365-wp-publisher.service -n 25 --no-pager || true
            /opt/korea365/.venv/bin/python - <<'PY'
            import json, requests
            from requests.auth import HTTPBasicAuth
            from pathlib import Path
            creds=json.loads(Path('/etc/korea365/wp-sites.json').read_text())
            probes=[
              ('k-health365.com','KHEALTH365COM'),
              ('k-trip365.com','KTRIP365COM'),
            ]
            for host,secret in probes:
                pw=creds.get(secret,'')
                if not pw:
                    print('WP_AUTH_PROBE',host,'credential_missing')
                    continue
                try:
                    r=requests.get(
                      'https://'+host+'/wp-json/wp/v2/posts',
                      params={'status':'publish','per_page':1,'_fields':'id,link,date_gmt'},
                      auth=HTTPBasicAuth('huh0303@gmail.com',pw),
                      headers={'User-Agent':'Korea365-VPS/1.0'},
                      timeout=20,
                    )
                    print('WP_AUTH_PROBE',host,'status',r.status_code,'content_type',r.headers.get('content-type','').split(';')[0])
                except Exception as exc:
                    print('WP_AUTH_PROBE',host,'exception',type(exc).__name__)
            PY
