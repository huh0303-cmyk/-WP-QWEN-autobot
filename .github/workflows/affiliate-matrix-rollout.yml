name: Four-network affiliate matrix — WordPress and Blogger
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is read-only. Apply requires the repository write secret and confirmation.
        required: true
        type: choice
        options: [preview, apply]
        default: preview
      scope:
        description: New posts only, or backfill all published posts.
        required: true
        type: choice
        options: [new, backfill]
        default: new
      platform:
        description: Publishing platform.
        required: true
        type: choice
        options: [all, wordpress, blogger]
        default: all
      site_id:
        description: Optional exact site ID; blank means all enabled destinations.
        required: false
        type: string
      limit_per_site:
        description: Optional limit for controlled pilots; 0 means all.
        required: false
        type: string
        default: "0"
      confirm_apply:
        description: Type APPLY-AFFILIATE-MATRIX only for an approved apply run.
        required: false
        type: string
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: read
jobs:
  affiliate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Validate and place verified affiliate cards
        env:
          WP_SITE_CREDENTIALS_JSON: \${{ secrets.WP_SITE_CREDENTIALS_JSON }}
          BLOGGER_GOOGLE_CLIENT_ID: \${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: \${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: \${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          AFFILIATE_MATRIX_WRITE_ENABLED: \${{ secrets.AFFILIATE_MATRIX_WRITE_ENABLED }}
          EVENT_NAME: \${{ github.event_name }}
          INPUT_MODE: \${{ inputs.mode }}
          INPUT_SCOPE: \${{ inputs.scope }}
          INPUT_PLATFORM: \${{ inputs.platform }}
          INPUT_SITE_ID: \${{ inputs.site_id }}
          INPUT_LIMIT: \${{ inputs.limit_per_site }}
          INPUT_CONFIRM: \${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            SCOPE=new
            PLATFORM=all
            if [ "$AFFILIATE_MATRIX_WRITE_ENABLED" = "true" ]; then
              MODE=apply
              CONFIRM=APPLY-AFFILIATE-MATRIX
            else
              MODE=preview
              CONFIRM=
            fi
          else
            MODE="\${INPUT_MODE:-preview}"
            SCOPE="\${INPUT_SCOPE:-new}"
            PLATFORM="\${INPUT_PLATFORM:-all}"
            CONFIRM="\${INPUT_CONFIRM:-}"
          fi
          ARGS=(--mode "$MODE" --scope "$SCOPE" --platform "$PLATFORM" --limit-per-site "\${INPUT_LIMIT:-0}")
          if [ -n "\${INPUT_SITE_ID:-}" ]; then ARGS+=(--site-id "$INPUT_SITE_ID"); fi
          if [ -n "$CONFIRM" ]; then ARGS+=(--confirm "$CONFIRM"); fi
          python scripts/affiliate_matrix.py "\${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affiliate-matrix-report-\${{ github.run_id }}
          path: reports/affiliate-matrix-latest.json
          if-no-files-found: warn
