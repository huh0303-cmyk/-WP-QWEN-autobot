name: K-Health365 three-partner banner pilot
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Published K-Health365 post ID for the pilot
        required: true
        type: string
        default: "6987"
      mode:
        description: Preview or apply the three-logo header banner
        required: true
        type: choice
        options: [preview, apply]
        default: apply
permissions:
  contents: read
jobs:
  banner-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Apply and verify the three-partner banner
        env:
          POST_ID: ${{ inputs.post_id }}
          MODE: ${{ inputs.mode }}
          WP_USER: huh0303@gmail.com
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/khealth365_banner_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khealth365-three-partner-banner-report
          path: reports/khealth365-three-partner-banner-pilot.json
          if-no-files-found: ignore
