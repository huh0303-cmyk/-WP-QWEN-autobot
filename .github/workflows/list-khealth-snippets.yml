name: "One-off: list k-health365.com code snippets"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/list_khealth_snippets.py
