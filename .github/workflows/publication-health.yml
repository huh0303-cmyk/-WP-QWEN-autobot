name: Publication network read-only health and writer probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 -q
      - name: Verify public article without credentials
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          results=[]
          for url in ['https://koreanews365.com','https://skin.k-health365.com']:
              if 'koreanews' in url:
                  r=requests.get(url+'/wp-json/wp/v2/posts?per_page=1',timeout=20);r.raise_for_status();p=r.json()[0];link=p['link'];title=p['title']['rendered']
              else:
                  r=requests.get(url+'/feeds/posts/default?alt=json&max-results=1',timeout=20);r.raise_for_status();p=r.json()['feed']['entry'][0];link=next(x['href'] for x in p['link'] if x['rel']=='alternate');title=p['title']['$t']
              page=requests.get(link,timeout=20);page.raise_for_status();soup=BeautifulSoup(page.text,'html.parser')
              results.append({'url':link,'expected_title':title,'page_title':soup.title.get_text() if soup.title else '', 'h1':[n.get_text(' ',strip=True) for n in soup.find_all('h1')], 'http_status':page.status_code})
          Path('public-verification.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-article-verification
          path: public-verification.json
