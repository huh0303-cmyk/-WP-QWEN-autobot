name: SDXL Lightning Sample Gallery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Generate five SDXL Lightning samples
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python scripts/generate_sdxl_sample_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdxl-lightning-sample-gallery
          path: output/sdxl-lightning-samples/
          if-no-files-found: error
