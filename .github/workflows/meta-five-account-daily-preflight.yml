name: Meta five-account daily readiness check

on:
  schedule:
    - cron: "10 0 * * *" # 09:10 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: social-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all ten account-specific Meta connections
        env:
          META_INSTAGRAM_SEOUL_TOPIK_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_SEOUL_TOPIK_ACCESS_TOKEN }}
          META_INSTAGRAM_SEOUL_TOPIK_USER_ID: ${{ secrets.META_INSTAGRAM_SEOUL_TOPIK_USER_ID }}
          META_INSTAGRAM_SEOUL_JISOO_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_SEOUL_JISOO_ACCESS_TOKEN }}
          META_INSTAGRAM_SEOUL_JISOO_USER_ID: ${{ secrets.META_INSTAGRAM_SEOUL_JISOO_USER_ID }}
          META_INSTAGRAM_SEOUL_CHRIS_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_SEOUL_CHRIS_ACCESS_TOKEN }}
          META_INSTAGRAM_SEOUL_CHRIS_USER_ID: ${{ secrets.META_INSTAGRAM_SEOUL_CHRIS_USER_ID }}
          META_INSTAGRAM_ENGLISH_PICK1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ENGLISH_PICK1_ACCESS_TOKEN }}
          META_INSTAGRAM_ENGLISH_PICK1_USER_ID: ${{ secrets.META_INSTAGRAM_ENGLISH_PICK1_USER_ID }}
          META_INSTAGRAM_JAPANESE_PICK_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_JAPANESE_PICK_ACCESS_TOKEN }}
          META_INSTAGRAM_JAPANESE_PICK_USER_ID: ${{ secrets.META_INSTAGRAM_JAPANESE_PICK_USER_ID }}
          META_THREADS_SEOUL_TOPIK_ACCESS_TOKEN: ${{ secrets.META_THREADS_SEOUL_TOPIK_ACCESS_TOKEN }}
          META_THREADS_SEOUL_TOPIK_USER_ID: ${{ secrets.META_THREADS_SEOUL_TOPIK_USER_ID }}
          META_THREADS_SEOUL_JISOO_ACCESS_TOKEN: ${{ secrets.META_THREADS_SEOUL_JISOO_ACCESS_TOKEN }}
          META_THREADS_SEOUL_JISOO_USER_ID: ${{ secrets.META_THREADS_SEOUL_JISOO_USER_ID }}
          META_THREADS_SEOUL_CHRIS_ACCESS_TOKEN: ${{ secrets.META_THREADS_SEOUL_CHRIS_ACCESS_TOKEN }}
          META_THREADS_SEOUL_CHRIS_USER_ID: ${{ secrets.META_THREADS_SEOUL_CHRIS_USER_ID }}
          META_THREADS_ENGLISH_PICK1_ACCESS_TOKEN: ${{ secrets.META_THREADS_ENGLISH_PICK1_ACCESS_TOKEN }}
          META_THREADS_ENGLISH_PICK1_USER_ID: ${{ secrets.META_THREADS_ENGLISH_PICK1_USER_ID }}
          META_THREADS_JAPANESE_PICK_ACCESS_TOKEN: ${{ secrets.META_THREADS_JAPANESE_PICK_ACCESS_TOKEN }}
          META_THREADS_JAPANESE_PICK_USER_ID: ${{ secrets.META_THREADS_JAPANESE_PICK_USER_ID }}
        run: python scripts/meta_account_preflight.py

