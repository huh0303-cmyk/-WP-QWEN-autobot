name: "KoreaWedding365 중복 이미지 정리"

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "false = 중복 조사만, true = 중복 이미지 제거 (이미지 없는 글로 유지)"
        required: true
        default: "false"
      post_limit:
        description: "검사할 최근 게시물 수"
        required: true
        default: "100"

permissions:
  contents: read

jobs:
  wedding-image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 pillow ImageHash -q
      - name: Audit and optionally remove duplicate photos
        env:
          REPAIR_SITE_URL: https://koreawedding365.com
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
          POST_LIMIT: ${{ inputs.post_limit }}
        run: python scripts/repair_wp_duplicate_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koreawedding365-duplicate-image-audit-${{ github.run_id }}
          path: artifacts/duplicate-image-repair/
          if-no-files-found: warn
          retention-days: 30
