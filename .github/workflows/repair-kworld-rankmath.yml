name: "WordPress — repair KWorld Rank Math and backfill"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Register authenticated Rank Math REST fields
        env:
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
        run: python scripts/enable_kworld_rankmath_rest.py
      - name: Backfill and verify KWorld only
        env:
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          SITE_FILTER: https://kworld365.com
        run: python scripts/backfill_rankmath_focus_keywords.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kworld-rankmath-repair-${{ github.run_id }}
          path: |
            kworld_rankmath_rest_result.json
            rankmath_keyword_backfill_result.json
          if-no-files-found: warn
          retention-days: 30
