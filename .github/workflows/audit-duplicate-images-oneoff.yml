name: "One-off: audit reused/duplicate images across recent WP posts"
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python scripts/audit_duplicate_images_today.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duplicate-images-recent
          path: artifacts/duplicate-images-recent.json
          if-no-files-found: ignore
