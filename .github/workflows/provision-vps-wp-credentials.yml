name: Audit publication policy
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: free-news-20260921
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            umask 077
            python3 - <<'PY'
            import base64
            from pathlib import Path
            Path('/tmp/audit_publication_policy.py').write_bytes(base64.b64decode(''))
            PY
            /opt/korea365/.venv/bin/python -u /tmp/audit_publication_policy.py
