name: Provision authorized WordPress credentials on VPS
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: provision-vps-wp-credentials
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer the missing SIS WordPress credential over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: SISKOREACOM
          script: |
            set -e
            umask 077
            python3 - <<'PY'
            import json, os, tempfile
            from pathlib import Path
            path=Path('/etc/korea365/wp-sites.json')
            value=os.environ.get('SISKOREACOM','').strip()
            if not value:
                raise SystemExit('Required credential is not configured in GitHub')
            data=json.loads(path.read_text())
            data['SISKOREACOM']=value
            fd,name=tempfile.mkstemp(dir=path.parent,prefix='.wp-sites-')
            with os.fdopen(fd,'w') as out:
                json.dump(data,out)
                out.flush()
                os.fsync(out.fileno())
            os.chmod(name,0o600)
            os.replace(name,path)
            print('SIS credential provisioned; values omitted')
            PY
