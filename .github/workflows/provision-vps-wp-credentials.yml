name: Provision authorized Article provider credentials on VPS
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: provision-vps-wp-credentials
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer configured Article provider credentials over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY,GEMINI_API_KEY,PEXELS_API_KEY,PIXABAY_KEY,BLOGGER_GOOGLE_CLIENT_ID,BLOGGER_GOOGLE_CLIENT_SECRET,BLOGGER_GOOGLE_REFRESH_TOKEN
          script: |
            set -e
            umask 077
            python3 - <<'PY'
            import json, os, tempfile
            from pathlib import Path

            names = ['OPENAI_API_KEY', 'GEMINI_API_KEY', 'PEXELS_API_KEY', 'PIXABAY_KEY', 'BLOGGER_GOOGLE_CLIENT_ID', 'BLOGGER_GOOGLE_CLIENT_SECRET', 'BLOGGER_GOOGLE_REFRESH_TOKEN']
            path = Path('/etc/korea365/article-runtime.json')
            data = json.loads(path.read_text()) if path.exists() else {}
            configured = {name: os.environ[name].strip() for name in names if os.environ.get(name, '').strip()}
            data.update(configured)
            fd, temp_name = tempfile.mkstemp(dir=path.parent, prefix='.article-runtime-')
            with os.fdopen(fd, 'w') as out:
                json.dump(data, out)
                out.flush()
                os.fsync(out.fileno())
            os.chmod(temp_name, 0o600)
            os.replace(temp_name, path)
            missing = sorted(set(names) - set(configured))
            print(f'Article provider credentials provisioned: {len(configured)}; values omitted')
            print('Not configured in GitHub: ' + (', '.join(missing) if missing else 'none'))
            PY
