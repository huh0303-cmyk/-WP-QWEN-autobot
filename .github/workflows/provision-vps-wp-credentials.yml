name: Provision authorized WordPress credentials on VPS
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: provision-vps-wp-credentials
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer configured WordPress credentials over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: KHEALTH365COM,KOREAMEDICALTOURCOM,KOREAINVEST365COM,KIKOREACOM,KOREAINSURANCE365COM,KFINANCE365COM,KOREATAXNLAWCOM,KOREACRYPTO365COM,KREALESTATE365COM,KTECH365COM,KSKIN365COM,OLIVEYOUNGKOREACOM,KWORLD365COM,KTRIP365COM,KVISA365COM,KOREAWEDDING365COM,KSTUDY365COM,STUDYINKOREA365COM,KIECAKOREAORG,KSAKOREAORG,SISKOREACOM,JOBKOREA365COM,JOBINKOREA365COM,JOBKOREAGLOBALCOM,KOREA365ORG,KOREANEWS365COM,THESEOULJOURNALCOM
          script: |
            set -e
            umask 077
            python3 - <<'PY'
            import json, os, tempfile
            from pathlib import Path

            names = [
                'KHEALTH365COM', 'KOREAMEDICALTOURCOM', 'KOREAINVEST365COM',
                'KIKOREACOM', 'KOREAINSURANCE365COM', 'KFINANCE365COM',
                'KOREATAXNLAWCOM', 'KOREACRYPTO365COM', 'KREALESTATE365COM',
                'KTECH365COM', 'KSKIN365COM', 'OLIVEYOUNGKOREACOM',
                'KWORLD365COM', 'KTRIP365COM', 'KVISA365COM',
                'KOREAWEDDING365COM', 'KSTUDY365COM', 'STUDYINKOREA365COM',
                'KIECAKOREAORG', 'KSAKOREAORG', 'SISKOREACOM',
                'JOBKOREA365COM', 'JOBINKOREA365COM', 'JOBKOREAGLOBALCOM',
                'KOREA365ORG', 'KOREANEWS365COM', 'THESEOULJOURNALCOM',
            ]
            path = Path('/etc/korea365/wp-sites.json')
            data = json.loads(path.read_text()) if path.exists() else {}
            configured = {name: os.environ[name].strip() for name in names if os.environ.get(name, '').strip()}
            data.update(configured)
            fd, temp_name = tempfile.mkstemp(dir=path.parent, prefix='.wp-sites-')
            with os.fdopen(fd, 'w') as out:
                json.dump(data, out)
                out.flush()
                os.fsync(out.fileno())
            os.chmod(temp_name, 0o600)
            os.replace(temp_name, path)
            missing = sorted(set(names) - set(configured))
            print(f'WordPress credentials provisioned: {len(configured)}; values omitted')
            print('Not configured in GitHub: ' + (', '.join(missing) if missing else 'none'))
            PY
