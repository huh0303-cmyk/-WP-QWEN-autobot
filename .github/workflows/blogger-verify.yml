name: "Automation Hub — Blogger 33 connection check"

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/blogger_verify_account.py"
      - ".github/workflows/blogger-verify.yml"
      - "config/automation_hub_sites.json"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install requests -q
      - name: Verify Blogger OAuth and all 33 blog IDs
        env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/blogger_verify_account.py
      - name: Save connection result for dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogger_connection_report.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refresh Blogger 33 connection status [skip ci]"
          git pull --rebase origin main
          git push
