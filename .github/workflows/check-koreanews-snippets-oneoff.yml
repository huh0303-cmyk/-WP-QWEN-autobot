name: "One-off: check koreanews365 snippets"
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python check_koreanews_snippets.py
        working-directory: scripts
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
