name: Recover rendered healing sample PRIVATE only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-production-single-owner
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: youtube-channels
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q
      - run: python scripts/recover_healing_private_sample.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SCHEDULE_ID: CAL-0765
          CHANNEL_KEY: healing
          VIDEO_DRIVE_ID: 1QNvXvM8NsxUg7d5OreIv8tUQ5i8wc2t1
          THUMB_DRIVE_ID: 1E2mTsCS8y7-e_LuoBmy_bWFQLg402PPp
          YT_TITLE: Temple rain and distant bells | Nature Sounds | 64 min
          YT_DESCRIPTION: 'Nature Sounds: Temple rain and distant bells. Playing time: 64 minutes.'
          TITLE_IS_FALLBACK: 'false'
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_HEALING }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_HEALING }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-recovered-private-receipt
          path: artifacts/youtube_playlist_result.json
