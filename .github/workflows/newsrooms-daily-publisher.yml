name: "Two Newsrooms — RSS 3–10 Daily Editions"

on:
  workflow_dispatch:
    inputs:
      newsroom:
        description: "koreanews365 / theseouljournal"
        required: true
        type: choice
        options: [koreanews365, theseouljournal]
        default: koreanews365
      preferred_category:
        description: "Optional RSS desk (World/Sports/Military/Art)"
        required: false
        type: choice
        options: ["", World, Sports, Military, Art]
        default: ""
  schedule:
    - cron: "31 22 * * *"
    - cron: "43 0 * * *"
    - cron: "9 2 * * *"
    - cron: "18 3 * * *"
    - cron: "46 4 * * *"
    - cron: "29 6 * * *"
    - cron: "6 8 * * *"
    - cron: "41 9 * * *"
    - cron: "23 11 * * *"
    - cron: "53 12 * * *"
    - cron: "3 23 * * *"
    - cron: "16 1 * * *"
    - cron: "40 2 * * *"
    - cron: "49 3 * * *"
    - cron: "18 5 * * *"
    - cron: "1 7 * * *"
    - cron: "38 8 * * *"
    - cron: "13 10 * * *"
    - cron: "54 11 * * *"
    - cron: "25 13 * * *"

permissions:
  contents: read

concurrency:
  # A single owner prevents two scheduled editions from racing on RSS/source
  # deduplication or WordPress writes when a prior run is slow.
  group: newsroom-publisher-single-owner
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests google-genai beautifulsoup4 lxml Pillow google-api-python-client google-auth -q
      - name: Resolve newsroom
        id: target
        shell: bash
        run: |
          S="${{ github.event.schedule }}"
          MANUAL="${{ inputs.newsroom }}"
          if [ -n "$MANUAL" ]; then
            KEY="$MANUAL"
          elif [[ "$S" == "3 23 * * *" || "$S" == "16 1 * * *" || "$S" == "40 2 * * *" || "$S" == "49 3 * * *" || "$S" == "18 5 * * *" || "$S" == "1 7 * * *" || "$S" == "38 8 * * *" || "$S" == "13 10 * * *" || "$S" == "54 11 * * *" || "$S" == "25 13 * * *" ]]; then
            KEY="theseouljournal"
          else
            KEY="koreanews365"
          fi
          if [ "$KEY" = "theseouljournal" ]; then URL="https://theseouljournal.com"; else URL="https://koreanews365.com"; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          # 2026-09-03 CEO: "정치·경제·문화·스포츠·군사 이렇게 쌓이는 게 살아있는
          # 느낌" — each site's own 10 scheduled slots round-robin across its
          # category rotation (6 for koreanews365, 7 for theseouljournal) so
          # every category gets at least one, usually two, tries per day
          # instead of an hour-formula that could skip a category entirely.
          # Manual dispatches with an explicit preferred_category, or with
          # none at all, are left alone (empty = crawl_rss_news free-picks).
          CATEGORY=""
          if [ -z "$MANUAL" ]; then
            if [ "$KEY" = "koreanews365" ]; then
              KO_CATS=("정치" "경제" "국방" "글로벌" "문화" "스포츠")
              case "$S" in
                "31 22 * * *") IDX=0 ;; "43 0 * * *") IDX=1 ;; "9 2 * * *") IDX=2 ;;
                "18 3 * * *") IDX=3 ;; "46 4 * * *") IDX=4 ;; "29 6 * * *") IDX=5 ;;
                "6 8 * * *") IDX=0 ;; "41 9 * * *") IDX=1 ;; "23 11 * * *") IDX=2 ;;
                "53 12 * * *") IDX=3 ;; *) IDX=-1 ;;
              esac
              if [ "$IDX" -ge 0 ]; then CATEGORY="${KO_CATS[$IDX]}"; fi
            else
              EN_CATS=("Politics" "Business" "Military" "World" "Culture" "Art" "Sports")
              case "$S" in
                "3 23 * * *") IDX=0 ;; "16 1 * * *") IDX=1 ;; "40 2 * * *") IDX=2 ;;
                "49 3 * * *") IDX=3 ;; "18 5 * * *") IDX=4 ;; "1 7 * * *") IDX=5 ;;
                "38 8 * * *") IDX=6 ;; "13 10 * * *") IDX=0 ;; "54 11 * * *") IDX=1 ;;
                "25 13 * * *") IDX=2 ;; *) IDX=-1 ;;
              esac
              if [ "$IDX" -ge 0 ]; then CATEGORY="${EN_CATS[$IDX]}"; fi
            fi
          fi
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
      - name: Repair recent source-based categories
        env:
          TARGET_SITE_URL: ${{ steps.target.outputs.url }}
          NEWSROOM_PREFERRED_CATEGORY: ${{ inputs.preferred_category }}
          NEWSROOM_SUGGESTED_CATEGORY: ${{ steps.target.outputs.category }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/repair_recent_newsroom_categories.py
      - name: Publish one source-checked edition
        env:
          WP_AUTOPUBLISH_ENABLED: "true"
          # The two approved newsrooms are the only WordPress exception to the
          # network-wide human approval rule. All source/recency/duplicate/
          # rights/SEO gates still run before a public post can be created.
          WP_POST_STATUS: "publish"
          WP_PUBLICATION_APPROVED: "true"
          AUTOMATION_HUB_SOURCE: "sheets"
          AI_TEXT_PROVIDER: "openai"
          # 2026-09-03: Gemini removed from the reviewer role network-wide —
          # three_model_consensus.py now always runs two independent GPT
          # passes and never calls Gemini at all. See audit_active_policy.py.
          OPENAI_ENABLED: "true"
          CLAUDE_ENABLED: "false"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_IMAGE_ENABLED: "false"
          PAID_IMAGE_GENERATION_ENABLED: "false"
          GEMINI_IMAGE_GENERATION_ENABLED: "false"
          NANO_BANANA_FREE_TIER_ENABLED: "false"
          AUTOMATED_IMAGE_PUBLISHING_ENABLED: "true"
          OPENAI_MODEL: "gpt-5-mini"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSROOM_REQUIRE_PUBLICATION: "true"
          FORCE_SOURCE_IPV4: "true"
          NEWSROOM_PREFERRED_CATEGORY: ${{ inputs.preferred_category }}
          NEWSROOM_SUGGESTED_CATEGORY: ${{ steps.target.outputs.category }}
          TARGET_SITE_URL: ${{ steps.target.outputs.url }}
          RUN_SLOT: "1"
          SLEEP_BETWEEN_POSTS: "2"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEETS_WEBHOOK: ${{ secrets.SHEETS_WEBHOOK }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          # A retry starts from a fresh process. The publisher reloads recent
          # titles and embedded source URLs first, so a timeout after a remote
          # create cannot intentionally create a duplicate edition.
          for attempt in 1 2 3; do
            if python scripts/autopost_current.py 2>&1 | tee "artifacts/newsroom-attempt-${attempt}.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Save publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-result-${{ steps.target.outputs.key }}-${{ github.run_id }}
          path: |
            newsroom_publish_result.json
            artifacts/newsroom-attempt-*.log
          if-no-files-found: warn
          retention-days: 7
