name: Seoul Journal OAuth Reauthorization (one-time consent)

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Paste the code query parameter from the Google redirect URL (leave blank to generate the consent link)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Google consent URL
        if: ${{ inputs.auth_code == '' }}
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
        run: |
          python - <<'PY'
          import base64, os, urllib.parse
          client_id = os.environ.get("CLIENT_ID", "").strip()
          if not client_id:
              raise SystemExit("YOUTUBE_OAUTH_CLIENT_ID is missing.")
          params = {
              "client_id": client_id,
              "redirect_uri": "http://localhost",
              "response_type": "code",
              "scope": "https://www.googleapis.com/auth/youtube",
              "access_type": "offline",
              "prompt": "consent",
              "include_granted_scopes": "true",
              "state": "seoul-journal-reauth-20261027",
          }
          url = "https://accounts.google.com/o/oauth2/v2/auth?" + urllib.parse.urlencode(params)
          print("OPEN_THIS_GOOGLE_CONSENT_URL_B64=" + base64.b64encode(url.encode("utf-8")).decode("ascii"))
          print("Approve access while signed into the Google account that owns the Seoul Journal YouTube channel.")
          print("After redirect, copy only the code query parameter. Rerun this workflow and paste it into auth_code.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Seoul Journal Google authorization\n\n")
              f.write("[Open Google consent page](" + url + ")\n\n")
              f.write("Approve with the Google account that owns Seoul Journal. After redirect, copy the code query parameter and rerun this workflow with that code in auth_code. Do not paste the code into chat.\n")
          PY

      - name: Exchange authorization code, verify exact channel, and save refresh token
        if: ${{ inputs.auth_code != '' }}
        env:
          AUTH_CODE_INPUT: ${{ inputs.auth_code }}
          CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          EXPECTED_CHANNEL_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m pip install --disable-pip-version-check requests pynacl
          python - <<'PY'
          import base64, os, urllib.parse
          import requests
          from nacl.public import PublicKey, SealedBox

          code_input = os.environ.get("AUTH_CODE_INPUT", "").strip()
          if "://" in code_input:
              query = urllib.parse.parse_qs(urllib.parse.urlparse(code_input).query)
              code_input = query.get("code", [""])[0]
          client_id = os.environ.get("CLIENT_ID", "").strip()
          client_secret = os.environ.get("CLIENT_SECRET", "").strip()
          expected = os.environ.get("EXPECTED_CHANNEL_ID", "").strip()
          gh_pat = os.environ.get("GH_PAT", "").strip()
          if not all((code_input, client_id, client_secret, expected, gh_pat)):
              raise SystemExit("Missing authorization code or required configured credentials.")
          token_response = requests.post("https://oauth2.googleapis.com/token", data={
              "code": code_input,
              "client_id": client_id,
              "client_secret": client_secret,
              "redirect_uri": "http://localhost",
              "grant_type": "authorization_code",
          }, timeout=30)
          if not token_response.ok:
              try: error = token_response.json().get("error", f"HTTP_{token_response.status_code}")
              except Exception: error = f"HTTP_{token_response.status_code}"
              raise SystemExit(f"Authorization-code exchange failed: {error}. Generate a fresh consent link and try once more.")
          token_data = token_response.json()
          refresh = token_data.get("refresh_token", "").strip()
          access = token_data.get("access_token", "").strip()
          if not refresh or not access:
              raise SystemExit("Google did not return a refresh token. Re-run consent with prompt=consent; no secret was changed.")
          ch = requests.get("https://www.googleapis.com/youtube/v3/channels",
              params={"part":"id","mine":"true"},
              headers={"Authorization":"Bearer " + access}, timeout=30)
          if not ch.ok:
              raise SystemExit(f"YouTube channel verification failed: HTTP_{ch.status_code}; no secret was changed.")
          ids = {item.get("id") for item in ch.json().get("items", [])}
          if expected not in ids:
              raise SystemExit("The authorized Google account does not own the locked Seoul Journal channel; no secret was changed.")
          headers = {
              "Authorization": "Bearer " + gh_pat,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          base = "https://api.github.com/repos/huh0303-cmyk/-WP-QWEN-autobot"
          key_response = requests.get(base + "/actions/secrets/public-key", headers=headers, timeout=30)
          if not key_response.ok:
              raise SystemExit(f"Cannot read GitHub secret public key: HTTP_{key_response.status_code}. Check GH_PAT permissions.")
          key_data = key_response.json()
          public_key = PublicKey(base64.b64decode(key_data["key"]))
          encrypted = base64.b64encode(SealedBox(public_key).encrypt(refresh.encode("utf-8"))).decode("ascii")
          saved = requests.put(base + "/actions/secrets/SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN",
              headers=headers, json={"encrypted_value": encrypted, "key_id": key_data["key_id"]}, timeout=30)
          if saved.status_code not in (201, 204):
              raise SystemExit(f"GitHub secret update failed: HTTP_{saved.status_code}. Check GH_PAT repository-secret write permission.")
          verify = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": client_id, "client_secret": client_secret,
              "refresh_token": refresh, "grant_type": "refresh_token",
          }, timeout=30)
          if not verify.ok:
              raise SystemExit("GitHub secret was updated, but refresh verification failed; rerun OAuth diagnosis before publishing.")
          print("PASS: Seoul Journal OAuth refreshed, exact channel identity verified, and GitHub secret updated.")
          print("No video was uploaded by this authorization workflow.")
          PY
