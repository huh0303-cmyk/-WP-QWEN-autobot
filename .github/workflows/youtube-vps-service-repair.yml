name: Repair canonical YouTube VPS services

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the verified VPS unit contract
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            install -m 644 /dev/stdin /etc/systemd/system/korea365-youtube-worker.service <<'UNIT'
            [Unit]
            Description=Korea365 single-owner YouTube video worker
            After=network-online.target korea365-control.service
            Wants=network-online.target

            [Service]
            Type=simple
            User=root
            Group=root
            WorkingDirectory=/opt/korea365
            EnvironmentFile=/etc/korea365/control.env
            ExecStart=/opt/korea365/.venv/bin/python scripts/youtube_vps_worker.py --daemon
            Restart=always
            RestartSec=5
            Nice=5

            [Install]
            WantedBy=multi-user.target
            UNIT
            install -m 644 /dev/stdin /etc/systemd/system/korea365-youtube-scheduler.service <<'UNIT'
            [Unit]
            Description=Queue due Korea365 YouTube calendar work

            [Service]
            Type=oneshot
            User=root
            Group=root
            WorkingDirectory=/opt/korea365
            EnvironmentFile=/etc/korea365/control.env
            ExecStart=/opt/korea365/.venv/bin/python scripts/youtube_vps_worker.py --enqueue-due
            UNIT
            systemctl daemon-reload
            systemctl disable --now korea365-youtube-private-weekly.timer >/dev/null 2>&1 || true
            systemctl stop korea365-youtube-private-weekly.service >/dev/null 2>&1 || true
            systemctl reset-failed korea365-youtube-worker.service || true
            systemctl enable --now korea365-youtube-worker.service korea365-youtube-scheduler.timer
            systemctl restart korea365-youtube-worker.service
            systemctl is-active korea365-youtube-worker.service korea365-youtube-scheduler.timer
            test "$(systemctl is-active korea365-youtube-private-weekly.timer || true)" = inactive
