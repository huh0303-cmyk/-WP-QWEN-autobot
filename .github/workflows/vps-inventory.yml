name: VPS inventory (read-only, no secret values)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            echo "## units"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}' | grep -vE "^(systemd|dbus|ssh|getty|serial|cron|rsyslog|polkit|udisks|multipathd|networkd|resolved|snapd|unattended|qemu|chrony|user@|packagekit|ModemManager|irqbalance|cloud|fwupd)" 
            echo "## timers"; systemctl list-timers --all --no-pager --no-legend | awk '{print $(NF-1), $NF}' | grep -i -E "korea|london|n8n|youtube|blogger" 
            echo "## docker"; (docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null || echo none)
            echo "## nginx sites"; ls /etc/nginx/sites-enabled 2>/dev/null; grep -h "server_name" /etc/nginx/sites-enabled/* 2>/dev/null | sort -u
            echo "## disk"; df -h / | tail -1; du -xsh /opt/korea365 /var/lib/korea365 /var/lib/docker /root /home /var/lib/ollama /usr/share/ollama 2>/dev/null
            echo "## opt/korea365 top"; du -xh --max-depth=2 /opt/korea365 2>/dev/null | sort -rh | head -14
            echo "## /etc/korea365 files + key names only"; ls -la /etc/korea365 2>/dev/null | awk '{print $5, $9}'; python3 - <<'PY'
            import json, glob
            for f in sorted(glob.glob('/etc/korea365/*.json')):
                try:
                    d = json.load(open(f))
                    print(f, sorted(d.keys())[:60] if isinstance(d, dict) else type(d).__name__)
                except Exception as e:
                    print(f, 'unreadable', type(e).__name__)
            PY
            echo "## owner_local assets"; for d in /opt/korea365/data/playlist* /opt/korea365/assets /opt/korea365/music /opt/korea365/images; do [ -e "$d" ] && du -sh "$d"; done 2>/dev/null
            echo "## crontab"; crontab -l 2>/dev/null | grep -v '^#' | head
            echo "## ollama"; (ollama list 2>/dev/null | head -5 || echo none)
