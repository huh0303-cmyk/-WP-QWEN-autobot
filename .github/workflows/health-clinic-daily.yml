name: Health Clinic 장편 자동생성 (한/영/일, 주3회)

on:
  schedule:
    # 주 3회(월/수/금), 하루 안에서도 아침/오후/저녁으로 분산, 정각 금지
    - cron: "13 0 * * 1,3,5"    # 09:13 KST — 한국어
    - cron: "38 5 * * 1,3,5"    # 14:38 KST — 영어
    - cron: "52 11 * * 1,3,5"   # 20:52 KST — 일본어
  workflow_dispatch:
    inputs:
      lang:
        description: "채널 언어 (kr/en/jp)"
        required: true
        default: "en"
      topic:
        description: "영상 주제 (비우면 언어별 주제풀에서 무작위 선택)"
        required: false

concurrency:
  group: health-clinic-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scripts/health_clinic
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치 (ffmpeg, 한글/일본어/영어 자막·썸네일용 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum fonts-noto-cjk fonts-dejavu-core

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인증정보 파일 복원
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.HEALTH_CLINIC_GOOGLE_TOKEN_JSON }}' > token.json

      - name: 언어/주제 결정 (스케줄 실행 시 cron별로 언어 매핑 + 주제 무작위 선택)
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LANG_IN="${{ github.event.inputs.lang }}"
            TOPIC_IN="${{ github.event.inputs.topic }}"
          else
            case "${{ github.event.schedule }}" in
              "13 0 * * 1,3,5")  LANG_IN="kr" ;;
              "38 5 * * 1,3,5")  LANG_IN="en" ;;
              "52 11 * * 1,3,5") LANG_IN="jp" ;;
              *) LANG_IN="en" ;;
            esac
            TOPIC_IN=""
          fi

          if [ -z "$TOPIC_IN" ]; then
            case "$LANG_IN" in
              kr) TOPICS=("무릎 통증 완화 스트레칭" "갱년기 증상 관리법" "시니어 근력 운동 루틴" "혈압 관리 생활습관" "숙면을 위한 저녁 루틴" "관절 건강 지키는 습관" "장수를 위한 식습관" "당뇨 예방 식단" "치매 예방 두뇌운동") ;;
              jp) TOPICS=("シニアの健康な老化のヒント" "更年期の症状緩和" "膝の痛みを和らげるストレッチ" "シニアの筋力トレーニング" "質の良い睡眠習慣" "関節の健康を守る習慣" "長寿のための食習慣" "認知症予防の脳トレ" "血圧管理の生活習慣") ;;
              *)  TOPICS=("healthy aging tips for seniors" "menopause symptom relief for women over 50" "joint pain relief exercises for seniors" "senior strength training basics" "better sleep habits after 50" "habits for healthy joints" "eating habits for longevity" "diabetes prevention diet for seniors" "brain exercises to prevent dementia") ;;
            esac
            IDX=$((RANDOM % ${#TOPICS[@]}))
            TOPIC_IN="${TOPICS[$IDX]}"
          fi

          echo "lang=$LANG_IN" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC_IN" >> "$GITHUB_OUTPUT"
          echo "선택됨: lang=$LANG_IN / topic=$TOPIC_IN"

      - name: 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_KR_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_KR_A }}
          ELEVENLABS_VOICE_ID_KR_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_KR_B }}
          ELEVENLABS_VOICE_ID_EN_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_EN_A }}
          ELEVENLABS_VOICE_ID_EN_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_EN_B }}
          ELEVENLABS_VOICE_ID_JP_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_JP_A }}
          ELEVENLABS_VOICE_ID_JP_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_JP_B }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          YOUTUBE_CHANNEL_ID_KR: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_KR }}
          YOUTUBE_CHANNEL_ID_EN: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_EN }}
          YOUTUBE_CHANNEL_ID_JP: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_JP }}
          NOTIFY_EMAIL_TO: huh0303@gmail.com
          NOTIFY_EMAIL_FROM: huh0303@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python main.py --lang "${{ steps.pick.outputs.lang }}" \
                          --topic "${{ steps.pick.outputs.topic }}"
