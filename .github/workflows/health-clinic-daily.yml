name: Health Clinic 장편 자동생성 (한/영/일, 주3회)

on:
  schedule:
    # 주 3회(월/수/금), 하루 안에서도 아침/오후/저녁으로 분산, 정각 금지
    - cron: "13 0 * * 1,3,5"    # 09:13 KST — 한국어
    - cron: "38 5 * * 1,3,5"    # 14:38 KST — 영어
    - cron: "52 11 * * 1,3,5"   # 20:52 KST — 일본어
  workflow_dispatch:
    inputs:
      lang:
        description: "채널 언어 (kr/en/jp)"
        required: true
        default: "en"
      topic:
        description: "영상 주제 (비우면 언어별 주제풀에서 무작위 선택)"
        required: false
      only:
        description: "테스트용: 실행할 단계만 쉼표로 (예: script,video,thumbnail,notify — 업로드 제외 테스트). 비우면 전체 실행"
        required: false

concurrency:
  group: health-clinic-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scripts/health_clinic
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치 (ffmpeg, 한글/일본어/영어 자막·썸네일용 폰트)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum fonts-noto-cjk fonts-dejavu-core

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 인증정보 파일 복원
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.HEALTH_CLINIC_GOOGLE_TOKEN_JSON }}' > token.json

      - name: 언어/주제 결정 (스케줄 실행 시 cron별로 언어 매핑 + 주제 무작위 선택)
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LANG_IN="${{ github.event.inputs.lang }}"
            TOPIC_IN="${{ github.event.inputs.topic }}"
          else
            case "${{ github.event.schedule }}" in
              "13 0 * * 1,3,5")  LANG_IN="kr" ;;
              "38 5 * * 1,3,5")  LANG_IN="en" ;;
              "52 11 * * 1,3,5") LANG_IN="jp" ;;
              *) LANG_IN="en" ;;
            esac
            TOPIC_IN=""
          fi

          # 언어별 주제 목록은 서로 직역이 아니라 각 나라 문화/제도에 맞게 다르게 구성 (중복 컨텐츠 방지)
          if [ -z "$TOPIC_IN" ]; then
            case "$LANG_IN" in
              kr) TOPICS=("국민건강검진 200% 활용법" "무릎 통증 완화 스트레칭" "갱년기 극복한 선배들의 조언" "혈압 낮추는 집밥 반찬" "화투로 치매 예방하는 이유" "장수마을 어르신들의 아침 습관" "당뇨 잡는 나물 반찬 5가지" "허리디스크 예방 앉는 자세" "명절 스트레스 관리법") ;;
              jp) TOPICS=("ラジオ体操で健康寿命を延ばす" "更年期の症状緩和" "温泉入浴と血行促進の関係" "和食で血糖値をコントロールする方法" "認知症予防の脳トレ習慣" "膝痛を防ぐ正しい歩き方" "一人暮らしシニアの孤独対策" "高齢者の熱中症対策" "腰痛を防ぐ布団と寝方") ;;
              *)  TOPICS=("healthy aging tips for seniors" "menopause symptom relief for women over 50" "how Medicare covers preventive checkups" "gardening as low-impact exercise for seniors" "grandparent-grandchild bonding activities" "managing arthritis pain in cold weather" "heart-healthy comfort food swaps" "staying social after retirement" "fall-prevention home safety tips") ;;
            esac
            IDX=$((RANDOM % ${#TOPICS[@]}))
            TOPIC_IN="${TOPICS[$IDX]}"
          fi

          echo "lang=$LANG_IN" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC_IN" >> "$GITHUB_OUTPUT"
          echo "선택됨: lang=$LANG_IN / topic=$TOPIC_IN"

      - name: 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_KR_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_KR_A }}
          ELEVENLABS_VOICE_ID_KR_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_KR_B }}
          ELEVENLABS_VOICE_ID_EN_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_EN_A }}
          ELEVENLABS_VOICE_ID_EN_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_EN_B }}
          ELEVENLABS_VOICE_ID_JP_A: ${{ secrets.HEALTH_CLINIC_VOICE_ID_JP_A }}
          ELEVENLABS_VOICE_ID_JP_B: ${{ secrets.HEALTH_CLINIC_VOICE_ID_JP_B }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          YOUTUBE_CHANNEL_ID_KR: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_KR }}
          YOUTUBE_CHANNEL_ID_EN: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_EN }}
          YOUTUBE_CHANNEL_ID_JP: ${{ secrets.HEALTH_CLINIC_CHANNEL_ID_JP }}
          # 2026-08-13: 언어별 실제 업로드 채널을 구분하려면 언어마다 별도 OAuth
          # refresh token이 필요하다(공유 token.json 1개로는 3채널 라우팅 불가 — 위
          # youtube_uploader.py 주석 참고). 셋 중 아직 발급 안 된 언어는 빈 값이라
          # 그 언어 실행만 조용히 건너뛴다.
          YOUTUBE_OAUTH_CLIENT_ID_NEW: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_NEW }}
          YOUTUBE_OAUTH_CLIENT_SECRET_NEW: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_NEW }}
          HEALTH_CLINIC_YOUTUBE_REFRESH_TOKENS_JSON: ${{ secrets.HEALTH_CLINIC_YOUTUBE_REFRESH_TOKENS_JSON }}
          NOTIFY_EMAIL_TO: huh0303@gmail.com
          NOTIFY_EMAIL_FROM: huh0303@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ONLY_ARG=""
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ONLY_ARG="--only ${{ github.event.inputs.only }}"
          fi
          python main.py --lang "${{ steps.pick.outputs.lang }}" \
                          --topic "${{ steps.pick.outputs.topic }}" \
                          $ONLY_ARG
