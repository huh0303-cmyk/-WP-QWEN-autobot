name: "Repair four review-list WordPress posts"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Repair titles and search descriptions, then verify public state
        env:
          WP_USER: ${{ secrets.WP_USER }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
        run: python scripts/repair_four_review_wordpress_posts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-wordpress-review-repair-${{ github.run_id }}
          path: artifacts/four-wordpress-review-repair.json
          retention-days: 30
