name: "k-health365.com — Submit canonical sitemap"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyjwt cryptography -q
      - name: Refresh stale sitemap without changing posts
        env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/repair_khealth_sitemap.py
      - name: Submit and verify sitemap in Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/submit_khealth_sitemap.py
