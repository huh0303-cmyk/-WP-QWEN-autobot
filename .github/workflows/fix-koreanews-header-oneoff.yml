name: "One-off: fix koreanews365 header duplicate title and band color"
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python scripts/fix_koreanews_header.py
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
