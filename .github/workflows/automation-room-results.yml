name: "Automation Rooms — Collect Results"

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google Sheets dependencies
        run: pip install google-api-python-client google-auth requests -q
      - name: Validate room skeleton
        run: python -m automation_hub.rooms
      - name: Collect latest workflow results
        env:
          GH_RESULTS_TOKEN: ${{ github.token }}
        run: python -m automation_hub.result_collector --output artifacts/automation-room-results.json
      - name: Sync collected results to Google Sheets dashboard
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ROOM_STATUS_PATH: artifacts/automation-room-results.json
        run: python scripts/sync_room_status_to_sheets.py
      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-room-results-${{ github.run_id }}
          path: artifacts/automation-room-results.json
          retention-days: 7
