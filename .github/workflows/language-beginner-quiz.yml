name: Language Beginner Quiz - Validate and Queue
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate checks configuration; generate is gated until the production pipeline is verified'
        required: true
        type: choice
        options:
          - validate
          - generate
        default: validate
  push:
    paths:
      - 'config/language_beginner_quiz.json'
      - '.github/workflows/language-beginner-quiz.yml'
permissions:
  contents: read
concurrency:
  group: language-beginner-quiz
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved batch specification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/language_beginner_quiz.json').read_text(encoding='utf-8'))
          assert cfg['batch_size']['languages'] == 10
          assert cfg['batch_size']['videos_per_language'] == 100
          assert cfg['batch_size']['questions_per_video'] == 3
          assert cfg['batch_size']['total_videos'] == 1000
          assert cfg['batch_size']['total_questions'] == 3000
          assert len(cfg['language_codes']) == 10 and len(set(cfg['language_codes'])) == 10
          assert cfg['voice_policy']['native_audio_required'] is True
          print('SPEC_VALID: 10 languages / 100 videos per language / 3 questions per video')
          print('TOTAL: 1000 videos / 3000 questions')
          print('This workflow validates the specification only; it does not generate videos.')
          PY
      - name: Prevent premature generation
        if: inputs.mode == 'generate'
        run: |
          echo 'Generation is gated until multilingual image/TTS pipeline and channel registry are verified.'
          exit 1
