name: "CEO Dashboard — roll 14-day content calendar"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *" # 05:17 KST, intentionally not on the hour

permissions:
  contents: read

concurrency:
  group: rolling-content-calendar
  cancel-in-progress: false

jobs:
  extend-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth -q
      - name: Preserve history and extend the 14-day horizon
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/roll_14day_content_calendar.py
