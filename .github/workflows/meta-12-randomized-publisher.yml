name: Meta 12 destination randomized publisher
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meta-12-destination-publisher
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && vars.META_LIVE_PUBLISH == 'true' && vars.META_12_TARGETS_READY == 'true'
    runs-on: ubuntu-latest
    environment: META-SOCIAL
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow -q
      - name: Publish only due, exact-identity verified, pre-tested destinations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_GEMINI_FREE_MODEL: ${{ vars.META_GEMINI_FREE_MODEL }}
          META_LIVE_PUBLISH: ${{ vars.META_LIVE_PUBLISH }}
          META_12_TARGETS_READY: ${{ vars.META_12_TARGETS_READY }}
          META_INSTAGRAM_ENGLISH_SOS1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ENGLISH_SOS1_ACCESS_TOKEN }}
          META_INSTAGRAM_ENGLISH_SOS1_USER_ID: ${{ vars.META_INSTAGRAM_ENGLISH_SOS1_USER_ID }}
          META_INSTAGRAM_JAPANESE_SOS1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_JAPANESE_SOS1_ACCESS_TOKEN }}
          META_INSTAGRAM_JAPANESE_SOS1_USER_ID: ${{ vars.META_INSTAGRAM_JAPANESE_SOS1_USER_ID }}
          META_INSTAGRAM_CHINESE_SOS1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_CHINESE_SOS1_ACCESS_TOKEN }}
          META_INSTAGRAM_CHINESE_SOS1_USER_ID: ${{ vars.META_INSTAGRAM_CHINESE_SOS1_USER_ID }}
          META_INSTAGRAM_KOREAN_SOS1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_KOREAN_SOS1_ACCESS_TOKEN }}
          META_INSTAGRAM_KOREAN_SOS1_USER_ID: ${{ vars.META_INSTAGRAM_KOREAN_SOS1_USER_ID }}
          META_INSTAGRAM_SEOUL_JISOO1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_SEOUL_JISOO1_ACCESS_TOKEN || secrets.META_INSTAGRAM_SEOUL_JISOO_ACCESS_TOKEN }}
          META_INSTAGRAM_SEOUL_JISOO1_USER_ID: ${{ vars.META_INSTAGRAM_SEOUL_JISOO1_USER_ID }}
          META_INSTAGRAM_SEOUL_JOURNAL1_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_SEOUL_JOURNAL1_ACCESS_TOKEN }}
          META_INSTAGRAM_SEOUL_JOURNAL1_USER_ID: ${{ vars.META_INSTAGRAM_SEOUL_JOURNAL1_USER_ID }}
          META_THREADS_ENGLISH_SOS1_ACCESS_TOKEN: ${{ secrets.META_THREADS_ENGLISH_SOS1_ACCESS_TOKEN || secrets.META_THREADS_ENGLISH_PICK1_ACCESS_TOKEN }}
          META_THREADS_ENGLISH_SOS1_USER_ID: ${{ vars.META_THREADS_ENGLISH_SOS1_USER_ID }}
          META_THREADS_JAPANESE_SOS1_ACCESS_TOKEN: ${{ secrets.META_THREADS_JAPANESE_SOS1_ACCESS_TOKEN }}
          META_THREADS_JAPANESE_SOS1_USER_ID: ${{ vars.META_THREADS_JAPANESE_SOS1_USER_ID }}
          META_THREADS_CHINESE_SOS1_ACCESS_TOKEN: ${{ secrets.META_THREADS_CHINESE_SOS1_ACCESS_TOKEN }}
          META_THREADS_CHINESE_SOS1_USER_ID: ${{ vars.META_THREADS_CHINESE_SOS1_USER_ID }}
          META_THREADS_KOREAN_SOS1_ACCESS_TOKEN: ${{ secrets.META_THREADS_KOREAN_SOS1_ACCESS_TOKEN || secrets.META_THREADS_SEOUL_TOPIK_ACCESS_TOKEN }}
          META_THREADS_KOREAN_SOS1_USER_ID: ${{ vars.META_THREADS_KOREAN_SOS1_USER_ID }}
          META_THREADS_SEOUL_JISOO1_ACCESS_TOKEN: ${{ secrets.META_THREADS_SEOUL_JISOO1_ACCESS_TOKEN || secrets.META_THREADS_SEOUL_JISOO_ACCESS_TOKEN }}
          META_THREADS_SEOUL_JISOO1_USER_ID: ${{ vars.META_THREADS_SEOUL_JISOO1_USER_ID }}
          META_THREADS_SEOUL_JOURNAL1_ACCESS_TOKEN: ${{ secrets.META_THREADS_SEOUL_JOURNAL1_ACCESS_TOKEN }}
          META_THREADS_SEOUL_JOURNAL1_USER_ID: ${{ vars.META_THREADS_SEOUL_JOURNAL1_USER_ID }}
        run: python scripts/meta_12_publisher.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-12-publishing-receipts-${{ github.run_id }}
          path: data/meta_12_publishing_receipts.json
          if-no-files-found: ignore
