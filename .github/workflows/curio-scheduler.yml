name: Curio Scheduler (지식채널 5개, 2-3일 간격 랜덤시간 발행 트리거)

# 채널별 다음 예정일/랜덤 시각은 scripts/curio_scheduler.py가 결정한다.
# 15분 폴링은 Actions 사용량만 크게 늘려 2026-08-26부터 매시 17분 1회 확인한다.
on:
  workflow_dispatch:
  # 자동 일정은 youtube-control-scheduler.yml로 통합했다. 이 워크플로는
  # 상태 복구/수동 점검용으로만 남겨 중복 발행을 막는다.

permissions:
  contents: write
  actions: write

concurrency:
  group: curio-scheduler
  cancel-in-progress: false

jobs:
  check:
    if: ${{ false }} # EMERGENCY LOCK: all YouTube/video automation disabled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Check & dispatch channels whose next due date/time passed
        env:
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/curio_scheduler.py
      - name: Commit scheduler state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add curio_scheduler_state.json
          git diff --staged --quiet || git commit -m "chore: curio 스케줄러 상태 갱신 [skip ci]"
          git push
