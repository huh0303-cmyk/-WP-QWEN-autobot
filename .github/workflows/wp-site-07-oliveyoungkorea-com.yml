name: 'WP 07 oliveyoungkorea.com isolated publish'
run-name: 'WP 07 oliveyoungkorea.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://oliveyoungkorea.com'
      publication_approved: true
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
