name: 플리 5채널 라이브 영상 썸네일 전체 교체 (5K 여행잡지 표지)

# 2026-08-16 사용자 지시: "지금 썸네일 다 삭제하고 다시 만들어봐. 5k 여행잡지
# 표지수준으로.. 만들어줘. Healing은 그대로 사진만.. 나머지는 중앙에 PLAYLIST
# 크게 써주고 음파 중앙에 조그맣게.." — 이미 올라가 있는 모든 영상의 썸네일을
# 채널당 새로 만든 6장짜리 뱅크로 순환 교체한다(영상 개수만큼 매번 새 이미지를
# 만들면 비용이 커서, 뱅크를 한 번만 만들고 순환 적용).

on:
  workflow_dispatch: {}

jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        channel: [globalmusic, healing, starbucks, mbb, kpop]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-nanum
      - run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q
      - name: "${{ matrix.channel }} 라이브 썸네일 교체"
        env:
          CHANNEL_KEY: ${{ matrix.channel }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_ID_{0}', matrix.channel == 'globalmusic' && 'GLOBALMUSIC' || matrix.channel == 'healing' && 'HEALING' || matrix.channel == 'starbucks' && 'STARBUCKS' || matrix.channel == 'mbb' && 'MBB' || 'KPOP')] || secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_SECRET_{0}', matrix.channel == 'globalmusic' && 'GLOBALMUSIC' || matrix.channel == 'healing' && 'HEALING' || matrix.channel == 'starbucks' && 'STARBUCKS' || matrix.channel == 'mbb' && 'MBB' || 'KPOP')] || secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_OAUTH_REFRESH_TOKEN_{0}', matrix.channel == 'globalmusic' && 'GLOBALMUSIC' || matrix.channel == 'healing' && 'HEALING' || matrix.channel == 'starbucks' && 'STARBUCKS' || matrix.channel == 'mbb' && 'MBB' || 'KPOP')] || (matrix.channel == 'globalmusic' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN) || '' }}
          THUMBNAIL_FOLDER_ID_GLOBALMUSIC: ${{ secrets.THUMBNAIL_FOLDER_ID_GLOBALMUSIC }}
          THUMBNAIL_FOLDER_ID_HEALING: ${{ secrets.THUMBNAIL_FOLDER_ID_HEALING }}
          THUMBNAIL_FOLDER_ID_STARBUCKS: ${{ secrets.THUMBNAIL_FOLDER_ID_STARBUCKS }}
          THUMBNAIL_FOLDER_ID_MBB: ${{ secrets.THUMBNAIL_FOLDER_ID_MBB }}
          THUMBNAIL_FOLDER_ID_KPOP: ${{ secrets.THUMBNAIL_FOLDER_ID_KPOP }}
        run: python scripts/apply_thumbnail_bank_to_live_videos.py
