name: Audit titles + duplicate images v2 (WP + Blogger, read-only)
# Read-only. Measures repeated words/phrases in titles and photos reused across posts.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: blogger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/audit_titles_images_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-image-audit-v2
          path: artifacts/title_image_audit_v2.json
          if-no-files-found: ignore
