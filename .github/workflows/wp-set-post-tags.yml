name: WP Set Post Tags (1회성 유틸)

on:
  workflow_dispatch:
    inputs:
      site_key:
        description: "사이트 시크릿 키 (예: KHEALTH365COM)"
        required: true
      site_url:
        description: "사이트 URL (예: https://k-health365.com)"
        required: true
      post_id:
        description: "글 ID (예: 3947)"
        required: true
      tags:
        description: "태그, 쉼표로 구분 (예: 원형탈모,탈모원인,두피건강)"
        required: true

jobs:
  set-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q

      - name: "태그 적용"
        env:
          WP_APP_PASSWORD: ${{ secrets[github.event.inputs.site_key] }}
        run: |
          python scripts/wp_set_post_tags.py "${{ github.event.inputs.site_url }}" "${{ github.event.inputs.post_id }}" "${{ github.event.inputs.tags }}"
