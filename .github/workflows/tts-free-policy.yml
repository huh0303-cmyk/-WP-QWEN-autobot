name: London Project - Free-only TTS Policy Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/TTS_PROVIDER_PRIORITY.md'
      - 'scripts/tts_provider_priority.py'
      - 'scripts/seoul_journal_shorts_pipeline.py'
      - '.github/workflows/seoul-journal-political-shorts.yml'
      - '.github/workflows/tts-free-policy.yml'
permissions:
  contents: read
jobs:
  verify-free-tts-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile shared TTS helper
        run: python -m py_compile scripts/tts_provider_priority.py
      - name: Compile Seoul Journal Shorts pipeline
        run: python -m py_compile scripts/seoul_journal_shorts_pipeline.py
      - name: Verify Seoul Journal Shorts uses free-only TTS
        run: |
          python - <<'PY'
          from pathlib import Path
          pipeline = Path('scripts/seoul_journal_shorts_pipeline.py').read_text(encoding='utf-8').lower()
          workflow = Path('.github/workflows/seoul-journal-political-shorts.yml').read_text(encoding='utf-8').lower()
          tts = pipeline[pipeline.index('def tts(text):'):pipeline.index('def fetch_photo')]
          assert 'api.fish.audio/v1/tts' in tts
          assert 's2.1-pro-free' in tts
          assert 'edge_tts' in tts
          assert 'elevenlabs' not in tts
          assert 'elevenlabs' not in workflow
          assert '"privacyStatus":"private"' in pipeline
          print('PASS: Seoul Journal Shorts TTS is free-only and upload remains private.')
          PY
      - name: Verify provider order and paid-fallback guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          source = Path('scripts/tts_provider_priority.py').read_text(encoding='utf-8')
          spec = importlib.util.spec_from_file_location('tts_provider_priority', 'scripts/tts_provider_priority.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = ('fish_audio', 'qwen3_tts', 'edge_tts', 'additional_free')
          assert module.TTS_PRIORITY == expected, module.TTS_PRIORITY
          assert 'elevenlabs_generator' not in source.lower()
          assert 's2.1-pro-free' in source
          policy = Path('docs/TTS_PROVIDER_PRIORITY.md').read_text(encoding='utf-8')
          assert 'Paid TTS is prohibited as an automatic fallback' in policy
          print('PASS: free-only TTS priority and paid fallback guard verified.')
          print('NOTE: This validates the policy/helper only; it does not prove every channel is migrated.')
          PY
