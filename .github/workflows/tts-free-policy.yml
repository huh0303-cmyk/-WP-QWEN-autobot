name: London Project - Free-only TTS Policy Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/TTS_PROVIDER_PRIORITY.md'
      - 'scripts/tts_provider_priority.py'
      - 'scripts/seoul_journal_shorts_pipeline.py'
      - 'scripts/voice_rotation.py'
      - 'scripts/channel_long_video.py'
      - 'scripts/publish_survival_adjective_shorts.py'
      - '.github/workflows/seoul-journal-daily-shorts.yml'
      - '.github/workflows/seoul-journal-auto-publish.yml'
      - 'scripts/classic_reads_longform.py'
      - 'scripts/archive_footage_longform.py'
      - 'scripts/nasa_archive_longform.py'
      - '.github/workflows/youtube-github-worker.yml'
      - '.github/workflows/seoul-journal-political-shorts.yml'
      - '.github/workflows/tts-free-policy.yml'
permissions:
  contents: read
jobs:
  verify-free-tts-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile shared TTS helper
        run: python -m py_compile scripts/tts_provider_priority.py
      - name: Compile Seoul Journal Shorts pipeline
        run: python -m py_compile scripts/seoul_journal_shorts_pipeline.py
      - name: Compile knowledge documentary TTS pipeline
        run: python -m py_compile scripts/classic_reads_longform.py scripts/archive_footage_longform.py scripts/nasa_archive_longform.py
      - name: Verify Seoul Journal Shorts uses free-only TTS
        run: |
          python - <<'PY'
          from pathlib import Path
          pipeline = Path('scripts/seoul_journal_shorts_pipeline.py').read_text(encoding='utf-8').lower()
          workflow = Path('.github/workflows/seoul-journal-political-shorts.yml').read_text(encoding='utf-8').lower()
          tts = pipeline[pipeline.index('def tts(text):'):pipeline.index('def fetch_photo')]
          assert 'api.fish.audio/v1/tts' in tts
          assert 's2.1-pro-free' in tts
          assert 'edge_tts' in tts
          assert 'elevenlabs' not in tts
          assert 'elevenlabs' not in workflow
          assert '"privacystatus":"private"' in pipeline
          print('PASS: Seoul Journal Shorts TTS is free-only and upload remains private.')
          PY
      - name: Verify knowledge documentary narration uses free-only TTS
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/classic_reads_longform.py').read_text(encoding='utf-8')
          start = source.index('def elevenlabs_tts_voice(')
          end = source.index('def _normalize_audio', start)
          tts = source[start:end].lower()
          assert 'from tts_provider_priority import generate_tts' in tts
          assert 's2.1-pro-free' in source or 'fish_audio_free' in tts
          assert 'api.elevenlabs.io' not in tts
          assert 'raise runtimeerror' not in tts or 'all configured free tts providers failed' in Path('scripts/tts_provider_priority.py').read_text(encoding='utf-8').lower()
          worker = Path('.github/workflows/youtube-github-worker.yml').read_text(encoding='utf-8')
          assert 'FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}' in worker
          assert 'edge-tts' in worker
          print('PASS: knowledge narration is routed through free-only Fish Audio -> Edge TTS; no paid TTS endpoint in narration adapter.')
          print('NOTE: Fish Audio still requires the FISH_AUDIO_API_KEY GitHub Actions secret to be configured.')
          PY
      - name: Verify Japan health voice and per-language failure isolation
        run: |
          python -m py_compile scripts/voice_rotation.py scripts/channel_long_video.py scripts/publish_survival_adjective_shorts.py
          python - <<'PY'
          import os
          from scripts.voice_rotation import choose_voice
          os.environ.pop("ELEVENLABS_VOICE_ID_HEALTH_JAPAN", None)
          os.environ.pop("ELEVENLABS_VOICE_IDS_HEALTH_JAPAN", None)
          voice = choose_voice("health_japan")
          assert voice["id"] == "ja-JP-NanamiNeural", voice
          assert voice["gender"] == "female", voice
          publisher = open("scripts/publish_survival_adjective_shorts.py", encoding="utf-8").read()
          assert "PUBLISH_FAILED" in publisher
          assert "failed_count" in publisher
          print("PASS: Japan health has a fixed free female voice profile; language failures are isolated and recorded.")
          PY
      - name: Verify provider order and paid-fallback guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          source = Path('scripts/tts_provider_priority.py').read_text(encoding='utf-8')
          spec = importlib.util.spec_from_file_location('tts_provider_priority', 'scripts/tts_provider_priority.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = ('fish_audio', 'qwen3_tts', 'edge_tts', 'additional_free')
          assert module.TTS_PRIORITY == expected, module.TTS_PRIORITY
          assert 'elevenlabs_generator' not in source.lower()
          assert 's2.1-pro-free' in source
          policy = Path('docs/TTS_PROVIDER_PRIORITY.md').read_text(encoding='utf-8')
          assert 'Paid TTS is prohibited as an automatic fallback' in policy
          print('PASS: free-only TTS priority and paid fallback guard verified.')
          print('NOTE: This validates the policy/helper only; it does not prove every channel is migrated.')
          PY
