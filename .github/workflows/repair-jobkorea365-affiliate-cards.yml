name: Repair JobKorea365 affiliate cards
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Repair all mapped published JobKorea365 posts and verify
        env:
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
        run: python scripts/repair_jobkorea365_affiliate_cards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobkorea365-affiliate-repair-report
          path: reports/jobkorea365-affiliate-repair-2026-11-03.json
          if-no-files-found: warn
