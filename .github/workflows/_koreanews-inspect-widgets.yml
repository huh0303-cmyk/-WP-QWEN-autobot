name: "(1회성) koreanews365 위젯 구조 진단"

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/inspect_koreanews_widgets.py
