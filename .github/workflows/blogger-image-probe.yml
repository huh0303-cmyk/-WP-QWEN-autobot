name: Blogger free image chain probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - name: Verify free stock image selection and permanent hosting
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_ASSET_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: scripts
        run: |
          python - <<'PY'
          import os
          import requests
          import blogger_free_image as b
          assert os.getenv("GH_ASSET_TOKEN"), "GH_ASSET_TOKEN missing: cannot host images"
          assert os.getenv("GITHUB_REPOSITORY"), "GITHUB_REPOSITORY missing"
          assert os.getenv("PEXELS_API_KEY") or os.getenv("PIXABAY_KEY"), "No free stock API credentials"
          result = b.pick_image("Seoul palace autumn", allow_paid_fallback=False)
          assert result and result.get("url"), "FAIL: no stock image selected and hosted"
          assert result.get("provider") in ("Pexels", "Pixabay"), "FAIL: unexpected provider"
          response = requests.get(result["url"], timeout=30)
          response.raise_for_status()
          assert response.headers.get("content-type", "").startswith("image/"), "FAIL: hosted URL is not an image"
          assert len(response.content) > 500, "FAIL: hosted image is empty"
          print("PASS: free stock image hosted and independently verified", result["provider"], len(response.content))
          PY
