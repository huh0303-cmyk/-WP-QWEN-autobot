name: "Blogger 33 — twice daily (AM + PM, random time, GitHub)"

# Chairman 2026-10-05: every Blogspot blog publishes once in the morning and once in the afternoon,
# at a random time each day, from GitHub (PC-independent).
# Mechanism: cron ticks every 30 min inside both windows; a deterministic per-day random target
# (date-seeded, never on the hour) decides when a slot becomes due. Publishing is idempotent per
# blog via the run-key marker, so repeated ticks never double-post. AM key == the VPS timer's key
# (blogger33-daily-<date>), so a VPS run counts as the AM post and the total stays at 2/day.
on:
  schedule:
    - cron: '7,37 22,23,0,1,2 * * *'      # 07:07-11:37 KST
    - cron: '7,37 5,6,7,8,9,10,11 * * *'  # 14:07-20:37 KST
  workflow_dispatch:
    inputs:
      site_key:
        description: "Optional single blog key; empty = all 33"
        required: false
        type: string
      slot:
        description: "Force slot (am/pm) and ignore the random target"
        required: false
        type: string

permissions:
  contents: write   # lets the free-image step re-host Pixabay/AI images under assets/blogger_images

concurrency:
  group: blogger-33-direct-publish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
      key: ${{ steps.g.outputs.key }}
    steps:
      - id: g
        env:
          FORCE_SLOT: ${{ inputs.slot || '' }}
        run: |
          python3 - <<'PY'
          import os, random
          from datetime import datetime, timezone, timedelta
          kst = datetime.now(timezone.utc) + timedelta(hours=9)
          date = kst.date().isoformat()
          forced = os.environ.get("FORCE_SLOT", "").strip().lower()
          slot = forced if forced in ("am", "pm") else ("am" if kst.hour < 13 else "pm")
          lo, hi = ((7, 11) if slot == "am" else (14, 20))
          rnd = random.Random(f"blogger33-{date}-{slot}")
          minute_of_day = rnd.randrange(lo * 60 + 5, hi * 60 + 55)
          if minute_of_day % 60 == 0:
              minute_of_day += 7
          now_min = kst.hour * 60 + kst.minute
          due = bool(forced) or now_min >= minute_of_day
          key = f"blogger33-daily-{date}" + ("" if slot == "am" else "-pm")
          print(f"slot={slot} target={minute_of_day//60:02d}:{minute_of_day%60:02d} KST now={kst:%H:%M} due={due} key={key}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if due else 'false'}\nkey={key}\n")
          PY
  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    environment: blogger
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Publish one article per blog (skips blogs already done for this slot)
        env:
          BLOGGER_REVIEW_DRAFT_MODE: "false"
          BLOGGER_SITE_KEY: ${{ inputs.site_key || '' }}
          PUBLIC_RUN_KEY: ${{ needs.gate.outputs.key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          BLOGGER_GEMINI_MODEL: "gemini-2.5-flash-lite"
          LONDON_WRITER_MODEL: "auto_free"
          LOCAL_TEXT_FALLBACK_ENABLED: "false"   # a 3B local model fails the quality gates and burns ~15 min; retry next tick instead
          BLOGGER_PACE_SECONDS: "40"
          RUNNER_OLLAMA_BOOTSTRAP: "false"
          LOCAL_TEXT_TIMEOUT: "900"
          LOCAL_TEXT_MAX_TOKENS: "3500"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_ASSET_TOKEN: ${{ secrets.GH_ASSET_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_blogger_33_now.py
      - name: Save exact post IDs and URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-33-daily-${{ github.run_id }}
          path: artifacts/blogger-33-public-results.json
          retention-days: 7
          if-no-files-found: ignore
