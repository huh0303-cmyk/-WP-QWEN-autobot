name: n8n VPS preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect VPS runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo "===HOST==="
            hostname
            echo "===OS==="
            . /etc/os-release && echo "$PRETTY_NAME"
            echo "===NODE==="
            command -v node || true
            node --version 2>/dev/null || true
            echo "===NPM==="
            command -v npm || true
            npm --version 2>/dev/null || true
            echo "===N8N==="
            command -v n8n || true
            n8n --version 2>/dev/null || true
            echo "===DOCKER==="
            command -v docker || true
            docker --version 2>/dev/null || true
            echo "===SERVICES==="
            systemctl list-unit-files | grep -E 'korea365|n8n' || true
            echo "===DISK==="
            df -h / /opt 2>/dev/null || true
            echo "===MEMORY==="
            free -h || true
            echo "===REPO==="
            test -d /opt/korea365 && git -C /opt/korea365 rev-parse --short HEAD || true
            echo "===STALE BATCH PROGRESS==="
            found_batch=0
            for receipt in /opt/korea365/artifacts/london-stale-publish-2026-09-29*.json; do
              test -f "$receipt" || continue
              found_batch=1
              echo "---$receipt---"
              cat "$receipt"
            done
            test "$found_batch" -eq 1 || echo "no batch receipt yet"
            echo "===LATEST PIPELINE STATES==="
            python3 - <<'PY'
            import json
            from pathlib import Path
            root=Path('/opt/korea365/data/london-pipeline')
            for path in sorted(root.glob('lgpt-*.json'), key=lambda p:p.stat().st_mtime, reverse=True)[:12]:
                try:
                    d=json.loads(path.read_text(encoding='utf-8'))
                except Exception as exc:
                    print(path.name, type(exc).__name__)
                    continue
                err=d.get('last_error') or {}
                rec=d.get('receipt') or {}
                print(json.dumps({'run_id':d.get('run_id'),'site_id':d.get('site_id'),'stages':d.get('stage_status'),
                                  'error':err.get('message',''),'url':rec.get('url','')},ensure_ascii=False))
            PY
