name: "One-off: backfill visitor counter badge onto all existing Blogger posts"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: |
          mkdir -p artifacts
          python scripts/backfill_blogger_visitor_counter.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-visitor-counter-backfill-${{ github.run_id }}
          path: artifacts/blogger-visitor-counter-backfill.json
          if-no-files-found: warn
          retention-days: 14
