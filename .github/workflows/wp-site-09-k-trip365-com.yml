name: 'WP 09 k-trip365.com isolated publish'
run-name: 'WP 09 k-trip365.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://k-trip365.com'
      publication_approved: true
      room_id: 'manual-k-trip365-com'
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
