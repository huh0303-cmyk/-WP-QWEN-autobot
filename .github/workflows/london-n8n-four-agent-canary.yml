name: London n8n 4-Agent Canary
# retry after local Qwen bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run WordPress and Blogger draft canaries through n8n
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 35m
          script: |
            set -u
            BASE=http://127.0.0.1:5678
            curl -sS "$BASE/healthz"
            stamp=$(date -u +%Y%m%d%H%M%S)

            run_canary() {
              site_id="$1"
              suffix="$2"
              run_id="canary-${stamp}-${suffix}"
              payload=$(printf '{"site_id":"%s","run_id":"%s","publish_mode":"draft"}' "$site_id" "$run_id")
              body_file="/tmp/${suffix}-canary-body.txt"
              state_file="/opt/korea365/data/london-pipeline/${run_id}.json"
              code=$(curl -sS --max-time 20 -o "$body_file" -w '%{http_code}' -X POST "$BASE/webhook/london-content-four-agent" \
                -H 'Content-Type: application/json' \
                --data "$payload" || true)
              echo "HTTP=$code SITE=$site_id"
              cat "$body_file" || true
              echo
              if [ "$code" != "200" ]; then
                echo "=== N8N LOG TAIL ==="
                docker logs korea365-n8n --tail 160 2>&1 || true
                echo "=== GATEWAY LOG TAIL ==="
                journalctl -u korea365-n8n-gateway.service -n 160 --no-pager || true
                echo "=== PIPELINE STATE ==="
                ls -la /opt/korea365/data/london-pipeline 2>/dev/null || true
                for f in /opt/korea365/data/london-pipeline/canary-*-${suffix}.json; do
                  [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
                done
                return 1
              fi
              for i in $(seq 1 240); do
                if [ -f "$state_file" ]; then
                  outcome=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); stage=d.get("stage_status",{}).get("publish","waiting"); print("failed" if d.get("last_error") or stage == "failed" else "done" if stage == "ok" else "waiting")' "$state_file")
                  [ "$outcome" = "done" ] && break
                  [ "$outcome" = "failed" ] && { cat "$state_file"; return 1; }
                fi
                sleep 5
              done
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); r=d.get("receipt") or {}; assert d.get("stage_status",{}).get("publish") == "ok", d; assert r.get("post_id"), d; assert r.get("url"), d; print("CANARY_OK", r.get("status"), r.get("url"))' "$state_file"
            }

            echo "=== WP CANARY: wp_ktrip365 ==="
            run_canary wp_ktrip365 wp || exit 1

            echo "=== BLOGGER CANARY: blogger_ktrip365 ==="
            run_canary blogger_ktrip365 blogger || exit 1
