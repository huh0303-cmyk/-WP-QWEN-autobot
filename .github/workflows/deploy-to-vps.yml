name: "Deploy to VPS (control room + operations)"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request deployment through the VPS deployment owner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            MARKER="$ROOT/data/london-reconcile-complete.json"

            # One-time reconciliation of four reviewed server hotfix files.
            # Every byte is backed up under runtime data before anything is restored.
            # Future server-only modifications remain protected by sync_main.py.
            if [ ! -f "$MARKER" ]; then
              echo "=== LONDON ONE-TIME HOTFIX RECONCILIATION ==="
              BACKUP="$ROOT/data/pre-london-reconcile/$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}"
              mkdir -p "$BACKUP/files"
              chmod 700 "$ROOT/data/pre-london-reconcile" "$BACKUP" "$BACKUP/files"

              python3 - <<'PY'
            import subprocess
            from pathlib import Path

            root = Path('/opt/korea365')
            allowed = {
                'control_center/app.py',
                'control_center/operations_guide.py',
                'control_center/templates/index.html',
                'scripts/situation_room_daily.py',
                'scripts/vps_wordpress_worker.py',
            }
            managed_roots = {'.github', 'automation_hub', 'control_center', 'scripts', 'config', 'deploy', 'tests', 'tools', 'multilang_quiz'}
            raw = subprocess.check_output(
                ['git', '-C', str(root), 'status', '--porcelain=v1', '--untracked-files=no'],
                text=True,
            )
            dirty = []
            for line in raw.splitlines():
                path = line[3:]
                if ' -> ' in path:
                    path = path.split(' -> ', 1)[1]
                p = Path(path)
                managed = p.parts and (p.parts[0] in managed_roots or (len(p.parts) == 1 and (p.suffix == '.py' or path.startswith('requirements'))))
                if managed:
                    dirty.append(path)
            unexpected = sorted(set(dirty) - allowed)
            if unexpected:
                raise SystemExit('Unexpected managed VPS hotfixes; refusing reconciliation: ' + ', '.join(unexpected))
            Path('/tmp/london-reconcile-dirty.txt').write_text('\n'.join(sorted(set(dirty))) + ('\n' if dirty else ''), encoding='utf-8')
            print('Reviewed dirty managed files:', sorted(set(dirty)))
            PY

              cp /tmp/london-reconcile-dirty.txt "$BACKUP/dirty-files.txt"
              git -C "$ROOT" diff --no-ext-diff --binary HEAD -- \
                control_center/app.py \
                control_center/templates/index.html \
                scripts/situation_room_daily.py \
                scripts/vps_wordpress_worker.py \
                > "$BACKUP/tracked-hotfixes.patch" || true

              while IFS= read -r rel; do
                [ -n "$rel" ] || continue
                mkdir -p "$BACKUP/files/$(dirname "$rel")"
                cp -a "$ROOT/$rel" "$BACKUP/files/$rel"
              done < /tmp/london-reconcile-dirty.txt

              # The old VPS had a server-only Playlist module. Its behavior has now
              # been preserved as source-controlled control_center/playlist_v3_page.py.
              # Back up the old untracked copy, then remove only that exact file so
              # the deployer can install the reviewed GitHub version.
              if [ -f "$ROOT/control_center/playlist_v3_page.py" ] && \
                 ! git -C "$ROOT" ls-files --error-unmatch control_center/playlist_v3_page.py >/dev/null 2>&1; then
                mkdir -p "$BACKUP/files/control_center"
                cp -a "$ROOT/control_center/playlist_v3_page.py" "$BACKUP/files/control_center/playlist_v3_page.py"
                rm -f "$ROOT/control_center/playlist_v3_page.py"
                echo "control_center/playlist_v3_page.py" > "$BACKUP/untracked-files.txt"
              fi

              python3 - <<'PY'
            import subprocess
            from pathlib import Path
            root = '/opt/korea365'
            paths = [p for p in Path('/tmp/london-reconcile-dirty.txt').read_text(encoding='utf-8').splitlines() if p]
            for path in paths:
                subprocess.run(['git', '-C', root, 'restore', '--source=HEAD', '--staged', '--worktree', '--', path], check=True)
            print('Restored reviewed tracked hotfixes to deployed HEAD; backups retained.')
            PY
            fi

            # Preserve the reviewed legacy VPS hotfix set even when the old
            # one-time marker already exists. The guarded deployer reports one
            # dirty path at a time, so reconcile the complete known set in one
            # pass. Unknown dirty managed code still blocks deployment.
            REVIEW_BACKUP="$ROOT/data/pre-london-reconcile/$(date -u +%Y%m%dT%H%M%SZ)-reviewed-hotfixes-${{ github.sha }}"
            REVIEWED_HOTFIXES=(
              "control_center/app.py"
              "control_center/operations_guide.py"
              "control_center/templates/index.html"
              "scripts/situation_room_daily.py"
              "scripts/vps_wordpress_worker.py"
              "config/newsroom_rss_watch.json"
            )
            reconciled=0
            mkdir -p "$REVIEW_BACKUP/files" "$REVIEW_BACKUP/patches"
            for rel in "${REVIEWED_HOTFIXES[@]}"; do
              # Always preserve the explicitly reviewed server-hotfix path first.
              if [ -f "$ROOT/$rel" ]; then
                mkdir -p "$REVIEW_BACKUP/files/$(dirname "$rel")" "$REVIEW_BACKUP/patches/$(dirname "$rel")"
                cp -a "$ROOT/$rel" "$REVIEW_BACKUP/files/$rel"
                reconciled=1
              fi
              if git -C "$ROOT" ls-files --error-unmatch "$rel" >/dev/null 2>&1; then
                git -C "$ROOT" diff --no-ext-diff --binary HEAD -- "$rel" > "$REVIEW_BACKUP/patches/$rel.patch" || true
                git -C "$ROOT" restore --source=HEAD --staged --worktree -- "$rel"
                echo "Backed up and restored reviewed tracked hotfix path: $rel"
              elif [ -e "$ROOT/$rel" ]; then
                # The deployed HEAD does not track this path, but a later GitHub
                # revision does. Remove only after backup so sync_main sees the
                # expected old state (absent) and can install the reviewed file.
                rm -f "$ROOT/$rel"
                echo "Backed up and removed reviewed untracked hotfix path: $rel"
              fi
            done
            if [ "$reconciled" -eq 1 ]; then
              chmod -R go-rwx "$REVIEW_BACKUP"
              echo "Reviewed hotfix backup: $REVIEW_BACKUP"
            fi

            # Generic pre-deploy reconciliation. sync_main intentionally refuses
            # any managed path whose server bytes match neither old HEAD nor target.
            # Preserve every such server-only hotfix first, then restore the exact
            # old-HEAD state so the guarded deployer can apply reviewed GitHub main.
            git -C "$ROOT" fetch origin main
            CONFLICT_BACKUP="$ROOT/data/pre-london-reconcile/$(date -u +%Y%m%dT%H%M%SZ)-managed-conflicts-${{ github.sha }}"
            export CONFLICT_BACKUP
            python3 - <<'PY'
            import json, os, shutil, subprocess
            from pathlib import Path

            root = Path('/opt/korea365')
            backup = Path(os.environ['CONFLICT_BACKUP'])
            managed_roots = {'.github', 'automation_hub', 'control_center', 'scripts', 'config', 'deploy', 'tests', 'tools', 'multilang_quiz'}

            def git(*args, check=True):
                return subprocess.run(
                    ['git', '-C', str(root), *args],
                    stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=check,
                )

            old = git('rev-parse', 'HEAD').stdout.decode().strip()
            target = git('rev-parse', 'refs/remotes/origin/main').stdout.decode().strip()
            names = set()
            for args in (
                ('diff', '--name-only', '-z', old, target),
                ('diff', '--name-only', '-z', 'HEAD'),
            ):
                raw = git(*args).stdout.decode().split('\0')
                names.update(x for x in raw if x)

            def blob(rev, rel):
                p = git('show', f'{rev}:{rel}', check=False)
                return p.stdout if p.returncode == 0 else None

            reconciled = []
            for rel in sorted(names):
                p = Path(rel)
                if not p.parts or p.parts[0] not in managed_roots:
                    continue
                current_path = root / rel
                if current_path.is_symlink():
                    raise SystemExit(f'Refusing reconciliation of symlink path: {rel}')
                current = current_path.read_bytes() if current_path.exists() and current_path.is_file() else None
                before = blob(old, rel)
                after = blob(target, rel)
                if current in (before, after):
                    continue

                dest = backup / 'files' / rel
                dest.parent.mkdir(parents=True, exist_ok=True)
                if current is not None:
                    dest.write_bytes(current)
                patch = backup / 'patches' / (rel + '.patch')
                patch.parent.mkdir(parents=True, exist_ok=True)
                patch.write_bytes(git('diff', '--no-ext-diff', '--binary', 'HEAD', '--', rel, check=False).stdout)

                if before is None:
                    if current_path.exists():
                        current_path.unlink()
                else:
                    current_path.parent.mkdir(parents=True, exist_ok=True)
                    current_path.write_bytes(before)
                # Clear staged/index-only changes for paths tracked by old HEAD.
                if before is not None:
                    git('restore', '--source=HEAD', '--staged', '--', rel, check=False)
                reconciled.append(rel)

            if reconciled:
                backup.mkdir(parents=True, exist_ok=True)
                (backup / 'manifest.json').write_text(
                    json.dumps({'old': old, 'target': target, 'reconciled': reconciled}, indent=2),
                    encoding='utf-8',
                )
                backup.chmod(0o700)
                print('Backed up and reconciled managed conflicts:', ', '.join(reconciled))
                print('Managed conflict backup:', backup)
            else:
                print('No managed pre-deploy conflicts found')
            PY

            set +e
            systemctl start korea365-deploy.service
            deploy_rc=$?
            set -e
            if [ "$deploy_rc" -ne 0 ]; then
              echo "=== KOREA365 DEPLOY SERVICE STATUS ==="
              systemctl status korea365-deploy.service --no-pager -l || true
              echo "=== KOREA365 DEPLOY JOURNAL ==="
              journalctl -u korea365-deploy.service -n 120 --no-pager || true
              echo "=== KOREA365 DEPLOY STATUS JSON ==="
              cat "$ROOT/data/deploy-status.json" || true
              exit "$deploy_rc"
            fi

            python3 - <<'PY'
            import json, subprocess
            from pathlib import Path
            root = '/opt/korea365'
            state = json.loads(Path(root + '/data/deploy-status.json').read_text())
            print('DEPLOY_STATUS', json.dumps({k: state.get(k) for k in ('status', 'deployed_commit', 'target_commit')}))
            if state.get('status') not in {'current', 'deployed'}:
                raise SystemExit('Deployment is deferred or failed; inspect VPS deployment status')
            deployed = state.get('deployed_commit') or ''
            target = state.get('target_commit') or ''
            expected = '${{ github.sha }}'
            if not deployed or deployed != target:
                raise SystemExit(f"VPS target mismatch: deployed={deployed} target={target}")
            # Another main commit may land while this deploy run is executing.
            # Accept a newer deployed commit only when the triggering commit is
            # an ancestor of it; never call an unrelated/older deployment good.
            ancestor = subprocess.run(
                ['git','-C',root,'merge-base','--is-ancestor',expected,deployed],
                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
            ).returncode == 0
            if not ancestor:
                raise SystemExit(f"VPS commit does not contain triggering commit: deployed={deployed} expected_ancestor={expected}")
            PY

            # One-time 2026-09-25 remediation: remove any reader-visible internal
            # stock-photo/licence notices from already-published WordPress posts.
            # Uses the root-only credential map provisioned on the VPS; no secret
            # values are written to Git or logs.
            PHOTO_FIX_MARKER="$ROOT/data/public-photo-credit-cleanup-2026-09-25.done"
            if [ ! -f "$PHOTO_FIX_MARKER" ]; then
              echo "=== PUBLIC PHOTO-CREDIT CLEANUP ==="
              PHOTO_CREDIT_CLEANUP_APPLY=true \
                VPS_WP_CREDENTIALS=/etc/korea365/wp-sites.json \
                "$ROOT/.venv/bin/python" "$ROOT/scripts/cleanup_public_photo_credit.py"
              python3 - <<'PY'
            from pathlib import Path
            p = Path('/opt/korea365/data/public-photo-credit-cleanup-2026-09-25.done')
            p.write_text('completed\n', encoding='utf-8')
            p.chmod(0o600)
            print('PHOTO_CREDIT_CLEANUP_MARKER', p)
            PY
            fi

            # Ensure the authenticated WordPress publisher is installed and
            # restarted on every successful code deployment. It owns the WP25
            # daily floor because GitHub-hosted runners are blocked by the sites.
            install -m 644 "$ROOT/deploy/vps/korea365-wp-publisher.service" /etc/systemd/system/korea365-wp-publisher.service
            systemctl daemon-reload
            systemctl enable korea365-wp-publisher.service >/dev/null 2>&1 || true
            systemctl restart korea365-wp-publisher.service
            systemctl is-active korea365-control.service korea365-operations.service korea365-wp-publisher.service

            python3 - <<'PY'
            import json, time
            from pathlib import Path
            path = Path('/opt/korea365/data/london_project_runtime.json')
            deadline = time.time() + 30
            last = None
            while time.time() < deadline:
                if path.exists():
                    try:
                        last = json.loads(path.read_text())
                        now = time.time()
                        mirror_age = now - float(last.get('activity_mirror_heartbeat') or 0)
                        pm_age = now - float(last.get('pm_loop_heartbeat') or 0)
                        if (
                            last.get('operations_worker') == 'active'
                            and last.get('activity_mirror') == 'active'
                            and last.get('pm_loop') == 'active'
                            and mirror_age <= 15
                            and pm_age <= 15
                        ):
                            safe = {
                                'project': last.get('project'),
                                'operations_worker': last.get('operations_worker'),
                                'activity_mirror': last.get('activity_mirror'),
                                'pm_loop': last.get('pm_loop'),
                                'active_pm': last.get('active_pm'),
                                'provider_configured': last.get('provider_configured'),
                                'mirror_age_seconds': round(mirror_age, 2),
                                'pm_age_seconds': round(pm_age, 2),
                            }
                            print('LONDON_RUNTIME', json.dumps(safe, sort_keys=True))
                            Path('/tmp/london-runtime-ok.json').write_text(json.dumps(safe), encoding='utf-8')
                            break
                    except (ValueError, OSError, TypeError):
                        pass
                time.sleep(2)
            else:
                print('LONDON_RUNTIME_LAST', json.dumps(last or {}, sort_keys=True))
                raise SystemExit('London Project runtime heartbeat is not active')
            PY

            # Mark the one-time reconciliation complete only after deploy +
            # service health + London heartbeat have all passed.
            if [ ! -f "$MARKER" ]; then
              python3 - <<'PY'
            import json, time, subprocess
            from pathlib import Path
            root = Path('/opt/korea365')
            backups = sorted((root / 'data/pre-london-reconcile').glob('*'))
            payload = {
                'project': 'london-project',
                'completed_at': time.time(),
                'deployed_commit': subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'], text=True).strip(),
                'backup': str(backups[-1]) if backups else '',
                'note': 'Reviewed server hotfixes backed up before restoring tracked files; future dirty-code protection remains enabled.',
            }
            target = root / 'data/london-reconcile-complete.json'
            target.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
            target.chmod(0o600)
            print('LONDON_RECONCILE', json.dumps(payload, ensure_ascii=False))
            PY
            fi
