name: "Deploy to VPS (control room + operations)"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request deployment through the VPS deployment owner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            set +e
            systemctl start korea365-deploy.service
            deploy_rc=$?
            set -e
            if [ "$deploy_rc" -ne 0 ]; then
              echo "=== KOREA365 DEPLOY SERVICE STATUS ==="
              systemctl status korea365-deploy.service --no-pager -l || true
              echo "=== KOREA365 DEPLOY JOURNAL ==="
              journalctl -u korea365-deploy.service -n 120 --no-pager || true
              echo "=== KOREA365 DEPLOY STATUS JSON ==="
              cat /opt/korea365/data/deploy-status.json || true
              echo "=== SAFE SERVER HOTFIX DIFF: control_center/app.py ==="
              git -C /opt/korea365 diff --no-ext-diff -- control_center/app.py | sed -n '1,1200p' || true
              echo "=== SAFE SERVER CONTROL_CENTER STATUS ==="
              git -C /opt/korea365 status --short --untracked-files=all control_center | sed -n '1,300p' || true
              echo "=== SAFE SERVER MODULE: playlist_v3_page.py ==="
              if [ -f /opt/korea365/control_center/playlist_v3_page.py ]; then
                sed -n '1,1600p' /opt/korea365/control_center/playlist_v3_page.py
              else
                echo "MISSING"
              fi
              exit "$deploy_rc"
            fi

            python3 - <<'PY'
            import json
            from pathlib import Path
            state = json.loads(Path('/opt/korea365/data/deploy-status.json').read_text())
            print('DEPLOY_STATUS', json.dumps({k: state.get(k) for k in ('status', 'deployed_commit', 'target_commit')}))
            if state.get('status') not in {'current', 'deployed'}:
                raise SystemExit('Deployment is deferred or failed; inspect VPS deployment status')
            expected = '${{ github.sha }}'
            if state.get('deployed_commit') != expected:
                raise SystemExit(f"VPS commit mismatch: deployed={state.get('deployed_commit')} expected={expected}")
            PY
            systemctl is-active korea365-control.service korea365-operations.service

            python3 - <<'PY'
            import json, time
            from pathlib import Path
            path = Path('/opt/korea365/data/london_project_runtime.json')
            deadline = time.time() + 25
            last = None
            while time.time() < deadline:
                if path.exists():
                    try:
                        last = json.loads(path.read_text())
                        now = time.time()
                        mirror_age = now - float(last.get('activity_mirror_heartbeat') or 0)
                        pm_age = now - float(last.get('pm_loop_heartbeat') or 0)
                        if (
                            last.get('operations_worker') == 'active'
                            and last.get('activity_mirror') == 'active'
                            and last.get('pm_loop') == 'active'
                            and mirror_age <= 15
                            and pm_age <= 15
                        ):
                            safe = {
                                'project': last.get('project'),
                                'operations_worker': last.get('operations_worker'),
                                'activity_mirror': last.get('activity_mirror'),
                                'pm_loop': last.get('pm_loop'),
                                'active_pm': last.get('active_pm'),
                                'provider_configured': last.get('provider_configured'),
                                'mirror_age_seconds': round(mirror_age, 2),
                                'pm_age_seconds': round(pm_age, 2),
                            }
                            print('LONDON_RUNTIME', json.dumps(safe, sort_keys=True))
                            raise SystemExit(0)
                    except (ValueError, OSError, TypeError):
                        pass
                time.sleep(2)
            print('LONDON_RUNTIME_LAST', json.dumps(last or {}, sort_keys=True))
            raise SystemExit('London Project runtime heartbeat is not active')
            PY
