name: "Deploy to VPS (control room + operations)"

# 2026-09-09: there was no automated deploy at all - merges to main sat in
# GitHub while the VPS kept running whatever it last had, sometimes for
# days. This closes that gap for the two dashboard services. The YouTube
# worker is deliberately NOT restarted here - it was intentionally stopped
# to pause spend, and a deploy should never silently turn it back on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request deployment through the VPS deployment owner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Share the timer's lock, video guard, backup and rollback logic.
            # A second git pull/restart races the timer and cancels service jobs.
            systemctl start korea365-deploy.service
            python3 - <<'PY'
            import json
            from pathlib import Path
            state = json.loads(Path('/opt/korea365/data/deploy-status.json').read_text())
            print(json.dumps({k: state.get(k) for k in ('status', 'deployed_commit', 'target_commit')}))
            if state.get('status') not in {'current', 'deployed'}:
                raise SystemExit('Deployment is deferred or failed; inspect VPS deployment status')
            PY
            systemctl is-active korea365-control.service korea365-operations.service
