name: Weekly Rank Math Health Check (27 sites)

on:
  workflow_dispatch:
  schedule:
    # Rank Math 전수검사는 Playwright/Chromium을 설치하는 무거운 작업이라 주 1회만 실행.
    - cron: "40 19 * * 6"   # 일요일 04:40 KST

concurrency:
  group: weekly-rankmath-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests playwright -q
          python -m playwright install --with-deps chromium
      - name: Run Rank Math check
        run: python scripts/daily_rankmath_check.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_rankmath_report.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 주간 Rank Math 점검 리포트 [skip ci]"
          git pull --rebase origin main
          git push
