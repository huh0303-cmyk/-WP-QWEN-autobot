name: "One-off: inspect k-trip365.com code snippets for wrong title/meta"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
        run: python scripts/inspect_ktrip_snippets.py
