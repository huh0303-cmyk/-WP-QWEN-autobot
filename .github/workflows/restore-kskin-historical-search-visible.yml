name: "Restore KSkin — historical GSC-visible private posts"
on:
  push:
    branches:
      - ops/restore-indexed-private-20260830
    paths:
      - .ops/restore-kskin-historical-search-visible.trigger
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests PyJWT cryptography -q
      - name: "8/25 이전 GSC 노출 URL과 Private 대조 → 공개 복구"
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          WP_USER: ${{ secrets.WP_USER }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
        run: python scripts/restore_kskin_historical_search_visible.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-kskin-historical-${{ github.run_id }}
          path: restore_kskin_historical_search_visible_result.json
          if-no-files-found: warn
          retention-days: 30
