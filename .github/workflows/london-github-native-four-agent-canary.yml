name: "London — GitHub Native 4-Agent Canary (no n8n/VPS)"

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "One WordPress or Blogger site id"
        required: true
        default: "wp_ktrip365"
        type: string
      category:
        description: "Optional category"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: london-github-native-four-agent-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow google-api-python-client google-auth google-genai -q

      - name: Validate target
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          python - <<'PY'
          import os
          site = os.environ["SITE_ID"].strip()
          allowed = {"wp_ktrip365", "blogger_ktrip365"}
          if site not in allowed:
              raise SystemExit(f"Migration canary currently allows only {sorted(allowed)}; got {site!r}")
          print("TARGET_OK", site)
          PY

      - name: Agent 1 — Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          LONDON_WRITER_MODEL: "auto_free"
          FORCE_SOURCE_IPV4: "true"
          PIPELINE_PUBLISH_MODE: "draft"
        run: |
          mkdir -p artifacts
          RUN_ID="github-native-4agent-${{ github.run_id }}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          python scripts/london_four_agent_pipeline.py --stage research --site-id "${{ inputs.site_id }}" --run-id "$RUN_ID" --publish-mode draft --category "${{ inputs.category }}"

      - name: Agent 2 — Writer (quality >= 70)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          LONDON_WRITER_MODEL: "auto_free"
          FORCE_SOURCE_IPV4: "true"
          PIPELINE_PUBLISH_MODE: "draft"
        run: |
          python scripts/london_four_agent_pipeline.py --stage write --run-id "$RUN_ID" --publish-mode draft

      - name: Agent 3 — Image (canary-safe)
        env:
          FORCE_SOURCE_IPV4: "true"
          PIPELINE_IMAGE_ENABLED: "false"
        run: |
          python scripts/london_four_agent_pipeline.py --stage image --run-id "$RUN_ID" --publish-mode draft

      - name: Agent 4 — Publisher + Verify (draft only)
        env:
          FORCE_SOURCE_IPV4: "true"
          PIPELINE_PUBLISH_MODE: "draft"
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          export LONDON_VPS_FREE=true
          python scripts/london_four_agent_pipeline.py --stage publish --run-id "$RUN_ID" --publish-mode draft

      - name: Verify receipt and VPS independence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("data/london-pipeline") / (os.environ["RUN_ID"] + ".json")
          if not p.exists():
              raise SystemExit(f"pipeline state missing: {p}")
          state = json.loads(p.read_text(encoding="utf-8"))
          assert state.get("stage_status", {}).get("research") == "ok", state
          assert state.get("stage_status", {}).get("write") == "ok", state
          assert state.get("stage_status", {}).get("image") == "ok", state
          assert state.get("stage_status", {}).get("publish") == "ok", state
          receipt = state.get("receipt") or {}
          assert receipt.get("post_id"), state
          assert receipt.get("url"), state
          assert receipt.get("status") == "draft", state
          assert receipt.get("publisher") == "github-native", state
          print("GITHUB_NATIVE_4AGENT_OK", receipt)
          PY

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: london-github-native-4agent-${{ github.run_id }}
          path: |
            data/london-pipeline/*.json
            artifacts/**
          if-no-files-found: warn
          retention-days: 7
