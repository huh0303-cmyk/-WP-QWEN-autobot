name: "Deploy London Project Claude console (Naver/Tistory web console)"

# Manually triggered only - this is a separate app/service from the
# korea365-* control room and is NOT part of deploy-to-vps.yml's guarded
# reconciliation. It reuses the same VPS SSH secrets because it deploys to
# the same VPS, but it never touches managed_roots or the korea365 services.
on:
  workflow_dispatch:
    inputs:
      lpc_password:
        description: "Web console login password (admin)"
        required: true
      vnc_password:
        description: "VNC password for the Naver login remote-browser-view"
        required: true

concurrency:
  group: deploy-london-project-claude-console
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            APP_DIR="$ROOT/london_project_claude_console"
            if [ ! -d "$ROOT/.git" ]; then
              echo "$ROOT is not a git checkout - unexpected VPS layout, aborting."
              exit 1
            fi
            echo "=== current HEAD before sync ==="
            git -C "$ROOT" log --oneline -1
            # Don't assume deploy-to-vps.yml's own reconciliation timing/scope has
            # already landed this untracked-by-it directory - pull just our own
            # path directly from origin/main so this workflow is self-sufficient.
            git -C "$ROOT" fetch origin main
            git -C "$ROOT" checkout origin/main -- london_project_claude_console
            echo "=== HEAD after targeted checkout (still on old commit, that's fine) ==="
            git -C "$ROOT" log --oneline -1
            ls -la "$APP_DIR/deploy/"
            chmod +x "$APP_DIR/deploy/install.sh"
            APP_DIR="$APP_DIR" \
              LPC_USER=admin \
              LPC_PASS='${{ inputs.lpc_password }}' \
              VNC_PASSWORD='${{ inputs.vnc_password }}' \
              "$APP_DIR/deploy/install.sh"

            echo "=== [verify] service status after 3s settle ==="
            sleep 3
            systemctl is-active lpc-xvfb lpc-x11vnc lpc-novnc lpc-console || true
            echo "=== [verify] local HTTP check ==="
            curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8787/login || echo "curl failed"
            echo "=== [verify] lpc-console journal (last 20 lines) ==="
            journalctl -u lpc-console -n 20 --no-pager || true
            echo "=== [verify] open ports ==="
            ss -tlnp 2>/dev/null | grep -E ':8787|:6077' || echo "(ss not available or ports not listed)"

            echo "=== [firewall] checking host-level firewall (ufw/iptables) ==="
            if command -v ufw >/dev/null 2>&1; then
              ufw status verbose || true
              if ufw status | grep -q "Status: active"; then
                echo "ufw is active - opening 8787 and 6077"
                ufw allow 8787/tcp || true
                ufw allow 6077/tcp || true
                ufw status verbose || true
              fi
            else
              echo "ufw not installed"
            fi
            echo "--- iptables INPUT chain ---"
            iptables -L INPUT -n --line-numbers 2>/dev/null || echo "(no iptables access)"
