name: "Deploy London Project Claude console (Naver/Tistory web console)"

# Manually triggered only - this is a separate app/service from the
# korea365-* control room and is NOT part of deploy-to-vps.yml's guarded
# reconciliation. It reuses the same VPS SSH secrets because it deploys to
# the same VPS, but it never touches managed_roots or the korea365 services.
on:
  workflow_dispatch:
    inputs:
      lpc_password:
        description: "Web console login password (admin)"
        required: true
      vnc_password:
        description: "VNC password for the Naver login remote-browser-view"
        required: true

concurrency:
  group: deploy-london-project-claude-console
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            APP_DIR="$ROOT/london_project_claude_console"
            if [ ! -d "$ROOT/.git" ]; then
              echo "$ROOT is not a git checkout - unexpected VPS layout, aborting."
              exit 1
            fi
            echo "=== current HEAD before sync ==="
            git -C "$ROOT" log --oneline -1
            # Don't assume deploy-to-vps.yml's own reconciliation timing/scope has
            # already landed this untracked-by-it directory - pull just our own
            # path directly from origin/main so this workflow is self-sufficient.
            git -C "$ROOT" fetch origin main
            git -C "$ROOT" checkout origin/main -- london_project_claude_console
            echo "=== HEAD after targeted checkout (still on old commit, that's fine) ==="
            git -C "$ROOT" log --oneline -1
            ls -la "$APP_DIR/deploy/"
            chmod +x "$APP_DIR/deploy/install.sh"
            APP_DIR="$APP_DIR" \
              LPC_USER=admin \
              LPC_PASS='${{ inputs.lpc_password }}' \
              VNC_PASSWORD='${{ inputs.vnc_password }}' \
              "$APP_DIR/deploy/install.sh"
