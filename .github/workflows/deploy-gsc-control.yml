name: Deploy canonical GSC ranking to Control Center

on:
  push:
    branches: [main]
    paths:
      - "control_center/blog_korea365_ranking.py"
      - "control_center/templates/control_home.html"
      - ".github/workflows/deploy-gsc-control.yml"
  workflow_run:
    workflows: ["Unified GSC ranking · WP25 + Blogspot33"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-gsc-control
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync only canonical GSC dashboard files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            cd "$ROOT"
            git fetch origin main
            BACKUP="$ROOT/data/pre-gsc-ranking/$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BACKUP/control_center/templates"
            for rel in               control_center/blog_korea365_ranking.py               control_center/templates/blog_dashboard.html               control_center/templates/control_home.html               scripts/gsc_unified_ranking.py               data/gsc_unified_ranking.json; do
              if [ -f "$ROOT/$rel" ]; then
                mkdir -p "$BACKUP/$(dirname "$rel")"
                cp -a "$ROOT/$rel" "$BACKUP/$rel"
              fi
            done
            git -C "$ROOT" checkout origin/main --               control_center/blog_korea365_ranking.py               control_center/templates/blog_dashboard.html               control_center/templates/control_home.html               scripts/gsc_unified_ranking.py               data/gsc_unified_ranking.json
            "$ROOT/.venv/bin/python" -m py_compile               "$ROOT/control_center/blog_korea365_ranking.py"               "$ROOT/scripts/gsc_unified_ranking.py"
            systemctl restart korea365-control.service
            sleep 3
            systemctl is-active --quiet korea365-control.service
            echo "GSC_CONTROL_DEPLOYED=$(git -C "$ROOT" rev-parse HEAD)"
            grep -q 'GSC 클릭' "$ROOT/control_center/templates/control_home.html"
            grep -q 'row.get("site")' "$ROOT/control_center/blog_korea365_ranking.py"
            echo "GSC_TEMPLATE_AND_MANIFEST_LOOKUP=verified"
            echo "GSC_RANKING_DATE=$(python3 -c "import json; print(json.load(open('$ROOT/data/gsc_unified_ranking.json',encoding='utf-8')).get('confirmed_date',''))")"
