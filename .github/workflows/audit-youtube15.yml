name: Audit 15 YouTube playlist and language channels
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check five playlist mappings and ten language workflow guards
        run: python scripts/audit_youtube15.py
