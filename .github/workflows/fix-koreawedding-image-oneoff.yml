name: "One-off: replace koreawedding365 post-888 image"
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python scripts/fix_koreawedding_image.py
        env:
          WP_USER: "huh0303@gmail.com"
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          STOCK_IMAGES_ENABLED: "true"
          FORCE_SOURCE_IPV4: "true"
