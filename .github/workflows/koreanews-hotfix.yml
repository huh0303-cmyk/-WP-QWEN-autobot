name: "Koreanews — curate archive and restyle"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "정확히 APPLY-KOREANEWS-CURATION 입력"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - name: "확인 토큰 검사"
        shell: bash
        run: test "${{ inputs.confirm }}" = "APPLY-KOREANEWS-CURATION"
      - name: "기존 글 선별·제목/발췌 정리·카테고리 5개씩 배치"
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/curate_koreanews_archive.py --confirm CURATE-KOREANEWS-5X5
      - name: "새 슬로건과 신문사 기반 설정 적용"
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/apply_newsroom_foundation.py --site koreanews365.com --confirm APPLY-NEWSROOM-FOUNDATION --receipt koreanews_foundation_receipt.json
      - name: "명조체 제호와 국문 첫 화면 재배포"
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/deploy_newsroom_front_page.py --site koreanews365.com --confirm DEPLOY-NEWSROOM-FRONT-PAGE --receipt koreanews_front_page_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koreanews-curation-receipts-${{ github.run_id }}
          path: |
            koreanews_curation_receipt.json
            koreanews_foundation_receipt.json
            koreanews_front_page_receipt.json
          if-no-files-found: warn
          retention-days: 90
