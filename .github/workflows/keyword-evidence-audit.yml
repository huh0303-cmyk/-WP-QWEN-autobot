name: Keyword Search Evidence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyjwt cryptography -q
      - name: Read actual search queries and property access
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/collect_keyword_search_demand.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyword-search-evidence
          path: data/keywords/search_demand.json
          retention-days: 14
