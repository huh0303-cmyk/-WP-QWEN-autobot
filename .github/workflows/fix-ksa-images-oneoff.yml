name: "One-off: fix ksa-korea.org tonally-wrong AI images"
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python fix_ksa_images.py
        working-directory: scripts
        env:
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
