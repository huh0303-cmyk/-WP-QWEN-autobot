name: Deploy Koreanews two-column home grid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/koreanews_home_two_column.php
      - scripts/deploy_koreanews_home_grid.py
      - .github/workflows/koreanews-home-grid-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Deploy active Code Snippet
        env:
          WP_USER: ${{ secrets.WP_USER }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/deploy_koreanews_home_grid.py
