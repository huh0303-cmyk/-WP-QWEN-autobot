name: "One-off, user-approved: deploy k-health365.com related-posts fix (orphan posts)"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/deploy_khealth_related_posts.py
