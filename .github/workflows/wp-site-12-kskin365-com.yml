name: 'WP 12 kskin365.com isolated publish'
run-name: 'WP 12 kskin365.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://kskin365.com'
      publication_approved: true
      room_id: 'manual-kskin365-com'
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
