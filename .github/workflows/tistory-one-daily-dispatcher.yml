name: Tistory Random Three-Daily Dispatcher

on:
  schedule:
    - cron: '7 * * * *'  # Hourly lightweight check; persisted selection prevents a fourth site
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tistory-random-three-daily-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install requests
      - name: Dispatch due randomized Tistory jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/dispatch_tistory_slots.py
