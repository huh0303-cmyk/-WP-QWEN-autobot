name: 'WP 05 jobkoreaglobal.com isolated publish'
run-name: 'WP 05 jobkoreaglobal.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://jobkoreaglobal.com'
      publication_approved: true
      room_id: 'manual-jobkoreaglobal-com'
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
