name: Coupang Partners shared standard tests
on:
  push:
    paths:
      - "automation_hub/coupang_partners.py"
      - "automation_hub/blogger_adapter.py"
      - "scripts/autopost_mega.py"
      - "scripts/london_four_agent_pipeline.py"
      - "config/affiliate/london-shared-policy.json"
      - "tests/test_coupang_partners.py"
      - ".github/workflows/coupang-partners-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest requests
      - run: pytest -q tests/test_coupang_partners.py
