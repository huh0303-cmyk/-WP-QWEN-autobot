name: "Automation Hub — Blogger 33 read-only API visibility check"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      # Read-only Blogger API check only. General Google OAuth is not reused by
      # publishing workflows; a dedicated Blogger write-scoped OAuth grant is
      # still required before any Blogger post can be created or edited.
      - name: Verify OAuth can read the exact 33 configured Blogger IDs
        env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/blogger_verify_account.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blogger-readonly-connection-report-${{ github.run_id }}
          path: blogger_connection_report.json
          if-no-files-found: warn
