name: "(1회성) k-health365 편집국 이름 한국어로 변경"

on:
  workflow_dispatch: {}

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          WP_USER: ${{ secrets.WP_USER }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/rename_khealth_author_korean.py
