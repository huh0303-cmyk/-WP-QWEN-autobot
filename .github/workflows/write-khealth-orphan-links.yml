name: "One-off, user-approved: write k-health365.com orphan-fix internal links"
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many orphan/donor pairs to process this run"
        required: false
        default: "5"
      batch_offset:
        description: "Index to start from in the precomputed pairs list"
        required: false
        default: "0"
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          ORPHAN_FIX_BATCH_SIZE: ${{ inputs.batch_size }}
          ORPHAN_FIX_BATCH_OFFSET: ${{ inputs.batch_offset }}
        run: python scripts/write_khealth_orphan_links.py
