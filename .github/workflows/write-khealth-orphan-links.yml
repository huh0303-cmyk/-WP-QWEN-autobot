name: "One-off, user-approved: write k-health365.com orphan-fix internal links"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/write_khealth_orphan_links.py
