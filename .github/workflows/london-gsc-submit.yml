name: London GPT - submit published site sitemap to GSC

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      site_id:
        required: true
        type: string
      public_url:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyjwt cryptography -q
      - name: Check public page and submit sitemap
        id: submit
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          LONDON_RUN_ID: ${{ inputs.run_id }}
          LONDON_SITE_ID: ${{ inputs.site_id }}
          LONDON_PUBLIC_URL: ${{ inputs.public_url }}
          LONDON_GSC_DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/london_gsc_submit.py
      - name: Store receipt in GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: london-gsc-receipts-${{ github.run_id }}
          path: artifacts/london-gsc-receipts/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if submission failed
        if: steps.submit.outcome != 'success'
        run: exit 1
