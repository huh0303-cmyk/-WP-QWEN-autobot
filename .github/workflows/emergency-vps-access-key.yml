name: "EMERGENCY VPS ACCESS KEY"

on:
  # VPS migration: legacy manual recovery only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install local recovery public key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            PUB='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEGvt4rSZQ4t2zm9Yf5nK9DcupDtVTPm93VFfvvNDcY7 huh03@ChrisHUH'
            install_user_key() {
              local home="$1"
              local sshdir="$home/.ssh"
              sudo mkdir -p "$sshdir"
              sudo chmod 700 "$sshdir"
              sudo touch "$sshdir/authorized_keys"
              sudo chmod 600 "$sshdir/authorized_keys"
              sudo grep -qxF "$PUB" "$sshdir/authorized_keys" || printf '%s\n' "$PUB" | sudo tee -a "$sshdir/authorized_keys" >/dev/null
              sudo chown -R "$(basename "$home")":"$(id -gn "$(basename "$home")" 2>/dev/null || echo "$(basename "$home")")" "$sshdir" 2>/dev/null || true
            }
            install_user_key "$HOME"
            if getent passwd root >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo mkdir -p /root/.ssh
              sudo chmod 700 /root/.ssh
              sudo touch /root/.ssh/authorized_keys
              sudo chmod 600 /root/.ssh/authorized_keys
              sudo grep -qxF "$PUB" /root/.ssh/authorized_keys || printf '%s\n' "$PUB" | sudo tee -a /root/.ssh/authorized_keys >/dev/null
              echo "ROOT_RECOVERY_KEY_INSTALLED"
            else
              echo "ROOT_RECOVERY_KEY_NOT_INSTALLED"
            fi
            echo "RECOVERY_KEY_INSTALLED"
            if ! id recovery >/dev/null 2>&1; then
  sudo useradd -m -s /bin/bash recovery
fi
sudo mkdir -p /home/recovery/.ssh
sudo chmod 700 /home/recovery/.ssh
sudo touch /home/recovery/.ssh/authorized_keys
sudo chmod 600 /home/recovery/.ssh/authorized_keys
sudo grep -qxF "$PUB" /home/recovery/.ssh/authorized_keys || printf '%s\n' "$PUB" | sudo tee -a /home/recovery/.ssh/authorized_keys >/dev/null
sudo chown -R recovery:recovery /home/recovery/.ssh
printf 'recovery ALL=(ALL) NOPASSWD:ALL\n' | sudo tee /etc/sudoers.d/london-recovery >/dev/null
sudo chmod 440 /etc/sudoers.d/london-recovery
echo "RECOVERY_ACCOUNT_READY"
