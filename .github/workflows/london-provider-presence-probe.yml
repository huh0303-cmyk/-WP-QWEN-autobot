name: London Provider Presence Probe

on:
  # VPS migration: legacy manual recovery only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe provider configuration presence on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import json
            from pathlib import Path
            found={}
            p=Path('/etc/korea365/article-runtime.json')
            if p.exists():
                try:
                    d=json.loads(p.read_text())
                    for k in ('OPENAI_API_KEY','GEMINI_API_KEY','ANTHROPIC_API_KEY','ANTHROPIC_WORKSPACE_ID','HF_TOKEN'):
                        found[k]=bool(str(d.get(k,'')).strip())
                except Exception:
                    pass
            p=Path('/etc/korea365/control.env')
            if p.exists():
                for raw in p.read_text(errors='ignore').splitlines():
                    if '=' not in raw or raw.lstrip().startswith('#'):
                        continue
                    k,v=raw.split('=',1)
                    k=k.strip()
                    if k in ('OPENAI_API_KEY','GEMINI_API_KEY','ANTHROPIC_API_KEY','ANTHROPIC_WORKSPACE_ID','HF_TOKEN'):
                        found[k]=bool(v.strip().strip('"').strip("'"))
            for k in ('OPENAI_API_KEY','GEMINI_API_KEY','ANTHROPIC_API_KEY','ANTHROPIC_WORKSPACE_ID','HF_TOKEN'):
                print(k, 'PRESENT' if found.get(k) else 'MISSING')
            PY
            echo "=== VPS RESOURCES ==="
            nproc
            free -h
            df -h /
            echo "OLLAMA=$(command -v ollama || true)"
            echo "LLAMA=$(command -v llama-cli || command -v llama || true)"
            echo "=== DIRECT RESEARCH HTTP ==="
            echo -n "GOOGLE_TRENDS_RSS="; curl -L -sS -o /dev/null -w '%{http_code}\n' --max-time 20 'https://trends.google.com/trending/rss?geo=KR' || true
            echo -n "GOOGLE_NEWS_RSS="; curl -L -sS -o /dev/null -w '%{http_code}\n' --max-time 20 'https://news.google.com/rss/search?q=Korea%20travel&hl=en-US&gl=US&ceid=US:en' || true
            echo -n "NAVER_NEWS_SEARCH="; curl -L -sS -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}\n' --max-time 20 'https://search.naver.com/search.naver?where=news&query=%ED%95%9C%EA%B5%AD%20%EC%97%AC%ED%96%89' || true
