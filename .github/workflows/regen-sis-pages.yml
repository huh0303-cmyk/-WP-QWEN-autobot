name: Regenerate SIS Pages (sis-korea.com fixed pages)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  regen-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: "sis-korea.com 고정 페이지(홈/소개/학사/연락처) 재작성"
        env:
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
        run: python scripts/regenerate_sis_pages.py
      - name: "결과 커밋"
        if: always()
        run: |
          git config user.name "cleanup-bot"
          git config user.email "cleanup-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add regenerate_sis_pages_result.txt
          git commit -m "결과: sis-korea 고정 페이지 재작성 로그" || echo "no changes"
          git push || (git pull --rebase origin main && git push)
