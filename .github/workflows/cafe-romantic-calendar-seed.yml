name: CAFE_ROMANTIC - Seed one canary calendar row

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cafe-romantic-calendar-seed.yml"
      - "scripts/cafe_romantic_calendar_seed.py"

permissions:
  contents: read

jobs:
  append-one-cafe-romantic-row:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: youtube-channels
    env:
      PYTHONUTF8: "1"
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google Sheets runtime
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Append one future row only if no ready row already exists
        run: |
          python -m py_compile scripts/cafe_romantic_calendar_seed.py
          python scripts/cafe_romantic_calendar_seed.py
