name: "Network Index Privacy Sweep (manual, one-off)"

# 2026-08-22 사용자 지시: "다른 모든 사이트도 마찬가지다" — 신문사 2개뿐
# 아니라 26개 활성 사이트 전체(퇴역한 kskin365 제외) 대상으로, 실제 구글
# 색인된 글만 남기고 나머지(색인 안 됐고 발행 60일 이상 지난 글)는
# 비공개(private, 되돌리기 가능) 전환. 이미 있던 audit_gsc_post_index.py
# (조사, GSC URL Inspection API, 읽기전용) + apply_gsc_unindexed_private.py
# (실행, status=private) 그대로 재사용.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests pyjwt cryptography -q
      - name: GSC index audit — all 27 sites (read-only)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/audit_gsc_post_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: index-audit-manifest
          path: index_audit_manifest.json
          retention-days: 30

  apply-private:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: https://k-health365.com
            secret_name: KHEALTH365COM
          - site: https://koreamedicaltour.com
            secret_name: KOREAMEDICALTOURCOM
          - site: https://koreainvest365.com
            secret_name: KOREAINVEST365COM
          - site: https://ki-korea.com
            secret_name: KIKOREACOM
          - site: https://koreainsurance365.com
            secret_name: KOREAINSURANCE365COM
          - site: https://kfinance365.com
            secret_name: KFINANCE365COM
          - site: https://koreataxnlaw.com
            secret_name: KOREATAXNLAWCOM
          - site: https://koreacrypto365.com
            secret_name: KOREACRYPTO365COM
          - site: https://krealestate365.com
            secret_name: KREALESTATE365COM
          - site: https://ktech365.com
            secret_name: KTECH365COM
          - site: https://oliveyoungkorea.com
            secret_name: OLIVEYOUNGKOREACOM
          - site: https://kworld365.com
            secret_name: KWORLD365COM
          - site: https://k-trip365.com
            secret_name: KTRIP365COM
          - site: https://k-visa365.com
            secret_name: KVISA365COM
          - site: https://koreawedding365.com
            secret_name: KOREAWEDDING365COM
          - site: https://kstudy365.com
            secret_name: KSTUDY365COM
          - site: https://studyinkorea365.com
            secret_name: STUDYINKOREA365COM
          - site: https://kieca-korea.org
            secret_name: KIECAKOREAORG
          - site: https://ksa-korea.org
            secret_name: KSAKOREAORG
          - site: https://sis-korea.com
            secret_name: SISKOREACOM
          - site: https://jobkorea365.com
            secret_name: JOBKOREA365COM
          - site: https://jobinkorea365.com
            secret_name: JOBINKOREA365COM
          - site: https://jobkoreaglobal.com
            secret_name: JOBKOREAGLOBALCOM
          - site: https://korea365.org
            secret_name: KOREA365ORG
          - site: https://koreanews365.com
            secret_name: KOREANEWS365COM
          - site: https://theseouljournal.com
            secret_name: THESEOULJOURNALCOM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - uses: actions/download-artifact@v4
        with:
          name: index-audit-manifest
      - name: Apply private (unindexed, 60+ days old) — ${{ matrix.site }}
        env:
          SITE_SECRET: ${{ secrets[matrix.secret_name] }}
        run: |
          export "${{ matrix.secret_name }}=$SITE_SECRET"
          python scripts/apply_gsc_unindexed_private.py --site ${{ matrix.site }} --execute --confirm PRIVATE_REVIEWED_UNINDEXED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-receipt-${{ matrix.secret_name }}
          path: index_privacy_receipt.json
          if-no-files-found: warn
          retention-days: 30
