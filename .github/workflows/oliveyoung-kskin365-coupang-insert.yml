name: OliveYoungKorea and Kskin365 - Coupang Partners all posts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or apply"
        required: true
        default: "dry_run"
        type: choice
        options: [dry_run, apply]
permissions:
  contents: read
jobs:
  insert-affiliate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Insert or audit affiliate sections
        env:
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            python scripts/oliveyoung_kskin365_insert_coupang.py --apply
          else
            python scripts/oliveyoung_kskin365_insert_coupang.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oliveyoung-kskin365-coupang-insert-report
          path: reports/oliveyoung-kskin365-affiliate-insert-2026-11-01.json
