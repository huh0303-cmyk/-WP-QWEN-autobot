name: "One-off: fix 34 broken Blogspot images with stable Pixabay re-host"
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python scripts/fix_broken_blogspot_images.py
        env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_ASSET_TOKEN: ${{ secrets.GH_ASSET_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blogspot-image-fix-results
          path: artifacts/blogspot-image-fix-results.json
          if-no-files-found: ignore
