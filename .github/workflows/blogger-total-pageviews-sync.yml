name: Blogger Total Pageviews → Control feed

on:
  workflow_dispatch:
    inputs:
      site_key:
        description: Optional site filter, e.g. jobkorea365; empty means all 33
        required: false
        type: string
        default: ''
  schedule:
    - cron: "15 22 * * *" # 07:15 KST daily

permissions:
  contents: write

concurrency:
  group: blogger-total-pageviews-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright -q
      - run: python -m playwright install --with-deps chromium
      - name: Render Blogger widgets and update the Control dashboard feed
        env:
          PAGEVIEWS_SITE_KEY: ${{ inputs.site_key || '' }}
        run: python scripts/blogger_total_pageviews.py
      - name: Commit observed totals
        run: |
          git config user.name "korea365-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/blogger_total_pageviews.json docs/blogger-total-pageviews.json docs/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh rendered Blogger pageviews for Control [skip ci]"
          git push origin HEAD:main
