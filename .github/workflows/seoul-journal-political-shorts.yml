name: Seoul Journal Political Shorts (3/day automatic release)

on:
  schedule:
    # Three private review uploads per day: 09:07, 15:27, 21:37 KST.
    - cron: "7 0 * * *"
    - cron: "27 6 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      article_url:
        description: "Optional Naver Politics article URL; leave blank to select a prominent article from Naver Politics. Political content only."
        required: false
        type: string
      confirm_private_upload:
        description: "Confirm manual run will upload PRIVATE for review"
        required: true
        type: boolean
        default: false
      publish_after_validation:
        description: "Manual run only: publish automatically after every quality/readback check passes"
        required: false
        type: boolean
        default: false
      verify_only:
        description: "Render and verify everything without uploading to YouTube"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: seoul-journal-political-shorts
  cancel-in-progress: false

jobs:
  build-validate-and-release:
    environment: FISH_AUDIO_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate OAuth secrets before spending build time
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_IDS: ${{ secrets.FISH_AUDIO_VOICE_IDS }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
          SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          THUMBNAIL_API_READY: ${{ vars.SEOUL_JOURNAL_THUMBNAIL_API_READY }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$THUMBNAIL_API_READY" != "true" ]; then
            echo "::error title=Thumbnail permission required::Scheduled public release is blocked until SEOUL_JOURNAL_THUMBNAIL_API_READY=true after a successful thumbnails.set test."
            exit 1
          fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "$CONFIRM_PRIVATE_UPLOAD" != "true" ]; then
            echo "::error title=Confirmation required::Re-run this workflow and check 'Confirm upload will be PRIVATE only'."
            exit 1
          fi
          missing=""
          for name in GEMINI_API_KEY FISH_AUDIO_API_KEY YOUTUBE_OAUTH_CLIENT_ID YOUTUBE_OAUTH_CLIENT_SECRET SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN; do
            eval 'value=${'"$name"'-}'
            if [ -z "$value" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured. Check the repository secret or the FISH_AUDIO_API_KEY environment secret."
              missing="yes"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Stopped before installing dependencies. No video was generated or uploaded."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requests for read-only OAuth preflight
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify exact Seoul Journal channel before generation
        env:
          PROFILE: SEOUL_JOURNAL
          CLIENT_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          EXPECTED_CHANNEL_ID: UChRUdHZlXSjftAqBtdDNEWA
        run: python scripts/youtube_auth_preflight.py
      - name: Install system fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests trafilatura beautifulsoup4 Pillow google-generativeai google-api-python-client google-auth google-auth-httplib2 edge-tts
      - name: Build context-complete POLITICS-ONLY Short and upload as PRIVATE
        env:
          INPUT_ARTICLE_URL: ${{ inputs.article_url }}
          SEOUL_JOURNAL_CONTENT_SCOPE: politics
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_IDS: ${{ secrets.FISH_AUDIO_VOICE_IDS }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
          SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID: UChRUdHZlXSjftAqBtdDNEWA
          AUTO_PUBLIC_AFTER_VALIDATION: ${{ github.event_name == 'schedule' || inputs.publish_after_validation == true }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: python scripts/seoul_journal_shorts_pipeline.py
      - name: Upload package, MP4, and private upload receipt as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-journal-political-short-${{ github.run_id }}
          path: artifacts/seoul-journal-short/
          if-no-files-found: warn
          retention-days: 14
