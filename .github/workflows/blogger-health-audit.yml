name: Blogger public feed health audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/blogger_health_audit.py'
      - '.github/workflows/blogger-health-audit.yml'
  schedule:
    - cron: '17 22 * * *'
permissions:
  contents: write
concurrency:
  group: blogger-health-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read public Blogger feeds
        run: python scripts/blogger_health_audit.py
      - name: Save snapshot
        run: |
          git config user.name "korea365-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/blogger_health.json
          git diff --cached --quiet && exit 0
          git commit -m "data: blogger public feed audit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
