name: "Automation Rooms — Validate Skeleton"

on:
  workflow_dispatch:
  push:
    paths:
      - "config/automation_rooms.json"
      - "config/automation_workflow_contracts.json"
      - "automation_hub/rooms.py"
      - "automation_hub/workflow_contracts.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate room counts and safety policies
        run: python -m automation_hub.rooms
      - name: Validate room to workflow contracts
        run: python -m automation_hub.workflow_contracts
