name: "One-off: fetch k-health365.com redirect/orphan snippet codes"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/khealth_snippet_codes.py
