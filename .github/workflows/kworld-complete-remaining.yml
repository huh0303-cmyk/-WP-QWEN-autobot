name: Kworld365 - finish remaining existing articles sequentially
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kworld-complete-sequential
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Rewrite remaining posts in sequential batches after first 13
        env:
          PYTHONPATH: scripts:.
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        shell: bash
        run: |
          failures=0
          for start in 13 23 33 43 53 63; do
            echo "::group::Kworld365 batch start=$start"
            python -m scripts.kworld_bulk_rewrite --start "$start" --limit 10 || failures=$((failures+1))
            echo "::endgroup::"
          done
          echo "FAILED_BATCHES=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kworld-rewrite-remaining-backups-${{ github.run_id }}
          path: artifacts/kworld-rewrites/
          retention-days: 30
