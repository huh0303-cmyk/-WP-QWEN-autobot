name: "Automation Hub — tests"

on:
  push:
    branches: [main]
    paths:
      - "automation_hub/**"
      - "scripts/process_platform_queue.py"
      - "scripts/sync_automation_hub_to_sheets.py"
      - "tests/**"
      - ".github/workflows/automation-hub-tests.yml"
  pull_request:
    paths:
      - "automation_hub/**"
      - "scripts/process_platform_queue.py"
      - "scripts/sync_automation_hub_to_sheets.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - run: python -m unittest discover -s tests -v
      - run: python -m automation_hub.cli validate
