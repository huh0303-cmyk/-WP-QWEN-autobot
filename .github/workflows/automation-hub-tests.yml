name: "Automation Hub — tests"

on:
  push:
    branches: [main]
    paths:
      - "automation_hub/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "automation_hub/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests beautifulsoup4 pytest flask google-api-python-client google-auth google-genai -q
      - run: python -m pytest tests -q
      - run: python -m automation_hub.cli validate
      - run: python -c "from automation_hub.youtube_registry import load_channels; assert len(load_channels()) == 10"
      - run: python scripts/audit_active_policy.py
