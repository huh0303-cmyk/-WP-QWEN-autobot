name: (임시) YouTube 채널 확인

# 2026-08-15: channel_key 입력 추가 — 영상 생성 없이 GitHub에 저장된 특정
# 채널의 refresh token이 실제로 유효한지(+어느 채널로 인증되는지) 1분 내로
# 저비용 확인하기 위함. kpop unauthorized_client 반복 디버깅용.
on:
  workflow_dispatch:
    inputs:
      channel_key:
        description: "확인할 채널 시크릿 접미사 (비우면 공용 YOUTUBE_OAUTH_REFRESH_TOKEN). 예: KPOP, HEALING, STARBUCKS"
        required: false

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth google-auth-httplib2 requests -q
      - name: "refresh token 자체가 유효한지 저비용 확인 (raw grant, youtube.upload 스코프 제약 없이)"
        env:
          CHANNEL_KEY: ${{ github.event.inputs.channel_key }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_KPOP: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_KPOP }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_STARBUCKS: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_STARBUCKS }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_MBB: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_MBB }}
        run: |
          python - <<'EOF'
          import os
          import hashlib
          import requests

          key = os.environ.get("CHANNEL_KEY", "").strip().upper()
          token_env_name = f"YOUTUBE_OAUTH_REFRESH_TOKEN_{key}" if key else "YOUTUBE_OAUTH_REFRESH_TOKEN"
          refresh_token = os.environ.get(token_env_name, "")
          cid = os.environ["YOUTUBE_OAUTH_CLIENT_ID"]
          print(f"확인 대상 시크릿: {token_env_name}")
          print(f"토큰 길이: {len(refresh_token)}자 / sha256 앞 12자: "
                f"{hashlib.sha256(refresh_token.encode()).hexdigest()[:12] if refresh_token else '(비어있음)'}")
          print(f"client_id 앞 20자: {cid[:20]}...")

          # channels.list는 youtube.upload 스코프 토큰에선 403 나므로(2026-08-14 확인된
          # 하드 제약) 여기선 raw refresh grant만 확인 — 200이면 이 저장소 시크릿 조합
          # (client_id/secret + 이 refresh token)이 GitHub Actions에서 실제로 유효하다는 뜻.
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": cid,
              "client_secret": os.environ["YOUTUBE_OAUTH_CLIENT_SECRET"],
              "refresh_token": refresh_token,
              "grant_type": "refresh_token",
          })
          print(f"refresh grant 결과: HTTP {r.status_code}")
          print(r.text[:300])
          EOF
