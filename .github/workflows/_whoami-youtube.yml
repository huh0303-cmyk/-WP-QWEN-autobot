name: (임시) YouTube 채널 확인

on:
  workflow_dispatch: {}

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth google-auth-httplib2 -q
      - name: "연결된 유튜브 채널 조회 (읽기 전용, 아무것도 올리지 않음)"
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_OAUTH_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_OAUTH_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_OAUTH_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          youtube = build("youtube", "v3", credentials=creds)
          resp = youtube.channels().list(part="snippet,statistics", mine=True).execute()
          for ch in resp.get("items", []):
              sn = ch["snippet"]
              st = ch.get("statistics", {})
              handle = sn.get("customUrl", "(핸들 없음)")
              print(f"채널명: {sn['title']}")
              print(f"핸들/커스텀URL: {handle}")
              print(f"채널 ID: {ch['id']}")
              print(f"구독자수: {st.get('subscriberCount', '?')}")
              print(f"URL: https://www.youtube.com/channel/{ch['id']}")
          if not resp.get("items"):
              print("연결된 채널을 찾을 수 없음 — 토큰/권한 확인 필요")
          EOF
