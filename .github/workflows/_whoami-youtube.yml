name: (임시) YouTube 채널 확인

# 2026-08-15: channel_key 입력 추가 — 영상 생성 없이 GitHub에 저장된 특정
# 채널의 refresh token이 실제로 유효한지(+어느 채널로 인증되는지) 1분 내로
# 저비용 확인하기 위함. kpop unauthorized_client 반복 디버깅용.
on:
  workflow_dispatch:
    inputs:
      channel_key:
        description: "확인할 채널 시크릿 접미사 (비우면 공용 YOUTUBE_OAUTH_REFRESH_TOKEN). 예: KPOP, HEALING, STARBUCKS"
        required: false

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth google-auth-httplib2 requests -q
      - name: "공용 client_id를 쓰는 모든 채널 refresh token을 한 번에 저비용 확인"
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_GLOBALMUSIC: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_GLOBALMUSIC }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_STARBUCKS: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_STARBUCKS }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_MBB: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_MBB }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_KPOP: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_KPOP }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_NASA_SPACE_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_NASA_SPACE_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_HISTORY_TODAY_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HISTORY_TODAY_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_SCIENCE_FACTS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_SCIENCE_FACTS_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSICAL_JOURNAL: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSICAL_JOURNAL }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_MYTH_LEGEND_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_MYTH_LEGEND_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_INVENTION_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_INVENTION_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_AMERICAN_ARCHIVE_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_AMERICAN_ARCHIVE_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_SILENT_ERA_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_SILENT_ERA_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_RETRO_REELS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_RETRO_REELS_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSIC_READS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSIC_READS_TIMES }}
        run: |
          python - <<'EOF'
          import os
          import requests

          cid = os.environ["YOUTUBE_OAUTH_CLIENT_ID"]
          csec = os.environ["YOUTUBE_OAUTH_CLIENT_SECRET"]
          print(f"client_id 앞 20자: {cid[:20]}...\n")

          keys = [
              "GLOBALMUSIC", "HEALING", "STARBUCKS", "MBB", "KPOP",
              "NASA_SPACE_TIMES", "HISTORY_TODAY_TIMES", "SCIENCE_FACTS_TIMES",
              "CLASSICAL_JOURNAL", "MYTH_LEGEND_TIMES", "INVENTION_TIMES",
              "AMERICAN_ARCHIVE_TIMES", "SILENT_ERA_TIMES", "RETRO_REELS_TIMES",
              "CLASSIC_READS_TIMES",
          ]
          for key in keys:
              tok = os.environ.get(f"YOUTUBE_OAUTH_REFRESH_TOKEN_{key}", "")
              if not tok:
                  print(f"{key}: (시크릿 없음)")
                  continue
              r = requests.post("https://oauth2.googleapis.com/token", data={
                  "client_id": cid, "client_secret": csec,
                  "refresh_token": tok, "grant_type": "refresh_token",
              })
              status = "OK" if r.status_code == 200 else r.json().get("error", r.status_code)
              print(f"{key}: HTTP {r.status_code} ({status})")
          EOF
