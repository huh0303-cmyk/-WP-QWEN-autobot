name: 'WP 04 koreainvest365.com isolated publish'
run-name: 'WP 04 koreainvest365.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://koreainvest365.com'
      publication_approved: true
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
