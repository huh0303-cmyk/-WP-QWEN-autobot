name: "One-off: trash wrong-language post on koreawedding365"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
        run: python scripts/fix_koreawedding.py
