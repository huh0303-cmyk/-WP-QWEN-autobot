name: Meta ten connections randomized daily plan
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify randomized schedule
        run: python -m unittest discover -s tests -p test_meta_daily_schedule.py
      - name: Build today's 30 KST slots
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          python scripts/meta_daily_schedule.py --date "$DAY" --output reports/meta-daily-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: meta-daily-plan-${{ github.run_id }}
          path: reports/meta-daily-plan.json
      - name: Report publication gate
        run: echo "Plan only. Missing tokens, write scopes, content generation and live dispatcher must be resolved before publication."
