name: "Blogger 33 — direct public publish"

on:
  push:
    branches: [main]
    paths:
      - "data/blogger33-run-trigger.txt"
  workflow_dispatch:
    inputs:
      run_key:
        description: "Unique idempotency key"
        required: false
        type: string
      site_key:
        description: "단일 사이트 데모/재시도용 (예: ktrip365). 비우면 기존대로 33개 전체 대상."
        required: false
        type: string
      draft_mode:
        description: "true = 공개 발행 대신 검토용 비공개 초안만 생성 (수동 실행 기본값). 정기 자동 발행(push 트리거)은 이 값과 무관하게 항상 공개 발행 유지."
        required: false
        default: "true"
        type: string
      schedule_at:
        description: "선택: 미래 KST 시각(YYYY-MM-DDTHH:MM). Blogger 네이티브 예약발행(publishDate) 사용 — 비우면 즉시."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: blogger-33-direct-publish-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    environment: blogger
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Publish one independent article to each of 33 Blogger destinations
        env:
          # push 트리거(정기 자동 발행)는 workflow_dispatch inputs가 없으므로 항상 기존 그대로
          # "false"(공개, 33개 전체)로 평가된다. 수동 dispatch일 때만 draft_mode(기본 true)로
          # 전환 가능 — 2026-09-26 Chairman 요청으로 1개 사이트 안전 시연을 위해 추가.
          BLOGGER_REVIEW_DRAFT_MODE: ${{ inputs.draft_mode || 'false' }}
          BLOGGER_SITE_KEY: ${{ inputs.site_key || '' }}
          # 2026-10-09: publish_blogger_33_now.py는 Blogger API 네이티브 예약발행
          # (publishDate, BLOGGER_SCHEDULE_AT)을 이미 지원하지만 이 워크플로우에는 입력이
          # 연결돼 있지 않았음 — WP와 동일한 "진짜 미래 예약" 경로로 연결(큐/크론 불필요).
          BLOGGER_SCHEDULE_AT: ${{ inputs.schedule_at || '' }}
          PUBLIC_RUN_KEY: ${{ inputs.run_key || github.run_id }}
          REVIEW_RUN_KEY: ${{ inputs.run_key || github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          BLOGGER_GEMINI_MODEL: "gemini-2.5-flash-lite"
          LONDON_WRITER_MODEL: "auto_free"
          # 마지막 수단: 무료 로컬 Qwen 2.5 3B (러너에서 필요할 때만 Ollama 설치·pull)
          LOCAL_TEXT_FALLBACK_ENABLED: "true"
          RUNNER_OLLAMA_BOOTSTRAP: "false"
          LOCAL_TEXT_TIMEOUT: "900"
          LOCAL_TEXT_MAX_TOKENS: "3500"
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          # 2026-10-09: 수동 dispatch 워크플로우에 이 네 개가 빠져 있어서 pick_image()의
          # 무료 스톡 검색(Pexels/Pixabay)도, image_guarantee.ensure_image()의 최종 카드
          # 호스팅(GH_ASSET_TOKEN/GITHUB_REPOSITORY)도 둘 다 조용히 실패해 이미지 없이
          # 발행되고 있었음. blogger-33-daily-github.yml(정기 자동발행)과 동일하게 추가 —
          # 전부 무료(Pexels/Pixabay 무료 키, GH_ASSET_TOKEN은 github.token 폴백).
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_ASSET_TOKEN: ${{ secrets.GH_ASSET_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_blogger_33_now.py
      - name: Save exact post IDs and URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-33-public-results-${{ github.run_id }}
          path: artifacts/blogger-33-public-results.json
          retention-days: 7
