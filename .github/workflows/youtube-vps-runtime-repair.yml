name: Repair YouTube VPS Google runtime

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install and verify required Google client libraries
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            python3 -m pip install --disable-pip-version-check --break-system-packages \
              'google-api-python-client==2.187.0' \
              'google-api-core==2.25.1' \
              'google-auth==2.41.1'
            python3 -c "from googleapiclient.discovery import build; from google.oauth2.credentials import Credentials; print('google_runtime=PASS')"
            systemctl restart korea365-youtube-worker.service
            systemctl is-active korea365-youtube-worker.service
