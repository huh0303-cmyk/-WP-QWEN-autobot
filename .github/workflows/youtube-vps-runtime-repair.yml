name: Repair YouTube VPS Google runtime

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install and verify required Google client libraries
        uses: appleboy/ssh-action@v1.2.0
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REFRESH_TOKEN,SHEET_ID
          command_timeout: 8m
          script: |
            set -euo pipefail
            python3 -m pip install --disable-pip-version-check --break-system-packages \
              'google-api-python-client==2.187.0' \
              'google-api-core==2.25.1' \
              'google-auth==2.41.1'
            python3 -c "from googleapiclient.discovery import build; from google.oauth2.credentials import Credentials; print('google_runtime=PASS')"
            ENV_FILE="$(systemctl show korea365-youtube-worker.service --property=EnvironmentFiles --value | awk '{print $1}')"
            if [ -z "$ENV_FILE" ] || [ ! -f "$ENV_FILE" ]; then
              ENV_FILE=/etc/korea365/control.env
            fi
            python3 - "$ENV_FILE" <<'PY'
            import os
            from pathlib import Path
            import shlex
            import sys

            path = Path(sys.argv[1])
            updates = {
                key: os.environ[key]
                for key in (
                    "GOOGLE_OAUTH_CLIENT_ID",
                    "GOOGLE_OAUTH_CLIENT_SECRET",
                    "GOOGLE_OAUTH_REFRESH_TOKEN",
                    "SHEET_ID",
                )
            }
            if not all(updates.values()):
                raise SystemExit("required Google Sheet runtime values are missing")
            existing = path.read_text(encoding="utf-8").splitlines() if path.exists() else []
            kept = [line for line in existing if line.split("=", 1)[0].strip() not in updates]
            kept.extend(f"{key}={shlex.quote(value)}" for key, value in updates.items())
            path.parent.mkdir(parents=True, exist_ok=True)
            temporary = path.with_suffix(path.suffix + ".tmp")
            temporary.write_text("\n".join(kept) + "\n", encoding="utf-8")
            temporary.chmod(0o600)
            temporary.replace(path)
            print("google_sheet_runtime_env=PASS")
            PY
            systemctl restart korea365-youtube-worker.service
            systemctl is-active korea365-youtube-worker.service
