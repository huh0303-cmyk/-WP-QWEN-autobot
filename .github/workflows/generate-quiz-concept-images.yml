name: (일회성) 단어퀴즈 카드 이미지 재생성

on:
  workflow_dispatch:
    inputs:
      only_missing:
        description: "체크하면 없는 것만 생성, 체크 해제하면 30개 전체 재생성"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multilang_quiz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests -q

      - name: 이미지 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.only_missing }}" = "true" ]; then
            python3 scripts/generate_concept_images.py --only-missing
          else
            python3 scripts/generate_concept_images.py
          fi

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add multilang_quiz/canva_assets/*.png
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 단어퀴즈 카드 이미지 재생성 (Gemini)"
          git push
