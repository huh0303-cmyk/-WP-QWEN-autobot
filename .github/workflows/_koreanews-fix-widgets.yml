name: "(1회성) koreanews365 테마 데모 위젯 정리"

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/fix_koreanews_theme_widgets.py
