name: "Control Room — publish one SNS platform now"

# A deliberate dispatch publishes Instagram/Threads publicly.
# Other platforms retain their existing private/draft upload behavior.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "발행할 플랫폼 하나"
        required: true
        type: choice
        options: [tiktok, instagram, facebook, threads, youtube]
      brand:
        description: "게시 계정 브랜드"
        type: choice
        options: [TOPIK, ENGLISH, LANGUAGE]
        default: TOPIK
      source_run_id:
        description: "생성 영상이 보관된 TOPIK 실행 ID (선택)"
        required: false
        default: ""
      lang:
        description: "meta_<lang>.json의 언어 코드 (기본 ko)"
        required: false
        default: "ko"
      meta_path:
        description: "직접 meta.json 경로 지정(선택, 비우면 위 lang 사용)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: social-publish-${{ inputs.brand || 'TOPIK' }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  publish-one-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q
      - name: Download generated review artifact
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: topik-review-${{ inputs.source_run_id }}
          path: topik_quiz_output
      - uses: actions/cache/restore@v4
        with:
          path: .meta-publish-state
          key: meta-receipts-${{ inputs.brand || 'TOPIK' }}-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: meta-receipts-${{ inputs.brand || 'TOPIK' }}-${{ inputs.platform }}-
      - name: Publish to the one requested platform
        env:
          SOCIAL_PUBLISH_PLATFORM: ${{ inputs.platform }}
          META_PUBLISH_ENABLED: "true"
          SOCIAL_BRAND: ${{ inputs.brand || 'TOPIK' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
          IG_LOGIN_TYPE: ${{ vars.IG_LOGIN_TYPE || 'facebook' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IG_ACCESS_TOKEN_ENGLISH: ${{ secrets.IG_ACCESS_TOKEN_ENGLISH }}
          IG_USER_ID_ENGLISH: ${{ secrets.IG_USER_ID_ENGLISH }}
          IG_ACCESS_TOKEN_LANGUAGE: ${{ secrets.IG_ACCESS_TOKEN_LANGUAGE }}
          IG_USER_ID_LANGUAGE: ${{ secrets.IG_USER_ID_LANGUAGE }}
          THREADS_ACCESS_TOKEN_ENGLISH: ${{ secrets.THREADS_ACCESS_TOKEN_ENGLISH }}
          THREADS_USER_ID_ENGLISH: ${{ secrets.THREADS_USER_ID_ENGLISH }}
          THREADS_ACCESS_TOKEN_LANGUAGE: ${{ secrets.THREADS_ACCESS_TOKEN_LANGUAGE }}
          THREADS_USER_ID_LANGUAGE: ${{ secrets.THREADS_USER_ID_LANGUAGE }}
          INPUT_META_PATH: ${{ inputs.meta_path }}
          TARGET_LANG: ${{ inputs.lang }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN_ENGLISH: ${{ secrets.FB_PAGE_ACCESS_TOKEN_ENGLISH }}
          FB_PAGE_ID_ENGLISH: ${{ secrets.FB_PAGE_ID_ENGLISH }}
          FB_PAGE_ACCESS_TOKEN_LANGUAGE: ${{ secrets.FB_PAGE_ACCESS_TOKEN_LANGUAGE }}
          FB_PAGE_ID_LANGUAGE: ${{ secrets.FB_PAGE_ID_LANGUAGE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NORMAL_COMPLETION_EMAIL_ENABLED: "false"
        run: |
          if [ -n "$INPUT_META_PATH" ]; then
            python scripts/social_publish.py "$INPUT_META_PATH"
          else
            python scripts/social_publish.py "$TARGET_LANG"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .meta-publish-state
          key: meta-receipts-${{ inputs.brand || 'TOPIK' }}-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-publish-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .meta-publish-state/*.json
            topik_quiz_output/publish_result_*.json
          if-no-files-found: warn
