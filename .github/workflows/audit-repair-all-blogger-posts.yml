name: "Audit and repair all English Blogger posts"

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Remove Korean summary blocks while preserving every image"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: audit-repair-all-blogger-posts
  cancel-in-progress: false

jobs:
  audit-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Inventory every draft, scheduled post, and published post
        env:
          APPLY_CHANGES: ${{ inputs.apply_changes }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENABLED: "true"
          OPENAI_MODEL: "gpt-5-mini"
        run: python scripts/audit_repair_all_blogger_posts.py
      - name: Upload complete audit and editor-ready descriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-all-posts-repair-${{ github.run_id }}
          path: artifacts/blogger-all-posts-repair.json
          retention-days: 30
