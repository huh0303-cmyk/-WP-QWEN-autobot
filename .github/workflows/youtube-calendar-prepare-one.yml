name: Prepare one YouTube calendar item for private upload

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Verified upload channel
        required: true
        type: choice
        options:
          - globalmusic
          - healing

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client==2.187.0 google-api-core==2.25.1 google-auth==2.41.1 -q
      - name: Move one prepared row to the nearest unoccupied date
        env:
          CHANNEL_KEYS: ${{ inputs.channel }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/bump_youtube_calendar_slots.py
