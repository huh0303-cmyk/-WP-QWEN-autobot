name: Restore KoreaNews365 menu
on: workflow_dispatch
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          WP_PASSWORD: ${{ secrets.KOREANEWS365COM }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          url="https://koreanews365.com/wp-json/code-snippets/v1/snippets"
          token=base64.b64encode(("huh0303@gmail.com:"+os.environ["WP_PASSWORD"]).encode()).decode()
          headers={"Authorization":"Basic "+token,"Content-Type":"application/json"}
          def api(url,method="GET",body=None):
              return json.load(urllib.request.urlopen(urllib.request.Request(url,body,headers,method=method),timeout=30))
          name="KoreaNews365 Korean editorial category menu"
          code=Path("scripts/koreanews_category_menu.php").read_text(encoding="utf-8").removeprefix("<?php").replace("2026-08-21-v4-military","2026-11-14-v5-politics")
          previous=next((item for item in api(url) if item["name"]==name),None)
          body=json.dumps(dict(name=name,code=code,scope="global",active=True)).encode()
          result=api(url+"/"+str(previous["id"]),"PUT",body) if previous else api(url,"POST",body)
          assert result["active"]
          PY