name: Unified GSC ranking · WP25 + Blogspot33

on:
  push:
    branches: [main]
    paths:
      - "scripts/gsc_unified_ranking.py"
      - "config/blogger_portfolio.json"
      - "control_center/blog_korea365_ranking.py"
      - "control_center/templates/control_home.html"
      - "docs/ranking/index.html"
      - ".github/workflows/gsc-unified-ranking.yml"
  schedule:
    - cron: "17 22 * * *" # 07:17 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unified-gsc-ranking
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GSC client dependencies
        run: pip install requests pyjwt cryptography -q

      - name: Collect canonical GSC ranking evidence
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/gsc_unified_ranking.py

      - name: Publish evidence to static ranking page
        run: |
          set -euo pipefail
          mkdir -p docs/ranking
          cp data/gsc_unified_ranking.json docs/ranking/data.json

      - name: Validate unified evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/gsc_unified_ranking.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["metric"] == "gsc_clicks"
          assert d["counts"]["wordpress"] == 25
          assert d["counts"]["blogspot"] == 33
          assert len(d["records"]) == 58
          assert len({r["requested_date"] for r in d["records"]}) == 1
          a = json.loads(Path("data/gsc_target_property_audit.json").read_text(encoding="utf-8"))
          assert a["counts"]["target_total"] == 58
          assert len(a["targets"]) == 58
          assert len({r["site"] for r in a["targets"]}) == 58
          assert d["policy"].startswith("WP25 + Blogspot33 unified ranking uses only Google Search Console")
          print("validated", d["confirmed_date"], d["counts"], "property_audit", a["counts"])
          PY

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsc_unified_ranking.json data/gsc_target_property_audit.json docs/ranking/data.json
          if git diff --cached --quiet; then
            echo "No ranking evidence changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh unified GSC ranking evidence [skip ci]"

          # Other London Project workflows also commit to main. Rebase the
          # generated evidence commit on the newest main before pushing.
          # Retry in case another workflow pushes during the rebase/push window.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; generated ranking evidence takes precedence for its three output files."
              git checkout --theirs -- data/gsc_unified_ranking.json data/gsc_target_property_audit.json docs/ranking/data.json || true
              git add data/gsc_unified_ranking.json data/gsc_target_property_audit.json docs/ranking/data.json
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "Ranking evidence committed successfully on latest main."
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying after fetching main."
            sleep $((attempt * 2))
          done
          echo "Could not push ranking evidence after 5 retries."
          exit 1
