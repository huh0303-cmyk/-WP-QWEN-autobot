name: Generate TOPIK Quiz Shorts (카테고리 → 세로 숏폼 → 드라이브)

on:
  workflow_dispatch:
    inputs:
      category:
        description: "카테고리 (예: 동물/음식/직업/색깔. 비우면 무작위)"
        required: false
        type: string
      num_items:
        description: "문항 수"
        required: false
        type: string
        default: "5"
      target_lang:
        description: "질문 언어 (정답 단어는 항상 한국어 그대로)"
        required: false
        type: choice
        default: "ko"
        options:
          - "ko"
          - "ja"
          - "en"
          - "es"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Install Python dependencies
        run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q

      - name: Run TOPIK quiz generator
        env:
          TOPIC_CATEGORY: ${{ github.event.inputs.category }}
          NUM_ITEMS: ${{ github.event.inputs.num_items }}
          TARGET_LANG: ${{ github.event.inputs.target_lang }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/topik_quiz_shorts.py

      - name: Upload result as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topik-quiz-${{ github.run_id }}
          path: |
            topik_quiz_output/final.mp4
          retention-days: 3
          if-no-files-found: ignore
