name: "k-health365.com — Remove fabricated future-dated citations (one-off)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: "가짜 출처(2027년) 2건 제거"
        env:
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/fix_khealth_fake_citations.py
