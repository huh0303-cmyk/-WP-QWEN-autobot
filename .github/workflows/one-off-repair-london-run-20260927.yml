name: One-off verify LondonProjectGPT published URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-repair-london-run-20260927.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published WordPress URL from VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            URL='https://jobkorea365.com/finding-first-jobs-navigating-youth-employment-in-korea/'
            code=$(curl -L -sS -o /tmp/london-published.html -w '%{http_code}' --max-time 30 "$URL")
            echo "PUBLIC_HTTP=$code"
            test "$code" = "200"
            grep -qi 'Finding First Jobs' /tmp/london-published.html
            echo "PUBLIC_VERIFY_OK $URL"
