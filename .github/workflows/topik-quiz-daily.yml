name: TOPIK 단어 퀴즈 쇼츠 — 검수용 생성만

# 운영 원칙: 자동 생성 콘텐츠는 먼저 비공개/검수 상태로 만들고,
# 사용자가 최종 검수한 뒤 별도 게시한다. 기본값은 생성만 하며, 명시적인
# 소액 E2E 검증 때만 PRIVATE/DRAFT/준비 상태의 플랫폼 업로드를 1회 실행한다.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "카테고리 (비우면 무작위)"
        required: false
        default: ""
      num_items:
        description: "문항 수"
        required: false
        default: "5"
      run_social_review:
        description: "SNS/YouTube 검토본 업로드 실행 (PRIVATE/DRAFT, 기본 꺼짐)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: topik-quiz-review-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "시스템 의존성"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum fonts-noto-cjk
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-topikquiz-v2
      - run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q
      - name: "초급 TOPIK 퀴즈 5개 검수본 생성"
        env:
          TOPIC_CATEGORY: ${{ inputs.category }}
          NUM_ITEMS: ${{ inputs.num_items || '5' }}
          TARGET_LANG: "ko"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/topik_quiz_shorts.py
      - name: "SNS/YouTube 검토본 1세트 업로드"
        if: ${{ inputs.run_social_review == true }}
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: SELF_ONLY
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python scripts/social_publish.py topik_quiz_output/meta_ko.json
      - name: "검수용 영상/메타데이터 보관"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topik-review-${{ github.run_id }}
          path: |
            topik_quiz_output/*.mp4
            topik_quiz_output/*.json
          retention-days: 14
          if-no-files-found: warn
