name: Generate YouTube Playlist (음악 60-80분 + 썸네일 → 최종 mp4)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "주제어 (예: Tokyo, New York, tropical beach EDM — 비워두면 썸네일창고 랜덤 폴백)"
        required: false
        type: string
      language:
        description: "언어 키워드 (예: Japanese, French, German — 비워두면 Mixed 전체)"
        required: false
        type: string
      caption:
        description: "캡션 문구 (비워두면 주제어 기반으로 자동 생성)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + Korean font)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum

      - name: Install Python dependencies
        run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q

      - name: Run playlist maker
        env:
          TOPIC_KEYWORD: ${{ github.event.inputs.topic }}
          LANGUAGE_KEYWORD: ${{ github.event.inputs.language }}
          CAPTION_TEXT: ${{ github.event.inputs.caption }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/youtube_playlist_maker.py

      - name: Upload result as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-playlist-${{ github.run_id }}
          path: |
            playlist_output/final.mp4
          retention-days: 3
          if-no-files-found: ignore
