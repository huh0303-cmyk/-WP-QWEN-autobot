name: Generate YouTube Playlist (음악 60-80분 + 썸네일 → 최종 mp4)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "플리 채널 선택 (2026-08-03 5개 채널 분리 - 채널마다 전용 음악폴더+유튜브토큰 필요)"
        required: false
        type: choice
        default: "globalmusic"
        options:
          - "globalmusic"
          - "healing"
          - "starbucks"
          - "mbb"
          - "kpop"
      preset_theme:
        description: "빠른 선택 프리셋 (고르면 아래 topic 직접입력보다 우선 적용됨)"
        required: false
        type: choice
        default: "직접입력(topic 사용)"
        options:
          - "직접입력(topic 사용)"
          - "봄"
          - "여름"
          - "가을"
          - "겨울"
          - "바다"
          - "산"
          - "호수"
          - "도시 야경"
          - "시골 마을"
          - "카페 감성"
          - "Seoul"
          - "London"
          - "Paris"
          - "Tokyo"
          - "New York"
          - "Sapporo"
          - "Miami"
          - "LA"
          - "Prague"
          - "Switzerland"
      topic:
        description: "도시/주제명 직접 입력 (예: Tokyo, New York — 위 프리셋을 '직접입력'으로 두면 이 값 사용. 여행 매거진 톤 배경사진+타이틀로 생성. 둘 다 비워두면 썸네일창고 랜덤 폴백)"
        required: false
        type: string
      language:
        description: "음악 언어 (예: Japanese, French, German — 그 언어 태그 곡만 선곡. 비워두면 Mixed 무작위)"
        required: false
        type: string
      caption:
        description: "캡션 문구 (비워두면 주제어 기반으로 자동 생성)"
        required: false
        type: string
      publish_delay_hours:
        description: "승인 후 유튜브 예약발행까지 걸리는 시간(시간 단위). 비우면 승인 즉시 공개"
        required: false
        type: string
  schedule:
    # 2026-08-07: 승인 게이트를 없애고 완전자동(생성→업로드→공개)으로 전환.
    # 채널별 전용 토큰(YOUTUBE_OAUTH_REFRESH_TOKEN_<채널명>)이 없으면 publish
    # 잡이 공용 토큰으로 엉뚱한 채널에 잘못 올리지 않고 그냥 실패하도록
    # 고쳐뒀다(아래 publish 잡 참고) — 그래서 mbb/kpop도 미리 스케줄에 넣어도
    # 안전하다. 토큰 없는 채널은 그냥 그 회차만 실패로 로그에 남고, 영상은
    # Google Drive에 남아있다가 get_youtube_refresh_token.py로 mbb/kpop 토큰을
    # 발급해서 시크릿에 등록하는 순간부터 자동으로 정상 작동한다.
    - cron: "0 15 * * *"      # globalmusic — 매일 00:00 KST
    # 2026-08-12: healing/starbucks/mbb/kpop 전부 전용 OAuth 토큰 재발급 완료
    # (새 OAuth 클라이언트로 채널별 브랜드계정 각각 재인증) — 크론 복구.
    - cron: "15 15 * * *"     # healing — 매일 00:15 KST
    - cron: "0 15 */3 * *"    # starbucks — 3일 간격 00:00 KST
    - cron: "30 15 */2 * *"   # mbb — 2일 간격 00:30 KST
    - cron: "45 15 */2 * *"   # kpop — 2일 간격 00:45 KST

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      video_drive_id: ${{ steps.meta.outputs.video_drive_id }}
      thumb_drive_id: ${{ steps.meta.outputs.thumb_drive_id }}
      yt_title: ${{ steps.meta.outputs.yt_title }}
      yt_description: ${{ steps.meta.outputs.yt_description }}
      channel_key_upper: ${{ steps.meta.outputs.channel_key_upper }}
      title_is_fallback: ${{ steps.meta.outputs.title_is_fallback }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + Korean font)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum

      - name: Install Python dependencies
        run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q

      - name: Run playlist maker
        env:
          AUTO_TOPIC: ${{ github.event_name == 'schedule' && 'true' || '' }}
          CHANNEL_KEY: ${{ github.event.inputs.channel || (github.event.schedule == '15 15 * * *' && 'healing') || (github.event.schedule == '0 15 */3 * *' && 'starbucks') || (github.event.schedule == '30 15 */2 * *' && 'mbb') || (github.event.schedule == '45 15 */2 * *' && 'kpop') || 'globalmusic' }}
          PRESET_THEME: ${{ github.event.inputs.preset_theme }}
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
          LANGUAGE_KEYWORD: ${{ github.event.inputs.language }}
          CAPTION_TEXT: ${{ github.event.inputs.caption }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 채널별 전용 폴더 - 아직 안 만든 채널은 시크릿이 없어서 공용 기본값으로
          # 자동 폴백된다(youtube_playlist_maker.py의 _channel_env 참고)
          MUSIC_SOURCE_FOLDER_ID_GLOBALMUSIC: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_GLOBALMUSIC }}
          MUSIC_SOURCE_FOLDER_ID_HEALING: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_HEALING }}
          MUSIC_SOURCE_FOLDER_ID_STARBUCKS: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_STARBUCKS }}
          MUSIC_SOURCE_FOLDER_ID_MBB: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_MBB }}
          MUSIC_SOURCE_FOLDER_ID_KPOP: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_KPOP }}
          THUMBNAIL_FOLDER_ID_GLOBALMUSIC: ${{ secrets.THUMBNAIL_FOLDER_ID_GLOBALMUSIC }}
          THUMBNAIL_FOLDER_ID_HEALING: ${{ secrets.THUMBNAIL_FOLDER_ID_HEALING }}
          THUMBNAIL_FOLDER_ID_STARBUCKS: ${{ secrets.THUMBNAIL_FOLDER_ID_STARBUCKS }}
          THUMBNAIL_FOLDER_ID_MBB: ${{ secrets.THUMBNAIL_FOLDER_ID_MBB }}
          THUMBNAIL_FOLDER_ID_KPOP: ${{ secrets.THUMBNAIL_FOLDER_ID_KPOP }}
          OUTPUT_FOLDER_ID_GLOBALMUSIC: ${{ secrets.OUTPUT_FOLDER_ID_GLOBALMUSIC }}
          OUTPUT_FOLDER_ID_HEALING: ${{ secrets.OUTPUT_FOLDER_ID_HEALING }}
          OUTPUT_FOLDER_ID_STARBUCKS: ${{ secrets.OUTPUT_FOLDER_ID_STARBUCKS }}
          OUTPUT_FOLDER_ID_MBB: ${{ secrets.OUTPUT_FOLDER_ID_MBB }}
          OUTPUT_FOLDER_ID_KPOP: ${{ secrets.OUTPUT_FOLDER_ID_KPOP }}
        run: |
          if [ -n "$PRESET_THEME" ] && [ "$PRESET_THEME" != "직접입력(topic 사용)" ]; then
            export TOPIC_KEYWORD="$PRESET_THEME"
          else
            export TOPIC_KEYWORD="$TOPIC_INPUT"
          fi
          echo "사용할 주제어: $TOPIC_KEYWORD (자동선택 모드: $AUTO_TOPIC)"
          python scripts/youtube_playlist_maker.py

      - name: Export upload metadata for the publish job
        id: meta
        env:
          CHANNEL_KEY: ${{ github.event.inputs.channel || (github.event.schedule == '15 15 * * *' && 'healing') || (github.event.schedule == '0 15 */3 * *' && 'starbucks') || (github.event.schedule == '30 15 */2 * *' && 'mbb') || (github.event.schedule == '45 15 */2 * *' && 'kpop') || 'globalmusic' }}
        run: |
          python - <<'EOF'
          import json, os
          with open("playlist_output/upload_meta.json", encoding="utf-8") as f:
              m = json.load(f)
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"video_drive_id={m['video_drive_id']}\n")
              f.write(f"thumb_drive_id={m['thumb_drive_id']}\n")
              f.write("yt_title<<EOM\n" + m['title'] + "\nEOM\n")
              f.write("yt_description<<EOM\n" + m['description'] + "\nEOM\n")
              f.write(f"channel_key_upper={os.environ['CHANNEL_KEY'].upper()}\n")
              f.write(f"title_is_fallback={'true' if m.get('title_is_fallback') else 'false'}\n")
          EOF

      - name: Upload result as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-playlist-${{ github.run_id }}
          path: |
            playlist_output/final.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit recent-topics state (auto mode anti-repeat)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add playlist_recent_topics.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 플레이리스트 자동선택 최근주제 갱신 [skip ci]"
          git push

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q

      - name: Upload approved video to YouTube
        env:
          VIDEO_DRIVE_ID: ${{ needs.prepare.outputs.video_drive_id }}
          THUMB_DRIVE_ID: ${{ needs.prepare.outputs.thumb_drive_id }}
          YT_TITLE: ${{ needs.prepare.outputs.yt_title }}
          YT_DESCRIPTION: ${{ needs.prepare.outputs.yt_description }}
          TITLE_IS_FALLBACK: ${{ needs.prepare.outputs.title_is_fallback }}
          PUBLISH_AT_HOURS_FROM_NOW: ${{ github.event.inputs.publish_delay_hours }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          # 채널 전용 토큰이 있으면 그걸 쓴다. globalmusic만 공용 토큰이 곧
          # 자기 채널 것이라 폴백 허용 — 그 외 채널은 전용 토큰이 없으면 절대
          # 폴백하지 않고 그냥 비워서 다음 스텝에서 실패시킨다(뒤섞임 사고 방지:
          # 예전엔 여기서 공용 토큰으로 폴백해서 healing/mbb/kpop 영상이 엉뚱한
          # 채널로 올라갈 뻔한 적이 있었음).
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_OAUTH_REFRESH_TOKEN_{0}', needs.prepare.outputs.channel_key_upper)] || (needs.prepare.outputs.channel_key_upper == 'GLOBALMUSIC' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN) || '' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/youtube_publish_approved.py
