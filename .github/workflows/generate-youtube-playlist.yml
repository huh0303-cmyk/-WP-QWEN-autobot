name: Generate YouTube Playlist (음악 60-80분 + 승인 이미지 → 최종 mp4)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "플리 채널"
        required: false
        type: choice
        default: "globalmusic"
        options: [globalmusic, healing, starbucks, mbb, kpop]
      schedule_id:
        description: "Central calendar schedule ID (required to execute)"
        required: true
        type: string
      claim_token:
        description: "One-use calendar claim from the central scheduler"
        required: true
        type: string
      preset_theme:
        description: "빠른 선택 프리셋"
        required: false
        type: choice
        default: "직접입력(topic 사용)"
        options: ["직접입력(topic 사용)", "봄", "여름", "가을", "겨울", "바다", "산", "호수", "도시 야경", "시골 마을", "카페 감성", "Seoul", "London", "Paris", "Tokyo", "New York", "Sapporo", "Miami", "LA", "Prague", "Switzerland"]
      topic:
        description: "도시/주제명 직접 입력"
        required: false
        type: string
      language:
        description: "음악 언어"
        required: false
        type: string
      caption:
        description: "캡션 문구"
        required: false
        type: string
      publish_delay_hours:
        description: "DEPRECATED: 자동공개 금지 정책으로 무시됨"
        required: false
        type: string
      room_id:
        description: "Automation Hub room id"
        required: false
        type: string
      healing_theme:
        description: "healing 테마"
        required: false
        type: choice
        default: "(무작위)"
        options: ["(무작위)", strong_rain, stream_calm, weak_rain]
      fix_video_id:
        description: "기존 영상 메타데이터 수정용 ID"
        required: false
        type: string
      fix_topic:
        description: "메타데이터 수정용 주제"
        required: false
        type: string
      fix_duration_min:
        description: "메타데이터 수정용 영상 길이(분)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-production-single-owner
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.schedule_id != '' && inputs.claim_token != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      video_drive_id: ${{ steps.meta.outputs.video_drive_id }}
      thumb_drive_id: ${{ steps.meta.outputs.thumb_drive_id }}
      yt_title: ${{ steps.meta.outputs.yt_title }}
      yt_description: ${{ steps.meta.outputs.yt_description }}
      yt_tags: ${{ steps.meta.outputs.yt_tags }}
      channel_key_upper: ${{ steps.meta.outputs.channel_key_upper }}
      title_is_fallback: ${{ steps.meta.outputs.title_is_fallback }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-nanum
      - name: Install Python dependencies
        run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q
      - name: Resolve channel credential profile
        id: channel-profile
        shell: bash
        run: echo "upper=$(echo '${{ inputs.channel }}' | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
      - name: Preflight OAuth scope and exact channel identity
        env:
          CHANNEL_KEY: ${{ inputs.channel }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_ID_{0}', steps.channel-profile.outputs.upper)] || secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_SECRET_{0}', steps.channel-profile.outputs.upper)] || secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_OAUTH_REFRESH_TOKEN_{0}', steps.channel-profile.outputs.upper)] || (steps.channel-profile.outputs.upper == 'GLOBALMUSIC' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN) || '' }}
        run: python scripts/youtube_readiness_check.py --channel "$CHANNEL_KEY"
      - name: Claim calendar job (reject re-runs)
        env:
          SCHEDULE_ID: ${{ inputs.schedule_id }}
          CLAIM_TOKEN: ${{ inputs.claim_token }}
          CHANNEL_KEY: ${{ inputs.channel }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/youtube_calendar_result.py start
      - name: Run playlist maker — GPT text + Replicate-only image
        env:
          AUTO_TOPIC: "true"
          CHANNEL_KEY: ${{ inputs.channel || 'globalmusic' }}
          PRESET_THEME: ${{ inputs.preset_theme }}
          TOPIC_INPUT: ${{ inputs.topic }}
          LANGUAGE_KEYWORD: ${{ inputs.language }}
          CAPTION_TEXT: ${{ inputs.caption }}
          HEALING_THEME: ${{ (inputs.healing_theme != '(무작위)' && inputs.healing_theme) || '' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENABLED: "true"
          AI_TEXT_PROVIDER: "openai"
          OPENAI_IMAGE_ENABLED: "false"
          PAID_IMAGE_GENERATION_ENABLED: "false"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PLAYLIST_VIDEO_GENERATION_ENABLED: "true"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MUSIC_SOURCE_FOLDER_ID_GLOBALMUSIC: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_GLOBALMUSIC }}
          MUSIC_SOURCE_FOLDER_ID_HEALING: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_HEALING }}
          MUSIC_SOURCE_FOLDER_ID_STARBUCKS: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_STARBUCKS }}
          MUSIC_SOURCE_FOLDER_ID_MBB: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_MBB }}
          MUSIC_SOURCE_FOLDER_ID_KPOP: ${{ secrets.MUSIC_SOURCE_FOLDER_ID_KPOP }}
          THUMBNAIL_FOLDER_ID_GLOBALMUSIC: ${{ secrets.THUMBNAIL_FOLDER_ID_GLOBALMUSIC }}
          THUMBNAIL_FOLDER_ID_HEALING: ${{ secrets.THUMBNAIL_FOLDER_ID_HEALING }}
          THUMBNAIL_FOLDER_ID_STARBUCKS: ${{ secrets.THUMBNAIL_FOLDER_ID_STARBUCKS }}
          THUMBNAIL_FOLDER_ID_MBB: ${{ secrets.THUMBNAIL_FOLDER_ID_MBB }}
          THUMBNAIL_FOLDER_ID_KPOP: ${{ secrets.THUMBNAIL_FOLDER_ID_KPOP }}
          OUTPUT_FOLDER_ID_GLOBALMUSIC: ${{ secrets.OUTPUT_FOLDER_ID_GLOBALMUSIC }}
          OUTPUT_FOLDER_ID_HEALING: ${{ secrets.OUTPUT_FOLDER_ID_HEALING }}
          OUTPUT_FOLDER_ID_STARBUCKS: ${{ secrets.OUTPUT_FOLDER_ID_STARBUCKS }}
          OUTPUT_FOLDER_ID_MBB: ${{ secrets.OUTPUT_FOLDER_ID_MBB }}
          OUTPUT_FOLDER_ID_KPOP: ${{ secrets.OUTPUT_FOLDER_ID_KPOP }}
        run: |
          if [ -n "$PRESET_THEME" ] && [ "$PRESET_THEME" != "직접입력(topic 사용)" ]; then export TOPIC_KEYWORD="$PRESET_THEME"; else export TOPIC_KEYWORD="$TOPIC_INPUT"; fi
          python scripts/youtube_playlist_maker.py
      - name: Export upload metadata
        id: meta
        env:
          CHANNEL_KEY: ${{ inputs.channel || 'globalmusic' }}
        run: |
          python - <<'EOF'
          import json, os
          with open("playlist_output/upload_meta.json", encoding="utf-8") as f: m=json.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"video_drive_id={m['video_drive_id']}\n"); f.write(f"thumb_drive_id={m['thumb_drive_id']}\n")
              f.write("yt_title<<EOM\n"+m['title']+"\nEOM\n"); f.write("yt_description<<EOM\n"+m['description']+"\nEOM\n")
              f.write("yt_tags<<EOM\n"+",".join(m.get('tags') or [])+"\nEOM\n"); f.write(f"channel_key_upper={os.environ['CHANNEL_KEY'].upper()}\n")
              f.write(f"title_is_fallback={'true' if m.get('title_is_fallback') else 'false'}\n")
          EOF
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-playlist-${{ github.run_id }}
          path: playlist_output/final.mp4
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit anti-repeat state
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true; git pull --rebase origin main; git stash pop || true
          if grep -q "^<<<<<<< " playlist_recent_topics.json 2>/dev/null || grep -q "^<<<<<<< " playlist_recent_tracks.json 2>/dev/null; then git checkout HEAD -- playlist_recent_topics.json playlist_recent_tracks.json; exit 0; fi
          git add playlist_recent_topics.json playlist_recent_tracks.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 플레이리스트 최근 상태 갱신 [skip ci]"; git push

  publish:
    if: ${{ needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q
      - name: Upload video to YouTube PRIVATE only
        env:
          SCHEDULE_ID: ${{ inputs.schedule_id }}
          CLAIM_TOKEN: ${{ inputs.claim_token }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          VIDEO_DRIVE_ID: ${{ needs.prepare.outputs.video_drive_id }}
          THUMB_DRIVE_ID: ${{ needs.prepare.outputs.thumb_drive_id }}
          YT_TITLE: ${{ needs.prepare.outputs.yt_title }}
          YT_DESCRIPTION: ${{ needs.prepare.outputs.yt_description }}
          YT_TAGS: ${{ needs.prepare.outputs.yt_tags }}
          TITLE_IS_FALLBACK: ${{ needs.prepare.outputs.title_is_fallback }}
          CHANNEL_KEY: ${{ inputs.channel || 'globalmusic' }}
          ROOM_RESULT_SOURCE: artifacts/youtube_playlist_result.json
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_ID_{0}', needs.prepare.outputs.channel_key_upper)] || secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_SECRET_{0}', needs.prepare.outputs.channel_key_upper)] || secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_OAUTH_REFRESH_TOKEN_{0}', needs.prepare.outputs.channel_key_upper)] || (needs.prepare.outputs.channel_key_upper == 'GLOBALMUSIC' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN) || '' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/youtube_calendar_result.py upload-start
          python scripts/youtube_publish_approved.py
      - name: Normalize room result
        if: always()
        run: |
          python scripts/normalize_room_result.py --room-id "${{ inputs.room_id }}" --platform youtube --workflow generate-youtube-playlist.yml --source artifacts/youtube_playlist_result.json --outcome "${{ job.status == 'success' && 'success' || 'failure' }}"
      - name: Preserve private upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-private-receipt-${{ github.run_id }}
          path: artifacts/youtube_playlist_result.json
          if-no-files-found: ignore
      - name: Upload room result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-room-result-${{ github.run_id }}
          path: artifacts/automation-room-result.json
          retention-days: 7
          if-no-files-found: error

  report-calendar:
    if: ${{ always() && inputs.schedule_id != '' && inputs.claim_token != '' }}
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-api-python-client google-auth requests -q
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: calendar-private-receipt-${{ github.run_id }}
          path: artifacts
      - name: Record private review URL or failure in calendar
        env:
          SCHEDULE_ID: ${{ inputs.schedule_id }}
          CLAIM_TOKEN: ${{ inputs.claim_token }}
          CHANNEL_KEY: ${{ inputs.channel }}
          WORKER_WORKFLOW: generate-youtube-playlist.yml
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: huh0303@gmail.com
          REPORT_EMAIL_FROM: huh0303@gmail.com
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/youtube_calendar_result.py finish --result artifacts/youtube_playlist_result.json

  fix_metadata:
    if: ${{ false }} # EMERGENCY LOCK: all YouTube mutation disabled
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q
      - name: Resolve channel
        id: ch
        run: echo "upper=$(echo '${{ inputs.channel }}' | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
      - name: Regenerate metadata with GPT and apply
        env:
          CHANNEL_KEY: ${{ inputs.channel }}
          FIX_VIDEO_ID: ${{ inputs.fix_video_id }}
          FIX_TOPIC: ${{ inputs.fix_topic }}
          FIX_DURATION_MIN: ${{ inputs.fix_duration_min }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENABLED: "true"
          AI_TEXT_PROVIDER: "openai"
          OPENAI_IMAGE_ENABLED: "false"
          PAID_IMAGE_GENERATION_ENABLED: "false"
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_ID_{0}', steps.ch.outputs.upper)] || secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets[format('YOUTUBE_OAUTH_CLIENT_SECRET_{0}', steps.ch.outputs.upper)] || secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets[format('YOUTUBE_OAUTH_REFRESH_TOKEN_{0}', steps.ch.outputs.upper)] || (steps.ch.outputs.upper == 'GLOBALMUSIC' && secrets.YOUTUBE_OAUTH_REFRESH_TOKEN) || '' }}
        run: python scripts/fix_video_metadata.py
