name: "One-off: remove garbled image koreainvest365 #3239"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
        run: python scripts/fix_image_3239.py
