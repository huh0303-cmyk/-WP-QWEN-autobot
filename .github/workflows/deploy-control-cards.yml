name: "Deploy control-room site cards"

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect YouTube channel-check implementation (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            printf '%s\n' '--- channel_check.py ---'
            sed -n '1,320p' "$ROOT/control_center/channel_check.py"
            printf '%s\n' '--- operations-channel-audit.json ---'
            sed -n '1,500p' "$ROOT/data/operations-channel-audit.json"
            printf '%s\n' '--- app registration ---'
            grep -RIn --exclude='*.pyc' -E 'channel_check|register_channel' "$ROOT/control_center" | head -80 || true
