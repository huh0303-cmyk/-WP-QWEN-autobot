name: "Deploy control-room site cards"

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect YouTube channel-check implementation (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ROOT=/opt/korea365
            printf '%s\n' '--- matching files ---'
            grep -RIl --exclude='*.pyc' --exclude-dir='.git' -E 'channel-check|채널 조회 실패|youtube_auth_preflight' "$ROOT" 2>/dev/null | head -80
            printf '%s\n' '--- matching source lines ---'
            grep -RIn --exclude='*.pyc' --exclude-dir='.git' -E 'channel-check|채널 조회 실패|youtube_auth_preflight' "$ROOT/control_center" "$ROOT/scripts" "$ROOT/config" 2>/dev/null | head -240 || true
            printf '%s\n' '--- relevant environment names ---'
            systemctl show korea365-control.service -p Environment --value | tr ' ' '\n' | sed 's/=.*//' | grep -E 'YOUTUBE|CHANNEL|AUDIT' | sort -u || true
            printf '%s\n' '--- service command ---'
            systemctl show korea365-control.service -p ExecStart -p WorkingDirectory
