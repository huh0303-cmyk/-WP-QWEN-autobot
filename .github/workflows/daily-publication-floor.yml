name: Daily public publication floor
# Blogger daily floor rerun after cached-source branch repair and reset 2026-09-25

on:
  # Nine passes a day, every 2 hours from KST 06:23 to 22:23 (off the hour). Each pass
  # first verifies today's PUBLIC post per site and only dispatches sites still missing,
  # at most 4 per platform per pass: 9 passes = capacity for 36 sites per platform, enough
  # for 25 WordPress / 33 Blogspot with room for one retry. Once everything is public the
  # remaining passes only read, so they cost nothing and publish nothing.
  schedule:
    - cron: "23 21,23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Optional single platform
        required: false
        type: choice
        options: ["", wordpress, blogger]
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-publication-floor
  cancel-in-progress: false

jobs:
  wordpress:
    # Safety floor: verify today's real public post first, then fill only missing sites.
    if: ${{ inputs.platform == '' || inputs.platform == 'wordpress' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests beautifulsoup4 -q
      - name: Fill missing WordPress public post for today
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
        run: python scripts/daily_publication_floor.py --platform wordpress --max-dispatch 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-floor-wordpress-${{ github.run_id }}
          path: artifacts/daily-publication-floor-wordpress.json
          retention-days: 7

  blogger:
    if: ${{ inputs.platform == '' || inputs.platform == 'blogger' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests beautifulsoup4 -q
      - name: Fill missing Blogger public post for today
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_publication_floor.py --platform blogger --max-dispatch 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-floor-blogger-${{ github.run_id }}
          path: artifacts/daily-publication-floor-blogger.json
          retention-days: 7
