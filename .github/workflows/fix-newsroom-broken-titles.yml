name: "Fix Newsroom Broken Titles + Email Leak (manual, one-off)"

# 2026-08-22 사용자 지시: theseouljournal.com/koreanews365.com에 쌓여있던
# 옛 글(제목 템플릿 버그 + CTA박스 개인이메일 노출) 190건 일괄 정리.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - name: Audit (read-only, builds manifest)
        run: python scripts/audit_newsroom_broken_titles.py
      - name: Fix titles + strip CTA email leak
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/fix_newsroom_broken_titles.py
      - name: Save manifest + result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-cleanup-manifest
          path: newsroom_broken_titles_manifest.json
          if-no-files-found: warn
          retention-days: 30
