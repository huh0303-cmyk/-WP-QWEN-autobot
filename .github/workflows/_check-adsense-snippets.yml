name: "(1회성) k-health365 AdSense 스니펫 목록 확인"

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          WP_USER: ${{ secrets.WP_USER }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/check_adsense_snippets.py
