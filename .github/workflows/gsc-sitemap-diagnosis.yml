name: "GSC 사이트맵/색인 진단 (사이트 1개)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "진단할 사이트 (예: https://k-health365.com/)"
        required: true
        default: "https://k-health365.com/"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyjwt cryptography -q
      - env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/gsc_sitemap_diagnosis.py "${{ inputs.site_url }}"
