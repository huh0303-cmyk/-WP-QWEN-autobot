name: 'WP 24 ki-korea.com isolated publish'
run-name: 'WP 24 ki-korea.com manual'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-one:
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: 'https://ki-korea.com'
      publication_approved: true
      room_id: 'manual-ki-korea-com'
      image_count: '1'
      image_policy: 'auto_free'
    secrets: inherit
