name: "Publish Watchdog — DISABLED (index-first recovery)"

# Automatic WordPress writes are intentionally frozen.
# Original workflow is preserved in git history. Re-enable only through a reviewed PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Publication freeze notice
        run: |
          echo "WordPress automatic publishing/writes are disabled."
          echo "Current mode: Google indexing and content-quality recovery only."
