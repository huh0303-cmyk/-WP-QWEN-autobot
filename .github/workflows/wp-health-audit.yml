name: WordPress read-only editorial health audit
on:
  workflow_dispatch:
  schedule:
    - cron: "37 21 * * *"
permissions:
  contents: write
concurrency:
  group: wordpress-health-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Audit published posts (no publishing credentials)
        run: python scripts/wp_health_audit.py
      - name: Commit health snapshot
        run: |
          git config user.name "korea365-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/wp_health.json
          git diff --cached --quiet && exit 0
          git commit -m "data: wordpress editorial health [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
