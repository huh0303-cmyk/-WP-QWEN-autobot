name: Language Shorts Duplicate Guard Tests

on:
  push:
    branches:
      - "fix/london-stability-2026-10-26-v2"
    paths:
      - "scripts/publish_survival_adjective_shorts.py"
      - "tests/test_language_shorts_duplicate_guard.py"
      - ".github/workflows/language-shorts-duplicate-guard-tests.yml"
  pull_request:
    paths:
      - "scripts/publish_survival_adjective_shorts.py"
      - "tests/test_language_shorts_duplicate_guard.py"
      - ".github/workflows/language-shorts-duplicate-guard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run duplicate guard regression tests
        run: python -m pytest tests/test_language_shorts_duplicate_guard.py -q
      - name: Compile publisher without running it
        run: python -m py_compile scripts/publish_survival_adjective_shorts.py
