name: Seoul Journal OAuth Credential Diagnosis (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-oauth:
    runs-on: ubuntu-latest
    environment: youtube-channels
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test available OAuth client pairs without exposing credentials
        env:
          SEOUL_REFRESH: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_REFRESH_TOKEN }}
          SEOUL_JOURNAL_ID: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_ID }}
          SEOUL_JOURNAL_SECRET: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_OAUTH_CLIENT_SECRET }}
          EXPECTED_CHANNEL: ${{ secrets.SEOUL_JOURNAL_YOUTUBE_CHANNEL_ID }}
          YOUTUBE_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          GOOGLE_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SEOUL_TOPIK_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_SEOUL_TOPIK }}
          SEOUL_TOPIK_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_SEOUL_TOPIK }}
          GLOBALMUSIC_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_GLOBALMUSIC }}
          GLOBALMUSIC_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_GLOBALMUSIC }}
          HEALING_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_HEALING }}
          HEALING_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_HEALING }}
          GLOBALMUSIC_REFRESH: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_GLOBALMUSIC }}
          HEALING_REFRESH: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_HEALING }}
          SEOUL_TOPIK_REFRESH: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_SEOUL_TOPIK }}
          GENERIC_YOUTUBE_REFRESH: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          GENERIC_GOOGLE_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check requests
          python - <<'PY'
          import os, requests
          refresh = os.getenv("SEOUL_REFRESH", "").strip()
          expected = os.getenv("EXPECTED_CHANNEL", "").strip()
          candidates = [
              ("seoul_journal_dedicated_pair", os.getenv("SEOUL_JOURNAL_ID","").strip(), os.getenv("SEOUL_JOURNAL_SECRET","").strip()),
              ("repo_youtube_pair", os.getenv("YOUTUBE_ID","").strip(), os.getenv("YOUTUBE_SECRET","").strip()),
              ("repo_google_pair", os.getenv("GOOGLE_ID","").strip(), os.getenv("GOOGLE_SECRET","").strip()),
              ("youtube_channels_seoul_topik_pair", os.getenv("SEOUL_TOPIK_ID","").strip(), os.getenv("SEOUL_TOPIK_SECRET","").strip()),
              ("youtube_channels_globalmusic_pair", os.getenv("GLOBALMUSIC_ID","").strip(), os.getenv("GLOBALMUSIC_SECRET","").strip()),
              ("youtube_channels_healing_pair", os.getenv("HEALING_ID","").strip(), os.getenv("HEALING_SECRET","").strip()),
          ]
          if not refresh or not expected:
              raise SystemExit("Required Seoul Journal refresh token or expected channel ID is missing.")
          usable = [(name,cid,secret) for name,cid,secret in candidates if cid and secret]
          if not usable:
              raise SystemExit("No complete OAuth client pairs are available to test.")
          success = False
          for name, cid, secret in usable:
              try:
                  r = requests.post("https://oauth2.googleapis.com/token", data={
                      "client_id":cid, "client_secret":secret,
                      "refresh_token":refresh, "grant_type":"refresh_token"
                  }, timeout=25)
                  if not r.ok:
                      try: code = r.json().get("error", f"HTTP_{r.status_code}")
                      except Exception: code = f"HTTP_{r.status_code}"
                      print(f"{name}: refresh_failed={code}")
                      continue
                  token = r.json()["access_token"]
                  ch = requests.get("https://www.googleapis.com/youtube/v3/channels",
                      params={"part":"id","mine":"true"},
                      headers={"Authorization":"Bearer "+token}, timeout=25)
                  if not ch.ok:
                      print(f"{name}: token_ok_but_channel_check_failed=HTTP_{ch.status_code}")
                      continue
                  ids = {item.get("id") for item in ch.json().get("items", [])}
                  if expected in ids:
                      print(f"{name}: PASS; Seoul Journal channel identity verified read-only.")
                      success = True
                      break
                  print(f"{name}: token_ok_but_expected_channel_not_returned")
              except Exception as e:
                  print(f"{name}: request_failed={type(e).__name__}")
          print("Checking whether the existing profile client/token pairs work, without uploading.")
          sanity = [
              ("globalmusic_matching_pair", os.getenv("GLOBALMUSIC_ID","").strip(), os.getenv("GLOBALMUSIC_SECRET","").strip(), os.getenv("GLOBALMUSIC_REFRESH","").strip(), "UCbJfEtsffpgI5MsKkB7BYvQ"),
              ("healing_matching_pair", os.getenv("HEALING_ID","").strip(), os.getenv("HEALING_SECRET","").strip(), os.getenv("HEALING_REFRESH","").strip(), "UC7yEsLM-HoXudngrD-4FIqg"),
              ("seoul_topik_matching_pair", os.getenv("SEOUL_TOPIK_ID","").strip(), os.getenv("SEOUL_TOPIK_SECRET","").strip(), os.getenv("SEOUL_TOPIK_REFRESH","").strip(), ""),
          ]
          for name, cid, secret, token, expected_id in sanity:
              if not all((cid, secret, token)):
                  print(f"{name}: skipped_missing_config")
                  continue
              try:
                  r = requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":secret,"refresh_token":token,"grant_type":"refresh_token"}, timeout=25)
                  if not r.ok:
                      try: code = r.json().get("error", f"HTTP_{r.status_code}")
                      except Exception: code = f"HTTP_{r.status_code}"
                      print(f"{name}: refresh_failed={code}")
                      continue
                  if expected_id:
                      ch = requests.get("https://www.googleapis.com/youtube/v3/channels",params={"part":"id","mine":"true"},headers={"Authorization":"Bearer "+r.json()["access_token"]},timeout=25)
                      ids = {item.get("id") for item in ch.json().get("items", [])} if ch.ok else set()
                      print(f"{name}: refresh_ok; expected_channel_match={expected_id in ids}")
                  else:
                      print(f"{name}: refresh_ok")
              except Exception as e:
                  print(f"{name}: request_failed={type(e).__name__}")
          print("Testing each generic client against its own stored refresh token.")
          for name, cid, secret, token in [
              ("generic_youtube_pair_with_generic_token", os.getenv("YOUTUBE_ID","").strip(), os.getenv("YOUTUBE_SECRET","").strip(), os.getenv("GENERIC_YOUTUBE_REFRESH","").strip()),
              ("generic_google_pair_with_generic_token", os.getenv("GOOGLE_ID","").strip(), os.getenv("GOOGLE_SECRET","").strip(), os.getenv("GENERIC_GOOGLE_REFRESH","").strip()),
          ]:
              if not all((cid, secret, token)):
                  print(f"{name}: skipped_missing_config")
                  continue
              try:
                  r = requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":secret,"refresh_token":token,"grant_type":"refresh_token"}, timeout=25)
                  if r.ok:
                      token = r.json()["access_token"]
                      ch = requests.get("https://www.googleapis.com/youtube/v3/channels",params={"part":"id","mine":"true"},headers={"Authorization":"Bearer "+token},timeout=25)
                      if ch.ok:
                          ids = {item.get("id") for item in ch.json().get("items", [])}
                          print(f"{name}: refresh_ok; youtube_api_ok=True; seoul_journal_match={expected in ids}")
                      else:
                          print(f"{name}: refresh_ok; youtube_api_status=HTTP_{ch.status_code}")
                  else:
                      try: code = r.json().get("error", f"HTTP_{r.status_code}")
                      except Exception: code = f"HTTP_{r.status_code}"
                      print(f"{name}: refresh_failed={code}")
              except Exception as e:
                  print(f"{name}: request_failed={type(e).__name__}")
          if not success:
              raise SystemExit("No available client pair authenticated the expected Seoul Journal channel. No upload was attempted.")
          PY
