name: "Automation Hub — platform publish"

on:
  schedule:
    # GitHub cron is UTC. Every hour at :17; Sheets/operator timestamps remain KST.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      room_id:
        description: "Automation room id for result tracking"
        required: false
        default: ""
        type: string
      platform:
        description: "Platform to process"
        required: true
        default: "blogger"
        type: choice
        options:
          - blogger
          - tistory
          - naver
          - all
      job_id:
        description: "Optional exact job_id from 자동화_발행대기"
        required: false
        type: string
      max_jobs:
        description: "Maximum ready jobs to process"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: automation-hub-platform-publish
  cancel-in-progress: false

jobs:
  publish:
    # Dedicated environment avoids the repository-level 100-secret ceiling and
    # isolates Blogger write credentials from Sheets/Drive OAuth credentials.
    environment: blogger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install google-api-python-client google-auth requests -q
      - name: Process queue
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          JOB_ID: ${{ inputs.job_id || '' }}
          MAX_JOBS: ${{ inputs.max_jobs || '1' }}
          PLATFORM_FILTER: ${{ github.event_name == 'schedule' && 'blogger' || inputs.platform || 'blogger' }}
          FAIL_ON_EMPTY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          PAID_IMAGE_GENERATION_ENABLED: "false"
          OPENAI_IMAGE_ENABLED: "false"
          BLOGGER_REVIEW_EMAIL_TO: "huh0303@gmail.com"
          BLOGGER_REVIEW_EMAIL_FROM: "huh0303@gmail.com"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/process_platform_queue.py 2>&1 | tee artifacts/platform-worker.log
      - name: Normalize room result
        if: always()
        env:
          ROOM_ID: ${{ inputs.room_id || '' }}
        run: |
          outcome="failure"
          if [ "${{ job.status }}" = "success" ]; then outcome="success"; fi
          platform="${{ github.event_name == 'schedule' && 'blogger' || inputs.platform || 'blogger' }}"
          python scripts/normalize_room_result.py --platform "$platform" --workflow platform-publish.yml --source artifacts/platform-worker.log --outcome "$outcome" --output artifacts/automation-room-result.json
      - name: Save platform result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-publish-result-${{ github.run_id }}
          path: |
            artifacts/platform-worker.log
            artifacts/automation-room-result.json
          if-no-files-found: warn
          retention-days: 14
