name: "Blogger — pick up newly-created blog IDs"

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-blog-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - env:
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/fetch_blogger_blog_ids.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/blogger_portfolio.json config/content_engine_profiles.json
          git diff --staged --quiet || git commit -m "chore: wire newly-created Blogspot blog IDs [skip ci]"
          git push
