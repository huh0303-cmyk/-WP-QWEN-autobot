name: VPS deployment safety tests
on:
  push:
    branches: [main]
    paths: ['deploy/vps/**', 'tests/test_vps_deploy.py', '.github/workflows/vps-deploy-tests.yml']
  pull_request:
    paths: ['deploy/vps/**', 'tests/test_vps_deploy.py', '.github/workflows/vps-deploy-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_vps_deploy.py -v
