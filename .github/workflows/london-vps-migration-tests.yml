name: "London — VPS migration tests"

on:
  push:
    paths:
      - "scripts/london_four_agent_pipeline.py"
      - "tests/test_london_native_wp_publisher.py"
      - ".github/workflows/london-vps-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-publisher-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install requests beautifulsoup4 lxml Pillow google-api-python-client google-auth google-genai -q
      - name: Run native publisher unit test
        run: python -m unittest tests/test_london_native_wp_publisher.py -v
