name: "Inject Trip.com Link — k-trip365.com Gyeongbokgung post (manual, one-off)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - name: Inject link + fix CTA
        env:
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
        run: python scripts/inject_tripcom_link_ktrip.py
