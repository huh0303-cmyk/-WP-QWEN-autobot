name: "One-off: diagnose k-trip365.com wrong homepage title source"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
        run: python scripts/diagnose_title_source.py
