name: K-Health365 Coupang one-post pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Insert and verify one relevant affiliate link
        env:
          WP_USER: huh0303@gmail.com
          WP_PASS: ${{ secrets.KHEALTH365COM }}
        run: |
          python - <<'PY'
          import os, requests
          from bs4 import BeautifulSoup
          base = "https://k-health365.com/wp-json/wp/v2"
          auth = (os.environ["WP_USER"], os.environ["WP_PASS"])
          product_url = "https://link.coupang.com/a/ihKqEBmP48"
          r = requests.get(base + "/posts", auth=auth,
              params={"status":"publish","per_page":100,"page":1,"orderby":"date","order":"desc",
                      "_fields":"id,date,link,title,content"}, timeout=30)
          r.raise_for_status()
          posts = r.json()
          print("LATEST_PUBLISHED_POSTS", len(posts))
          keys = ("관절","연골","콘드로이친","글루코사민","무릎","골관절")
          chosen = None
          for p in posts:
              title = BeautifulSoup(p["title"]["rendered"],"html.parser").get_text(" ",strip=True)
              body = BeautifulSoup(p["content"]["rendered"],"html.parser").get_text(" ",strip=True)
              if any(k in title + " " + body[:6000] for k in keys):
                  chosen = p
                  break
          if not chosen:
              raise SystemExit("No relevant joint-health post among newest 100; no change")
          content = chosen["content"]["rendered"]
          marker = "khealth-coupang-pilot-20261031"
          if marker in content:
              print("ALREADY_PRESENT", chosen["id"], chosen["link"])
              raise SystemExit(0)
          card = (
            f'<div id="{marker}" style="margin:28px 0;padding:18px;border:1px solid #e5e7eb;border-radius:12px;">'
            '<p style="font-size:12px;color:#777;margin:0 0 10px;">파트너스 광고</p>'
            f'<p><a href="{product_url}" target="_blank" rel="sponsored nofollow noopener" referrerpolicy="unsafe-url">'
            '<strong>관절엔 콘드로이친 1200 상품 정보 확인하기</strong></a></p>'
            '<p style="font-size:12px;color:#777;margin:10px 0 0;">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>'
            '</div>'
          )
          u = requests.post(base + f'/posts/{chosen["id"]}', auth=auth,
                            json={"content":content + "\n" + card}, timeout=30)
          u.raise_for_status()
          v = requests.get(base + f'/posts/{chosen["id"]}', auth=auth,
                           params={"context":"edit","_fields":"id,link,content,status"},timeout=30)
          v.raise_for_status()
          saved = v.json()["content"]["raw"]
          if marker not in saved or product_url not in saved:
              raise SystemExit("Read-back verification failed")
          print("INSERTED_AND_VERIFIED=1")
          print("POST_ID",chosen["id"])
          print("POST_URL",chosen["link"])
          print("PRODUCT_URL",product_url)
          PY
