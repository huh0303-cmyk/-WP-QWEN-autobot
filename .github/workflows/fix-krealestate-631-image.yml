name: "One-off: remove garbled-text image from krealestate365.com post 631"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
        run: python scripts/fix_krealestate_631_image.py
