name: "(긴급) theseouljournal 댓글 알림메일 즉시 중지"

on:
  workflow_dispatch: {}

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/disable_seouljournal_comment_emails.py
