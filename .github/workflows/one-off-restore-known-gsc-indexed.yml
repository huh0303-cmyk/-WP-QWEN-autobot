name: "긴급 — 저장된 GSC 색인 비공개글 우선 공개"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-restore-known-gsc-indexed.yml"
      - "scripts/restore_known_gsc_indexed_private_posts.py"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: "GSC 확인 저장 글 중 private만 publish"
        env:
          CONFIRM: RESTORE-KNOWN-INDEXED-PRIVATE-ONLY
          WP_USER: ${{ secrets.WP_USER }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
        run: python scripts/restore_known_gsc_indexed_private_posts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-known-gsc-indexed-${{ github.run_id }}
          path: restore_known_gsc_indexed_private_posts_result.json
          retention-days: 30
