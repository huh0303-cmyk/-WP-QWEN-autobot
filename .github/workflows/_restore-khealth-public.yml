name: "(긴급) k-health365 전체 공개 복구"

on:
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - env:
          WP_USER: ${{ secrets.WP_USER }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
        run: python scripts/restore_khealth_public.py
