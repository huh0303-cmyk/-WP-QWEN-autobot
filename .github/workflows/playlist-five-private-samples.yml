name: Five playlist samples - sequential PRIVATE uploads
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: playlist-five-private-samples
  cancel-in-progress: false
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-api-python-client google-auth -q
      - name: Healing first; wait for each private receipt before the next channel
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SAMPLE_BATCH_ID: playlist-samples-20260907
        run: python scripts/playlist_private_sample_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playlist-private-samples-${{ github.run_id }}
          path: artifacts/playlist-private-samples.json
