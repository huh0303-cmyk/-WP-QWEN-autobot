name: GitHub-only YouTube Worker Tests

on:
  pull_request:
    paths:
      - "automation_hub/youtube_github_runtime.py"
      - "scripts/youtube_github_worker.py"
      - "tests/test_youtube_github_worker_migration.py"
      - ".github/workflows/youtube-github-worker.yml"
      - ".github/workflows/github-only-youtube-worker-tests.yml"
  push:
    branches:
      - "migration/github-only-no-vps-2026-10-26"
    paths:
      - "automation_hub/youtube_github_runtime.py"
      - "scripts/youtube_github_worker.py"
      - "tests/test_youtube_github_worker_migration.py"
      - ".github/workflows/youtube-github-worker.yml"
      - ".github/workflows/github-only-youtube-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_youtube_github_worker_migration.py
      - run: python -m py_compile automation_hub/youtube_github_runtime.py scripts/youtube_github_worker.py
      - run: python scripts/audit_active_policy.py
