name: GitHub-only YouTube Worker Tests

on:
  pull_request:
    paths:
      - "automation_hub/youtube_github_runtime.py"
      - "scripts/youtube_github_worker.py"
      - "control_center/london_gpt_app.py"
      - "scripts/london_four_agent_pipeline.py"
      - "london_project_claude_console/server/server.js"
      - "london_project_claude_console/lib/githubActions.js"
      - "london_project_claude_console/public/registry.js"
      - ".github/workflows/london-content-pipeline.yml"
      - "tests/test_github_only_routing.py"
      - "scripts/audit_no_vps_runtime.py"
      - "deploy/**"
      - "tests/test_youtube_github_worker_migration.py"
      - ".github/workflows/youtube-github-worker.yml"
      - ".github/workflows/youtube-github-scheduler.yml"
      - "scripts/youtube_github_scheduler.py"
      - ".github/workflows/github-only-youtube-worker-tests.yml"
  push:
    branches:
      - "migration/github-only-no-vps-2026-10-26"
    paths:
      - "automation_hub/youtube_github_runtime.py"
      - "scripts/youtube_github_worker.py"
      - "control_center/london_gpt_app.py"
      - "scripts/london_four_agent_pipeline.py"
      - "london_project_claude_console/server/server.js"
      - "london_project_claude_console/lib/githubActions.js"
      - "london_project_claude_console/public/registry.js"
      - ".github/workflows/london-content-pipeline.yml"
      - "tests/test_github_only_routing.py"
      - "scripts/audit_no_vps_runtime.py"
      - "tests/test_youtube_github_worker_migration.py"
      - ".github/workflows/youtube-github-worker.yml"
      - ".github/workflows/youtube-github-scheduler.yml"
      - "scripts/youtube_github_scheduler.py"
      - ".github/workflows/github-only-youtube-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_youtube_github_worker_migration.py tests/test_youtube_release.py tests/test_vps_deploy.py tests/test_github_only_routing.py
      - run: python -m py_compile automation_hub/youtube_github_runtime.py scripts/youtube_github_worker.py scripts/youtube_github_scheduler.py scripts/london_four_agent_pipeline.py control_center/london_gpt_app.py control_center/app.py control_center/social_accounts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check london_project_claude_console/server/server.js && node --check london_project_claude_console/lib/githubActions.js && node --check london_project_claude_console/public/registry.js
      - run: python scripts/audit_no_vps_runtime.py
