name: "Newsrooms — quarantine legacy posts"

on:
  workflow_dispatch:
    inputs:
      site:
        description: "기존 공개 글을 비공개 격리할 신문사"
        required: true
        type: choice
        options: [koreanews365.com, theseouljournal.com, ALL]
        default: ALL
      confirm:
        description: "정확히 QUARANTINE-LEGACY-NEWS 입력"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - name: "2026-08-21 이전 공개 글을 삭제 없이 private 격리"
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/quarantine_legacy_news.py --site "${{ inputs.site }}" --confirm "${{ inputs.confirm }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsroom-legacy-quarantine-${{ github.run_id }}
          path: newsroom_legacy_quarantine_receipt.json
          if-no-files-found: warn
          retention-days: 90
