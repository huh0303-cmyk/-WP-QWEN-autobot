name: "Emergency — Restore 27 WordPress visitor counters"

on:
  workflow_dispatch:
    inputs:
      target_site_url:
        description: "Optional exact WordPress URL; blank restores all 27"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - name: Reactivate the real counter and visitor REST API on all 27 sites
        env:
          TARGET_SITE_URL: ${{ inputs.target_site_url }}
          WP_USER: ${{ secrets.WP_USER }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/deploy_daily_visitor_counter.py
      - name: Verify the requested public visitor endpoints immediately
        env:
          TARGET_SITE_URL: ${{ inputs.target_site_url }}
        run: |
          python - <<'PY'
          import os, requests, sys
          sys.path.insert(0, "scripts")
          from site_registry import ACTIVE_SITES
          requested=os.environ.get("TARGET_SITE_URL", "").strip().rstrip("/")
          targets=[row for row in ACTIVE_SITES if not requested or row[0].rstrip("/")==requested]
          failures=[]
          for site, _, _ in targets:
              response=requests.get(site.rstrip("/")+"/wp-json/site-stats/v1/visitors", timeout=25)
              data=response.json() if response.ok else {}
              ok=response.status_code==200 and {"count","yesterday_count","day_before_yesterday_count","total"}.issubset(data)
              print(site, response.status_code, "PASS" if ok else "FAIL")
              if not ok: failures.append(site)
          if failures: raise SystemExit("Missing visitor endpoints: "+", ".join(failures))
          print(f"VISITOR COUNTER API PASS: {len(targets)}/{len(targets)}")
          PY
