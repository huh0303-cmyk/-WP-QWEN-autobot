name: Vocabulary ElevenLabs replacement - owner requested
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vocabulary-elevenlabs-samples
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect ElevenLabs availability
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/vocabulary_elevenlabs_samples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocabulary-elevenlabs-samples
          path: vocabulary_elevenlabs_samples/
          retention-days: 3
