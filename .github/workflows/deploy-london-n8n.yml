name: Deploy London n8n
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy n8n and gateway
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            ROOT=/opt/korea365
            git -C "$ROOT" fetch origin main
            git -C "$ROOT" reset --hard origin/main
            mkdir -p "$ROOT/data/n8n"
            chown -R 1000:1000 "$ROOT/data/n8n"
            chmod 700 "$ROOT/data/n8n"
            if [ ! -f /etc/korea365/n8n.env ]; then
              umask 077
              ENC=$(openssl rand -hex 32)
              GATE=$(openssl rand -hex 32)
              printf '%s\n' \
                'TZ=Asia/Seoul' \
                'GENERIC_TIMEZONE=Asia/Seoul' \
                'N8N_PORT=5678' \
                'N8N_LISTEN_ADDRESS=127.0.0.1' \
                'N8N_DIAGNOSTICS_ENABLED=false' \
                'N8N_PERSONALIZATION_ENABLED=false' \
                'N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true' \
                'N8N_RUNNERS_ENABLED=true' \
                'N8N_BLOCK_ENV_ACCESS_IN_NODE=false' \
                "N8N_ENCRYPTION_KEY=$ENC" \
                "N8N_GATEWAY_TOKEN=$GATE" > /etc/korea365/n8n.env
            fi
            install -m 644 "$ROOT/deploy/systemd/korea365-n8n-gateway.service" /etc/systemd/system/korea365-n8n-gateway.service
            systemctl daemon-reload
            systemctl enable --now korea365-n8n-gateway.service
            cd "$ROOT/deploy/n8n"
            docker compose pull
            docker compose up -d
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:5678/healthz >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:5678/healthz
            curl -fsS http://127.0.0.1:8766/health
            docker exec korea365-n8n n8n import:workflow --input=/workflows/wp25_master.json
            docker exec korea365-n8n n8n import:workflow --input=/workflows/blogger33_master.json
            docker ps --filter name=korea365-n8n --format 'N8N={{.Status}}'
            systemctl is-active korea365-n8n-gateway.service
