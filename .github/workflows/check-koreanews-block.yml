name: "One-off: reproduce koreanews365.com 403 from Actions runner and list plugins"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q
      - env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/check_koreanews_block.py
