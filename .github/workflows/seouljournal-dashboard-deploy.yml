name: Deploy The Seoul Journal dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/theseouljournal_newsroom_dashboard.php
      - scripts/deploy_theseouljournal_dashboard.py
      - scripts/ensure_theseouljournal_categories.py
      - .github/workflows/seouljournal-dashboard-deploy.yml

permissions:
  contents: read

concurrency:
  group: seouljournal-dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - name: Deploy active Code Snippet
        env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/deploy_theseouljournal_dashboard.py
      - name: Ensure editorial categories
        env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/ensure_theseouljournal_categories.py
