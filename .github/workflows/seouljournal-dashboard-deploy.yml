name: Deploy The Seoul Journal dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/theseouljournal_newsroom_dashboard.php
      - scripts/deploy_theseouljournal_dashboard.py
      - scripts/ensure_theseouljournal_categories.py
      - scripts/fill_theseouljournal_featured_images.py
      - scripts/fill_koreanews_featured_images.py
      - .github/workflows/seouljournal-dashboard-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Deploy active Code Snippet
        env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/deploy_theseouljournal_dashboard.py
      - name: Ensure ten editorial categories
        env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/ensure_theseouljournal_categories.py
      - name: Fill missing licensed featured images
        env:
          WP_USER: ${{ secrets.WP_USER }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python scripts/fill_theseouljournal_featured_images.py
