name: 27개 사이트 방문자/색인 현황 (매일 아침 구글시트 업데이트)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 22 * * *"   # 07:00 KST (전날 22:00 UTC)

permissions:
  contents: write

concurrency:
  group: daily-site-traffic
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pyjwt cryptography google-api-python-client google-auth google-auth-httplib2 -q

      - name: "사이트 트래픽/색인 현황 조회 → 구글시트 전송"
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SHEETS_WEBHOOK: ${{ secrets.SHEETS_WEBHOOK }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/daily_site_traffic.py

      - name: "결과 JSON 저장소에 커밋 (시트 없이도 바로 확인 가능하게)"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add daily_site_traffic_result.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 27사이트 방문자/색인 현황 갱신 [skip ci]"
          git push
