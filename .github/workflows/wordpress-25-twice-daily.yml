name: "WordPress — once daily automatic"

on:
  # Legacy manual compatibility only. Scheduled publication is owned by
  # daily-publication-floor.yml.
  workflow_dispatch:
    inputs:
      slot:
        description: "Legacy compatibility; daily publication only"
        required: false
        type: choice
        options: ["", "am", "pm"]
        default: ""
      target_site_url:
        description: "Optional exact test target; blank = all 25"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: wordpress-25-twice-daily
  cancel-in-progress: false

jobs:
  wordpress_daily:
    if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: ${{ fromJSON(inputs.target_site_url != '' && format('["{0}"]', inputs.target_site_url) || '["https://k-health365.com","https://koreamedicaltour.com","https://koreainvest365.com","https://koreainsurance365.com","https://kfinance365.com","https://koreataxnlaw.com","https://koreacrypto365.com","https://krealestate365.com","https://ktech365.com","https://kskin365.com","https://oliveyoungkorea.com","https://kworld365.com","https://k-trip365.com","https://k-visa365.com","https://koreawedding365.com","https://kstudy365.com","https://studyinkorea365.com","https://kieca-korea.org","https://ksa-korea.org","https://jobkorea365.com","https://jobinkorea365.com","https://jobkoreaglobal.com","https://korea365.org","https://koreanews365.com"]') }}
    uses: ./.github/workflows/daily-network-publish.yml
    with:
      target_site_url: ${{ matrix.site }}
      publication_approved: true
      image_count: "1"
    secrets: inherit

