name: "Newsrooms — deploy front pages"

on:
  workflow_dispatch:
    inputs:
      site:
        description: "첫 화면을 배포할 신문사"
        required: true
        type: choice
        options: [koreanews365.com, theseouljournal.com, ALL]
        default: ALL
      confirm:
        description: "정확히 DEPLOY-NEWSROOM-FRONT-PAGE 입력"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests -q
      - name: "신문사별 front-page 템플릿 백업·배포"
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/deploy_newsroom_front_page.py --site "${{ inputs.site }}" --confirm "${{ inputs.confirm }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsroom-front-page-receipt-${{ github.run_id }}
          path: newsroom_front_page_receipt.json
          if-no-files-found: warn
          retention-days: 90
