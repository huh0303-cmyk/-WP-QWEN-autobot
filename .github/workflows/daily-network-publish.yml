name: "WordPress 25 — immediate isolated publish"

on:
  workflow_call:
    inputs:
      target_site_url:
        required: false
        type: string
        default: ""
      room_id:
        required: false
        type: string
        default: ""
      publication_approved:
        required: false
        type: boolean
        default: true
      force_keyword:
        required: false
        type: string
        default: ""
      image_count:
        required: false
        type: string
        default: "1"
      schedule_at:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target_site_url:
        description: "Optional exact WordPress target; blank runs all 25"
        required: false
        type: string
        default: ""
      room_id:
        description: "Idempotency/trace key from the control room"
        required: false
        type: string
        default: ""
      publication_approved:
        description: "Explicit public publication approval"
        required: false
        type: boolean
        default: true
      force_keyword:
        description: "Optional exact keyword"
        required: false
        type: string
        default: ""
      image_count:
        description: "Number of article images; WordPress supports 0 or 1"
        required: false
        type: string
        default: "1"
      schedule_at:
        description: "Optional future KST datetime (YYYY-MM-DDTHH:MM) — write now, publish later. Blank = publish immediately."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: wordpress-25-immediate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site:
          - k-health365.com
          - koreamedicaltour.com
          - koreainvest365.com
          - ki-korea.com
          - koreainsurance365.com
          - kfinance365.com
          - koreataxnlaw.com
          - koreacrypto365.com
          - krealestate365.com
          - ktech365.com
          - kskin365.com
          - oliveyoungkorea.com
          - kworld365.com
          - k-trip365.com
          - k-visa365.com
          - koreawedding365.com
          - kstudy365.com
          - studyinkorea365.com
          - kieca-korea.org
          - ksa-korea.org
          - sis-korea.com
          - jobkorea365.com
          - jobinkorea365.com
          - jobkoreaglobal.com
          - korea365.org
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site) }}
      - uses: actions/setup-python@v5
        if: ${{ inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site) }}
        with:
          python-version: "3.11"
      - if: ${{ inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site) }}
        run: pip install requests beautifulsoup4 lxml Pillow google-api-python-client google-auth google-genai -q
      - name: Select live keyword
        if: ${{ inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site) }}
        id: viral
        continue-on-error: true
        run: python scripts/select_live_viral_keyword.py --site "https://${{ matrix.site }}"
      - name: Publish one isolated article
        if: ${{ inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site) }}
        env:
          TARGET_SITE_URL: "https://${{ matrix.site }}"
          WP_AUTOPUBLISH_ENABLED: "true"
          WP_POST_STATUS: "publish"
          WP_PUBLICATION_APPROVED: ${{ inputs.publication_approved && 'true' || 'false' }}
          NEWSROOM_REQUIRE_PUBLICATION: "true"
          FORCE_SOURCE_IPV4: "true"
          FORCE_KEYWORD: ${{ inputs.force_keyword || steps.viral.outputs.keyword }}
          RUN_SLOT: "1"
          MAX_REGEN: "1"
          AI_TEXT_PROVIDER: "gemini"
          CHATGPT_SINGLE_MODEL_PIPELINE: "true"  # 2026-10-09 Chairman: drop the blocking two-pass GPT consensus check (was stalling k-visa365 etc.); keep the cheap deterministic title/body-cliche gate only
          WP_SCHEDULE_AT: ${{ inputs.schedule_at || '' }}  # 2026-10-09: write now, publish later (Chrome extension batch scheduling)
          OPENAI_ENABLED: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          LONDON_WRITER_MODEL: "auto_free"   # 무료 Gemini 모델 순차 폴백 (scripts/economy_text.py)
          # 마지막 수단: 무료 로컬 Qwen 2.5 3B (러너에서 필요할 때만 Ollama 설치·pull)
          LOCAL_TEXT_FALLBACK_ENABLED: "false"   # 3B local model fails SEO/quality gates and burns ~15 min; skip and let the floor retry
          RUNNER_OLLAMA_BOOTSTRAP: "false"
          LOCAL_TEXT_TIMEOUT: "900"
          LOCAL_TEXT_MAX_TOKENS: "3500"
          CLAUDE_ENABLED: "false"
          GEMINI_EDITOR_ENABLED: "false"
          OPENAI_IMAGE_ENABLED: "false"
          PAID_IMAGE_GENERATION_ENABLED: "false"
          GEMINI_IMAGE_GENERATION_ENABLED: "false"
          STOCK_IMAGES_ENABLED: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          REPLICATE_API_TOKEN: ""
          AUTOMATED_IMAGE_PUBLISHING_ENABLED: "true"
          WP_IMAGE_COUNT: ${{ inputs.image_count || '1' }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/retry_run.py --attempts 3 --timeout 1200 -- python scripts/autopost_current.py 2>&1 | tee "artifacts/${{ matrix.site }}.log"
      - name: Save result
        if: ${{ always() && (inputs.target_site_url == '' || inputs.target_site_url == format('https://{0}', matrix.site)) }}
        uses: actions/upload-artifact@v4
        with:
          name: "wp-${{ matrix.site }}-${{ github.run_id }}"
          path: |
            newsroom_publish_result.json
            artifacts/*.log
          if-no-files-found: warn
          retention-days: 3
