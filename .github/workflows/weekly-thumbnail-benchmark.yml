name: Weekly Thumbnail Benchmark (플리채널 5개, 매주 월요일)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "특정 채널만 실행하려면 선택 (비우면 5개 전부)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "kpop"
          - "romantic"
          - "mbb"
          - "healing"
          - "cafe"
  schedule:
    # 매주 월요일 01:00 KST = 일요일 16:00 UTC
    - cron: "0 16 * * 0"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests pillow google-api-python-client google-auth google-auth-httplib2 -q

      - name: Run weekly thumbnail benchmark
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/weekly_thumbnail_benchmark.py "${{ github.event.inputs.channel || 'all' }}"
