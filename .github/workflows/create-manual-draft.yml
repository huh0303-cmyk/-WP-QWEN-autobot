name: "Automation Hub — create manual WordPress draft (from Gemini Gem)"

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "WordPress site (예: https://k-health365.com)"
        required: true
        type: string
      title:
        description: "글 제목"
        required: true
        type: string
      content_html:
        description: "본문 HTML (Gem이 만든 그대로)"
        required: true
        type: string
      image_url:
        description: "대표이미지 URL (선택)"
        required: false
        default: ""
        type: string
      meta_description:
        description: "메타 설명 (선택)"
        required: false
        default: ""
        type: string
      category:
        description: "카테고리 (선택)"
        required: false
        default: ""
        type: string
      tags:
        description: "태그, 쉼표로 구분 (선택)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: manual-draft-create
  cancel-in-progress: false

jobs:
  create-draft-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests -q
      - name: Create WordPress draft
        env:
          SITE_URL: ${{ inputs.site_url }}
          DRAFT_TITLE: ${{ inputs.title }}
          DRAFT_CONTENT_HTML: ${{ inputs.content_html }}
          DRAFT_IMAGE_URL: ${{ inputs.image_url }}
          DRAFT_META_DESCRIPTION: ${{ inputs.meta_description }}
          DRAFT_CATEGORY: ${{ inputs.category }}
          DRAFT_TAGS: ${{ inputs.tags }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/create_manual_wp_draft.py
      - name: Notify for mobile review (email + Kakao)
        if: always()
        env:
          REPORT_TITLE: "[초안 검토] ${{ inputs.title }}"
          REPORT_BODY: "Gemini Gem으로 작성한 새 글이 비공개 초안으로 올라갔습니다."
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.BLOGGER_REVIEW_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.BLOGGER_REVIEW_EMAIL_FROM }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/publishing_completion_notify.py
