name: "Automation Hub — sheet-triggered auto write + draft"

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "wp_<key> or blogger_<key>, e.g. wp_ktrip365 or blogger_ktrip365"
        required: true
        type: string
      keyword:
        description: "Optional direct keyword from Control Center; otherwise use the Sheet queue"
        required: false
        type: string
      source_wp_url:
        description: "Required for a direct Blogger draft; verified public WordPress article URL"
        required: false
        type: string
      text_model:
        description: "Preferred writing engine"
        required: false
        default: "gpt-5-mini"
        type: string
      image_model:
        description: "Image engine or none"
        required: false
        default: "bytedance/sdxl-lightning-4step"
        type: string

permissions:
  contents: write

concurrency:
  # Different sites may write in parallel; the same destination is serialized.
  group: sheet-triggered-auto-write-${{ inputs.site_id }}
  cancel-in-progress: false

jobs:
  write-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/stock_image_cache
          key: stock-search-${{ runner.os }}-${{ github.run_id }}
          restore-keys: stock-search-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests google-api-python-client google-auth -q
      - name: Golden keyword -> GPT-5 mini draft -> deterministic review -> private draft
        id: write
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_ID: ${{ inputs.site_id }}
          DIRECT_KEYWORD: ${{ inputs.keyword }}
          SOURCE_WP_URL: ${{ inputs.source_wp_url }}
          TEXT_MODEL: ${{ inputs.text_model }}
          IMAGE_MODEL: ${{ inputs.image_model }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_GOOGLE_CLIENT_ID: ${{ secrets.BLOGGER_GOOGLE_CLIENT_ID }}
          BLOGGER_GOOGLE_CLIENT_SECRET: ${{ secrets.BLOGGER_GOOGLE_CLIENT_SECRET }}
          BLOGGER_GOOGLE_REFRESH_TOKEN: ${{ secrets.BLOGGER_GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BUDGET_GITHUB_REPOSITORY: ${{ github.repository }}
          BUDGET_GITHUB_BRANCH: main
          GEMINI_EDITOR_ENABLED: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_ENABLED: "true"
          OPENAI_MODEL: "gpt-5-mini"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          STOCK_IMAGES_ENABLED: "true"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_ASSET_TOKEN: ${{ github.token }}
          NANO_BANANA_FREE_TIER_ENABLED: "false"
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/auto_write_and_draft.py
      - name: Preserve estimated budget receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-estimate-${{ github.run_id }}-${{ github.run_attempt }}
          path: budget_state.json
          if-no-files-found: warn
      - name: Notify for mobile review (email + Kakao)
        if: always()
        env:
          REPORT_TITLE: "[초안 검토] ${{ inputs.site_id }} 새 글"
          REPORT_BODY: "구글시트 황금키워드 큐에서 자동 작성된 새 글이 비공개 초안으로 올라갔습니다."
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.BLOGGER_REVIEW_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.BLOGGER_REVIEW_EMAIL_FROM }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KHEALTH365COM: ${{ secrets.KHEALTH365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KIKOREACOM: ${{ secrets.KIKOREACOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KREALESTATE365COM: ${{ secrets.KREALESTATE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KSKIN365COM: ${{ secrets.KSKIN365COM }}
          OLIVEYOUNGKOREACOM: ${{ secrets.OLIVEYOUNGKOREACOM }}
          KWORLD365COM: ${{ secrets.KWORLD365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREAWEDDING365COM: ${{ secrets.KOREAWEDDING365COM }}
          KSTUDY365COM: ${{ secrets.KSTUDY365COM }}
          STUDYINKOREA365COM: ${{ secrets.STUDYINKOREA365COM }}
          KIECAKOREAORG: ${{ secrets.KIECAKOREAORG }}
          KSAKOREAORG: ${{ secrets.KSAKOREAORG }}
          SISKOREACOM: ${{ secrets.SISKOREACOM }}
          JOBKOREA365COM: ${{ secrets.JOBKOREA365COM }}
          JOBINKOREA365COM: ${{ secrets.JOBINKOREA365COM }}
          JOBKOREAGLOBALCOM: ${{ secrets.JOBKOREAGLOBALCOM }}
          KOREA365ORG: ${{ secrets.KOREA365ORG }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/publishing_completion_notify.py

      - name: Save image sources and estimated image costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-image-receipts-${{ github.run_id }}
          path: |
            artifacts/stock-image-receipts.jsonl
            artifacts/image-cost-estimates.jsonl
            artifacts/editorial-brief-cost.jsonl
          if-no-files-found: ignore
