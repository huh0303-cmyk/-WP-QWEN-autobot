name: "Rollout Test Publish — Single Site (manual, one post)"

# 2026-08-22: master_autopost.yml / publish-scheduler.yml stay frozen (index/quality
# recovery mode). This is a narrow, manual-only escape hatch for the site-by-site
# re-enable rollout agreed with the user — force exactly ONE post on ONE site so
# each site's new engine (GPT text/image + randomized length/image-count) can be
# reviewed before that site gets a real recurring schedule again. No cron trigger.
on:
  workflow_dispatch:
    inputs:
      target_site_url:
        description: "Site to force-publish exactly 1 test post to"
        required: true
        default: "https://koreainvest365.com"
        type: choice
        options:
          - "https://koreainvest365.com"
          - "https://k-visa365.com"
          - "https://koreacrypto365.com"
          - "https://kfinance365.com"
          - "https://koreamedicaltour.com"
          - "https://koreainsurance365.com"
          - "https://ktech365.com"
          - "https://k-trip365.com"
          - "https://koreataxnlaw.com"

permissions:
  contents: read

jobs:
  publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install publisher dependencies
        run: pip install requests google-genai beautifulsoup4 lxml Pillow -q
      - name: Publish one test post
        env:
          WP_AUTOPUBLISH_ENABLED: "true"
          TARGET_SITE_URL: ${{ inputs.target_site_url }}
          RUN_SLOT: "1"
          SLEEP_BETWEEN_POSTS: "2"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          SHEETS_WEBHOOK: ${{ secrets.SHEETS_WEBHOOK }}
          KOREAINVEST365COM: ${{ secrets.KOREAINVEST365COM }}
          KVISA365COM: ${{ secrets.KVISA365COM }}
          KOREACRYPTO365COM: ${{ secrets.KOREACRYPTO365COM }}
          KFINANCE365COM: ${{ secrets.KFINANCE365COM }}
          KOREAMEDICALTOURCOM: ${{ secrets.KOREAMEDICALTOURCOM }}
          KOREAINSURANCE365COM: ${{ secrets.KOREAINSURANCE365COM }}
          KTECH365COM: ${{ secrets.KTECH365COM }}
          KTRIP365COM: ${{ secrets.KTRIP365COM }}
          KOREATAXNLAWCOM: ${{ secrets.KOREATAXNLAWCOM }}
        run: python scripts/autopost_mega.py
      - name: Save publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-test-result
          path: newsroom_publish_result.json
          if-no-files-found: warn
          retention-days: 14
