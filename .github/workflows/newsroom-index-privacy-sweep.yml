name: "Newsroom Index Privacy Sweep (manual, one-off)"

# 2026-08-22 사용자 지시: 옛 글 하나하나 고치지 말고, 구글 색인된 것만
# 남기고 나머지는 비공개 전환. 이미 있던 audit_gsc_post_index.py(조사,
# GSC URL Inspection API) + apply_gsc_unindexed_private.py(실행, status=
# private로 전환, 되돌리기 가능)를 신문사 2개 대상으로 실행.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests pyjwt cryptography -q
      - name: GSC index audit — theseouljournal.com
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/audit_gsc_post_index.py --site theseouljournal.com
      - name: GSC index audit — koreanews365.com
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/audit_gsc_post_index.py --site koreanews365.com
      - name: Apply private (unindexed, 60+ days old) — theseouljournal.com
        env:
          THESEOULJOURNALCOM: ${{ secrets.THESEOULJOURNALCOM }}
        run: python scripts/apply_gsc_unindexed_private.py --site https://theseouljournal.com --execute --confirm PRIVATE_REVIEWED_UNINDEXED
      - name: Apply private (unindexed, 60+ days old) — koreanews365.com
        env:
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
        run: python scripts/apply_gsc_unindexed_private.py --site https://koreanews365.com --execute --confirm PRIVATE_REVIEWED_UNINDEXED
      - name: Save audit manifest + privacy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-index-privacy-sweep-result
          path: |
            index_audit_manifest.json
            index_privacy_receipt.json
          if-no-files-found: warn
          retention-days: 30
