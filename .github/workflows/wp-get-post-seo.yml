name: WP Get Post SEO Score (1회성 유틸)

on:
  workflow_dispatch:
    inputs:
      site_key:
        description: "사이트 시크릿 키 (예: KOREACRYPTO365COM)"
        required: true
      site_url:
        description: "사이트 URL (예: https://koreacrypto365.com)"
        required: true
      post_id:
        description: "글 ID (예: 3192)"
        required: true

jobs:
  get-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q

      - name: "SEO 점수 조회"
        env:
          WP_APP_PASSWORD: ${{ secrets[github.event.inputs.site_key] }}
        run: |
          python scripts/wp_get_post_seo.py "${{ github.event.inputs.site_url }}" "${{ github.event.inputs.post_id }}"
