name: Fill Koreanews featured images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fill_koreanews_featured_images.py
      - .github/workflows/koreanews-featured-images.yml

permissions:
  contents: read

jobs:
  fill-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Add licensed featured images to published posts
        env:
          WP_USER: ${{ secrets.WP_USER }}
          KOREANEWS365COM: ${{ secrets.KOREANEWS365COM }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python scripts/fill_koreanews_featured_images.py
