name: 아카이브 채널 업로드 (완성 폴더 → 유튜브, 주3회)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 선택"
        required: true
        type: choice
        default: "AMERICAN_ARCHIVE_TIMES"
        options:
          - "AMERICAN_ARCHIVE_TIMES"
          - "CLASSIC_READS_TIMES"
          - "NASA_SPACE_TIMES"
          - "SCIENCE_FACTS_TIMES"
          - "INVENTION_TIMES"
          - "MYTH_LEGEND_TIMES"
          - "RETRO_REELS_TIMES"
      publish_delay_hours:
        description: "예약발행까지 걸리는 시간(비우면 비공개로만 업로드)"
        required: false
        type: string
      fix_video_id:
        description: "(선택) 이미 올라간 영상에 썸네일만 나중에 붙일 때: 유튜브 영상 ID"
        required: false
        type: string
      fix_thumb_name:
        description: "(선택) 완성 폴더 안 썸네일 파일명 (예: 01_xxx_thumb.png)"
        required: false
        type: string
  schedule:
    # 월/수/금, KST 새벽 시간대로 7개 채널 분산(전부 어중간한 분 단위)
    - cron: "13 17 * * 1,3,5"  # AMERICAN_ARCHIVE_TIMES - 02:13 KST
    - cron: "27 17 * * 1,3,5"  # CLASSIC_READS_TIMES - 02:27 KST
    - cron: "41 17 * * 1,3,5"  # NASA_SPACE_TIMES - 02:41 KST
    - cron: "58 17 * * 1,3,5"  # SCIENCE_FACTS_TIMES - 02:58 KST
    - cron: "12 18 * * 1,3,5"  # INVENTION_TIMES - 03:12 KST
    - cron: "34 18 * * 1,3,5"  # MYTH_LEGEND_TIMES - 03:34 KST
    - cron: "49 18 * * 1,3,5"  # RETRO_REELS_TIMES - 03:49 KST

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests google-api-python-client google-auth google-auth-httplib2 -q

      - name: 채널 결정 + 업로드
        env:
          CHANNEL_KEY: >-
            ${{
              github.event.inputs.channel ||
              (github.event.schedule == '13 17 * * 1,3,5' && 'AMERICAN_ARCHIVE_TIMES') ||
              (github.event.schedule == '27 17 * * 1,3,5' && 'CLASSIC_READS_TIMES') ||
              (github.event.schedule == '41 17 * * 1,3,5' && 'NASA_SPACE_TIMES') ||
              (github.event.schedule == '58 17 * * 1,3,5' && 'SCIENCE_FACTS_TIMES') ||
              (github.event.schedule == '12 18 * * 1,3,5' && 'INVENTION_TIMES') ||
              (github.event.schedule == '34 18 * * 1,3,5' && 'MYTH_LEGEND_TIMES') ||
              (github.event.schedule == '49 18 * * 1,3,5' && 'RETRO_REELS_TIMES') ||
              'AMERICAN_ARCHIVE_TIMES'
            }}
          PUBLISH_AT_HOURS_FROM_NOW: ${{ github.event.inputs.publish_delay_hours }}
          FIX_VIDEO_ID: ${{ github.event.inputs.fix_video_id }}
          FIX_THUMB_NAME: ${{ github.event.inputs.fix_thumb_name }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_CLIENT_ID_NEW: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID_NEW }}
          YOUTUBE_OAUTH_CLIENT_SECRET_NEW: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET_NEW }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_AMERICAN_ARCHIVE_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_AMERICAN_ARCHIVE_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSIC_READS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_CLASSIC_READS_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_NASA_SPACE_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_NASA_SPACE_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_SCIENCE_FACTS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_SCIENCE_FACTS_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_INVENTION_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_INVENTION_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_MYTH_LEGEND_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_MYTH_LEGEND_TIMES }}
          YOUTUBE_OAUTH_REFRESH_TOKEN_RETRO_REELS_TIMES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_RETRO_REELS_TIMES }}
          ARCHIVE_OUTPUT_FOLDER_IDS_JSON: ${{ secrets.ARCHIVE_OUTPUT_FOLDER_IDS_JSON }}
        run: |
          echo "채널: $CHANNEL_KEY"
          python scripts/archive_channel_upload.py
