name: "Automation Hub — WordPress to Blogger rewrite"

on:
  workflow_dispatch:
    inputs:
      source_wp_url:
        description: "Source WordPress site URL"
        required: true
        type: string
      blogger_site_id:
        description: "site_id from 자동화_플랫폼계정"
        required: true
        type: string
      language:
        description: "Output language"
        required: true
        default: "en"
        type: string
      persona:
        description: "Blog-specific persona"
        required: true
        default: "helpful specialist editor"
        type: string
      tone:
        description: "Blog-specific tone"
        required: true
        default: "practical and clear"
        type: string
      target_chars:
        description: "Approximate output characters"
        required: true
        default: "1800"
        type: string
      publish_now:
        description: "Explicit approval to publish; default creates a review draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blogger-rewrite-queue
  cancel-in-progress: false

jobs:
  rewrite-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth -q
      - name: Golden keyword + GPT-5 mini authoring + deterministic review + approved image chain
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ENABLED: "true"
          OPENAI_MODEL: "gpt-5-mini"
          CLAUDE_ENABLED: "false"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          NANO_BANANA_FREE_TIER_ENABLED: "false"
          SOURCE_WP_URL: ${{ inputs.source_wp_url }}
          BLOGGER_SITE_ID: ${{ inputs.blogger_site_id }}
          BLOGGER_LANGUAGE: ${{ inputs.language }}
          BLOGGER_PERSONA: ${{ inputs.persona }}
          BLOGGER_TONE: ${{ inputs.tone }}
          BLOGGER_TARGET_CHARS: ${{ inputs.target_chars }}
          BLOGGER_MAX_SIMILARITY: "0.55"
          BLOGGER_MIN_QUALITY_SCORE: "70"
          BLOGGER_PUBLISH_NOW: "false"
          FORCE_SOURCE_IPV4: "true"
        run: python scripts/queue_blogger_rewrite.py
      - name: Commit budget guard state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add budget_state.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: budget guard state [skip ci]"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi
