name: Daily scheduled ten-language vocabulary Shorts

on:
  schedule:
    # Prepare and upload privately at 20:17 KST the prior evening; publish at 08:17 KST every day (owner-confirmed 1 per language per day).
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: KST release date (YYYY-MM-DD); blank uses today's KST date
        required: false
        type: string
      publish_at:
        description: Optional ISO-8601 future release time; uploads privately and schedules publication
        required: false
        type: string
      pair_id:
        description: Optional vocabulary pair override
        required: false
        type: string
      languages:
        description: all ten channels or comma-separated language codes
        required: true
        default: all
        type: string
      publish:
        description: Upload immediately after successful generation
        required: true
        default: true
        type: boolean
      replace_video_id:
        description: Optional old video ID to make private after one corrected upload is verified public
        required: false
        type: string
      replace_video_ids:
        description: Optional comma-separated language:oldVideoId map, applied only after corrected uploads are public
        required: false
        type: string

permissions:
  contents: read

# Serialize scheduled and manual runs so the same channel batch cannot overlap.
concurrency:
  group: youtube-language-adjectives-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: youtube-channels
    env:
      PYTHONUTF8: "1"
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_KO: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_KO }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_EN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_EN }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_JA: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_JA }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_ZH: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_ZH }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_VI: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_VI }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_ES: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_ES }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_FR: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_FR }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_DE: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_DE }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_IT: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_IT }}
      YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_PT: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN_LANGUAGE_PT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          else
            echo "Runner already has FFmpeg and Noto CJK fonts; skipping slow apt refresh."
          fi
          python -m pip install --disable-pip-version-check pillow edge-tts google-api-python-client google-auth hangul-romanize pykakasi pypinyin
      - name: Resolve KST date and render ten native-locale vocabulary Shorts
        id: build
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.target_date }}
          INPUT_PUBLISH_AT: ${{ inputs.publish_at }}
          INPUT_PAIR: ${{ inputs.pair_id }}
          INPUT_LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Seoul date -d 'tomorrow' +%F)"
            PUBLISH_AT="${TARGET_DATE}T08:17:00+09:00"
          else
            TARGET_DATE="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
            PUBLISH_AT="${INPUT_PUBLISH_AT:-}"
          fi
          LANGUAGES="${INPUT_LANGUAGES:-all}"
          ARGS=(--date "$TARGET_DATE" --languages "$LANGUAGES")
          if [ -n "${INPUT_PAIR:-}" ]; then
            PAIR_ID="$INPUT_PAIR"
            echo "Using explicitly requested pair override: $PAIR_ID"
          else
            PAIR_LOG="$(python scripts/select_unique_survival_pair.py --languages "$LANGUAGES")"
            echo "$PAIR_LOG"
            PAIR_ID="$(printf '%s\n' "$PAIR_LOG" | sed -n 's/^SELECTED_PAIR_ID=//p' | tail -n 1)"
            if [ -z "$PAIR_ID" ]; then
              echo "::error::No unused vocabulary pair was selected; refusing to generate repeated lessons."
              exit 1
            fi
          fi
          ARGS+=(--pair-id "$PAIR_ID")
          echo "selected_pair_id=$PAIR_ID" >> "$GITHUB_OUTPUT"
          python scripts/survival_adjective_short.py "${ARGS[@]}"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "publish_at=$PUBLISH_AT" >> "$GITHUB_OUTPUT"
          echo "languages=$LANGUAGES" >> "$GITHUB_OUTPUT"
      - name: Publish only after exact channel identity verification
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          REPLACE_VIDEO_ID: ${{ inputs.replace_video_id }}
          REPLACE_VIDEO_IDS: ${{ inputs.replace_video_ids }}
          PUBLISH_AT: ${{ steps.build.outputs.publish_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ -n "${PUBLISH_AT:-}" ]; then
            ARGS=(--date "${{ steps.build.outputs.target_date }}" --languages "${{ steps.build.outputs.languages }}" --privacy private --publish-at "$PUBLISH_AT")
          else
            ARGS=(--date "${{ steps.build.outputs.target_date }}" --languages "${{ steps.build.outputs.languages }}" --privacy public)
          fi
          if [ -n "${REPLACE_VIDEO_ID:-}" ]; then ARGS+=(--replace-video-id "$REPLACE_VIDEO_ID"); fi
          if [ -n "${REPLACE_VIDEO_IDS:-}" ]; then ARGS+=(--replace-video-ids "$REPLACE_VIDEO_IDS"); fi
          python scripts/publish_survival_adjective_shorts.py "${ARGS[@]}"
      - name: Preserve manifests and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-adjective-shorts-${{ steps.build.outputs.target_date }}
          path: artifacts/youtube/language-adjectives/${{ steps.build.outputs.target_date }}/
          retention-days: 30
          if-no-files-found: warn
